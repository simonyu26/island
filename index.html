<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#741b47">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="會考小島">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>會考小島</title>
<style>
  :root {
    --plum: #741b47; --plum-mid: #c27ba0; --plum-light: #ead1dc;
    --sea: #cfe8f3; --sand: #fdf6ec; --grass: #dff0d8; --ink: #3a2a33; --muted: #6e5f68; /* MUTED_v1 原本 #8a7480，對比不到 4.5:1（美術 10/30） */
    --card: #ffffff; --gold: #e3a21a;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
         background: var(--sea); color: var(--ink); -webkit-tap-highlight-color: transparent; }
  main { max-width: 720px; margin: 0 auto; padding: max(16px, env(safe-area-inset-top)) 16px 96px; }
  h1, h2, h3 { margin: 0 0 8px; }
  h2 { font-size: 20px; } h3 { font-size: 16px; }
  .card { background: var(--card); border-radius: 16px; padding: 16px; margin-bottom: 14px;
          box-shadow: 0 2px 0 rgba(116,27,71,.12); }
  .muted { color: var(--muted); font-size: 13px; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .grow { flex: 1; }
  button { font: inherit; border: none; border-radius: 12px; padding: 10px 16px; cursor: pointer;
           background: var(--plum); color: #fff; }
  button.ghost { background: var(--plum-light); color: var(--plum); }
  button:disabled { opacity: .5; cursor: default; }
  .floors { display: flex; gap: 6px; margin-bottom: 10px; }
  .floors button { flex: 1; padding: 8px 4px; font-size: 14px; line-height: 1.25; background: var(--plum-light); color: var(--plum); }
  .floors button small { display: block; font-size: 11px; opacity: .8; }
  .floors button.on { background: var(--plum); color: #fff; opacity: 1; }
  input, select, textarea { font: inherit; padding: 8px 10px; border: 1.5px solid var(--plum-light);
           border-radius: 10px; background: #fff; color: var(--ink); width: 100%; }
  textarea { min-height: 60px; }
  label { display: block; font-size: 13px; color: var(--muted); margin: 8px 0 4px; }

  /* 頂部狀態列 */
  .hud { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; text-align: center; }
  .hud .tap { cursor: pointer; border-radius: 10px; }
  .hud .tap:active { background: var(--sand); }
  .hud b { display: block; font-size: 20px; color: var(--plum); }
  .bar { height: 10px; background: var(--plum-light); border-radius: 6px; overflow: hidden; margin-top: 8px; }
  .bar > i { display: block; height: 100%; background: var(--plum); }

  /* 小島 */
  .island { background: var(--grass); border: 10px solid var(--sand); padding: 14px; border-radius: 32px; }
  .districts { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 10px; }
  .district { background: rgba(255,255,255,.85); border-radius: 14px; padding: 12px; }
  .resident { display: flex; gap: 10px; align-items: center; }
  .avatar { font-size: 34px; line-height: 1; }
  .grade { margin-left: auto; font-weight: 700; color: #fff; background: var(--plum); border-radius: 8px; padding: 2px 8px; }
  .grade.none { background: #bbb; }
  .town { font-size: 20px; letter-spacing: 2px; margin-top: 8px; min-height: 26px; word-break: break-all; }
  .lane { display: flex; align-items: center; gap: 6px; margin-top: 6px; }
  .lane-name { flex: 0 0 72px; font-size: 13px; color: var(--plum); }
  .lane-name small { display: block; color: var(--muted); font-size: 11px; }
  .lane .town { margin-top: 0; font-size: 17px; min-height: 0; }
  .speech { background: var(--sand); border-radius: 14px; padding: 10px 14px; position: relative; }

  /* 結算 */
  .subj { margin-top: 12px; font-weight: 700; color: var(--plum); }
  .item { display: flex; align-items: center; gap: 8px; padding: 8px 0; border-bottom: 1px dashed var(--plum-light); }
  .item .name { flex: 1; }
  .tag { font-size: 11px; background: var(--gold); color: #fff; border-radius: 6px; padding: 1px 6px; margin-left: 4px; }
  .seg { display: flex; border-radius: 10px; overflow: hidden; border: 1.5px solid var(--plum-light); }
  .seg button { border-radius: 0; padding: 6px 10px; background: #fff; color: var(--muted); }
  .seg button[data-s="2"].on { background: var(--plum); color: #fff; }
  .seg button[data-s="1"].on { background: var(--plum-mid); color: #fff; }
  .seg button[data-s="0"].on { background: var(--plum-light); color: var(--plum); }
  .tbtn { padding: 6px 9px; background: var(--sand); color: var(--plum); }
  .plants { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; margin-top: 8px; }
  .plant { text-align: left; background: #fff; color: var(--ink, #3a2a33); border: 1.5px solid var(--plum-light); border-radius: 14px; padding: 8px 10px; font-size: 13px; line-height: 1.5; }
  .plant.on { border-color: var(--plum); background: var(--plum-light); }
  .plant:disabled { opacity: .5; }
  .plant .pe { font-size: 26px; float: left; margin-right: 6px; line-height: 1.2; }
  .plant .now { display: inline-block; background: #e6f4dc; color: #3f7a45; border-radius: 999px; padding: 0 6px; font-size: 11px; }
  .gmap { width: 100%; max-width: 420px; display: block; margin: 8px auto 0; touch-action: manipulation; }
  .gmap .free { cursor: pointer; }
  .focus { background: var(--sand); border-radius: 14px; padding: 12px 14px; margin: 8px 0; }
  .focus .clock { font-size: 34px; font-weight: 700; color: var(--plum); font-variant-numeric: tabular-nums; }
  .focus select { width: auto; flex: 1; min-width: 0; }
  .focusPill { position: sticky; top: 6px; z-index: 5; display: flex; gap: 8px; align-items: center; background: var(--sand); color: var(--plum);
               border: 1.5px solid var(--plum-light); border-radius: 999px; padding: 6px 14px; margin-bottom: 10px; cursor: pointer; }
  .check { width: 22px; height: 22px; accent-color: var(--plum); }

  .badges { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 8px; }
  .badge { text-align: center; padding: 10px 6px; border-radius: 12px; background: var(--sand); font-size: 12px; }
  .badge .ic { font-size: 28px; display: block; }
  .badge.locked { filter: grayscale(1); opacity: .45; }

  td:first-child { white-space: nowrap; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  th, td { padding: 6px 4px; text-align: center; border-bottom: 1px solid var(--plum-light); }

  /* 底部分頁 */
  nav { position: fixed; bottom: 0; left: 0; right: 0; background: #fff; display: flex;
        box-shadow: 0 -2px 8px rgba(0,0,0,.08); padding-bottom: env(safe-area-inset-bottom); }
  nav button { flex: 1; background: none; color: var(--muted); border-radius: 0; padding: 10px 0 8px; font-size: 12px; }
  nav button span { display: block; font-size: 22px; }
  nav button.on { color: var(--plum); font-weight: 700; }

  .kpic { width: 1.25em; height: 1.25em; border-radius: 50%; object-fit: cover; vertical-align: middle; background: #fff; }
  .noren { display: flex; gap: 0; justify-content: center; align-items: flex-start; height: 46px; border-radius: 16px 16px 0 0; position: relative; overflow: hidden; margin-bottom: -2px; }
  .noren span { font-weight: 700; letter-spacing: 6px; padding-top: 10px; font-size: 18px; text-shadow: 0 1px 2px #0003; }
  .noren i { position: absolute; top: 14px; bottom: 0; width: 2px; background: #0002; }
  .noren i:nth-of-type(1) { left: 25%; } .noren i:nth-of-type(2) { left: 50%; } .noren i:nth-of-type(3) { left: 75%; }
  .namePlate { display: inline-block; background: linear-gradient(#c89a63, #a87a45); color: #3b2512; padding: 2px 12px; border-radius: 4px; box-shadow: inset 0 0 0 2px #7a532a55, 0 2px 3px #0002; font-size: 0.9em; }
  .diary .dpage { background: #fffdf7; border: 1px solid #e8dcc6; border-top: 8px solid #c0504d; border-radius: 6px; padding: 10px 14px; margin-top: 10px; text-align: center; }
  .diary .dmon { color: #c0504d; font-weight: 700; } .diary .dday { font-size: 44px; font-weight: 700; line-height: 1; } .diary .dwk { color: #8a6a7a; font-size: 13px; }
  .diary .diaryText { margin-top: 10px; font-size: 17px; text-align: left; white-space: pre-wrap; min-height: 1.4em; }
  .pic { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; vertical-align: middle; background: #fff; }
  .avatar .pic { width: 52px; height: 52px; }
  .ipic { width: 1.4em; height: 1.4em; border-radius: 50%; object-fit: cover; vertical-align: -0.35em; background: #fff; }
  .upl { margin-top: 6px; }
  .upl label.btn { display: inline-block; margin: 0; font-size: 14px; background: var(--plum-light); color: var(--plum); padding: 6px 12px; border-radius: 10px; cursor: pointer; }
  .upl button { font-size: 14px; padding: 6px 12px; }
  .emojis { display: flex; flex-wrap: wrap; gap: 4px; }
  .emojis button { background: #fff; border: 1.5px solid var(--plum-light); font-size: 22px; padding: 4px 6px; }
  .emojis button.on { border-color: var(--plum); background: var(--plum-light); }

  /* TOAST_v1 提示泡泡：在底部導覽上方（沒有導覽就貼 safe-area 底部），位置由 toastPlace() 算；點得穿，不擋按鈕 */
  .toast { position: fixed; left: 50%; bottom: calc(12px + env(safe-area-inset-bottom)); transform: translateX(-50%); background: var(--ink); color: #fff;
           padding: 10px 18px; border-radius: 12px; z-index: 9; display: none; max-width: 90%; pointer-events: none; }
  .loading { text-align: center; padding: 60px 0; color: var(--muted); }
  .big { font-size: 40px; text-align: center; }

  /* 計畫頁 */
  .chips { display: grid; grid-template-columns: repeat(8, 1fr); gap: 4px; }
  .chip { padding: 6px 0; background: var(--sand); color: var(--ink); border-radius: 10px; font-size: 15px; font-weight: 700; line-height: 1.2; }
  .chip small { display: block; font-size: 10px; font-weight: 400; color: var(--muted); }
  .chip i { display: block; font-style: normal; font-size: 10px; font-weight: 400; color: var(--plum); min-height: 12px; }
  .chip.today { box-shadow: inset 0 0 0 2px var(--gold); }
  .chip.on { background: var(--plum); color: #fff; } .chip.on small, .chip.on i { color: #fde; }
  button.x { background: none; color: var(--muted); padding: 4px 6px; }
  label.btn { display: block; margin: 0; font-size: 16px; background: var(--plum); color: #fff; padding: 10px 16px; border-radius: 12px; cursor: pointer; }
  .purple-ic { display: inline-block; filter: hue-rotate(185deg) saturate(1.4); }   /* 紫色的烏龜 */
  .pill { display: inline-block; background: var(--plum-light); color: var(--plum); border-radius: 8px; padding: 2px 8px; margin: 2px 4px 2px 0; font-size: 13px; }
  .step { display: flex; align-items: center; gap: 4px; }
  .step button { padding: 4px 10px; } .step b { min-width: 26px; text-align: center; }
  /* 故事任務 */
  .opts { display: grid; gap: 6px; }
  .opt { background: #fff; color: var(--ink); border: 1.5px solid var(--plum-light); text-align: left; }
  .opt.right { background: #dff3e3; border-color: #3f9a55; color: #1f5a2e; opacity: 1; }
  .opt.wrong { background: #fbe0e0; border-color: #c0392b; color: #7a1f1f; opacity: 1; }
  .env { font-size: 13px; color: var(--muted); }
  /* 我的家 */
  .room { display: flex; flex-direction: column; justify-content: space-between; min-height: 230px; padding: 12px 8px; border-radius: 14px; border: 2px solid var(--plum-light); }
  .zone { display: flex; flex-wrap: wrap; justify-content: center; gap: 4px 10px; min-height: 70px; align-items: flex-end; }
  .slot { display: flex; flex-direction: column; align-items: center; justify-content: flex-end; min-width: 52px; }
  .slot .pic { width: 40px; height: 40px; }
  .slot span { font-size: 34px; line-height: 1.1; } .slot small { font-size: 10px; color: var(--muted); }
  .furn { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 6px; margin-top: 8px; }
  .furn button { background: #fff; color: var(--ink); border: 1.5px solid var(--plum-light); padding: 8px 4px; font-size: 13px; }
  .furn button span { display: block; font-size: 26px; } .furn button small { display: block; color: var(--muted); font-size: 11px; }
  /* 今日のおつとめ板 */
  .board .brow { display: flex; align-items: center; gap: 8px; width: 100%; background: none; color: var(--ink); padding: 10px 2px; border-radius: 0; border-top: 1px dashed var(--plum-light); text-align: left; }
  .board .brow:first-of-type { border-top: 0; }
  .board .brow .ic { font-size: 20px; width: 26px; text-align: center; }
  .board .brow .nm { flex: 1; font-weight: 700; }
  .board .brow .chev { color: var(--muted); font-size: 13px; width: 14px; text-align: center; }
  .st { font-size: 12px; border-radius: 999px; padding: 2px 9px; white-space: nowrap; }
  .st.done { background: #dcebd3; color: #35562a; }
  .st.todo { background: #fbe9c4; color: #7a5507; }
  .st.info { background: var(--plum-light); color: var(--plum); }
  .board .bbody { background: var(--sand); border-radius: 14px; padding: 12px; margin: 0 0 10px; }
  .board .bbody .card { background: transparent; box-shadow: none; border: none !important; padding: 0; margin: 0; border-radius: 0; }
  .board .bbody .speech { background: #fff; }
  .mailbtn { position: relative; padding: 4px 10px; }
  .mailbtn .dot { position: absolute; top: -5px; right: -5px; min-width: 18px; height: 18px; border-radius: 9px; background: #d9534f; color: #fff; font-size: 11px; line-height: 18px; text-align: center; padding: 0 4px; }
  .stamps { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin-top: 10px; }
  .stamp { aspect-ratio: 1; border: 2px dashed var(--plum-light); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: 13px; }
  .stamp.today { border-color: var(--plum); }
  .stamp.on { border: 2px solid #c0392b; background: #fff5f3; color: #c0392b; font-weight: 700; font-size: 18px; transform: rotate(-8deg); }
  .hanko { display: inline-flex; width: 30px; height: 30px; border: 2px solid #c0392b; border-radius: 50%; color: #c0392b; font-weight: 700; align-items: center; justify-content: center; transform: rotate(-8deg); }
  .greet { position: fixed; inset: 0; background: rgba(60, 20, 45, .35); display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 50; animation: fadeIn .3s; }
  .greet-card { background: #fff; border-radius: 24px; padding: 22px 18px; max-width: 380px; width: 100%; text-align: center; box-shadow: 0 10px 40px rgba(0,0,0,.2); animation: popIn .45s cubic-bezier(.2,1.4,.4,1); }
  .greet-pic { font-size: 64px; line-height: 1; } .greet-pic .pic { width: 84px; height: 84px; }
  @keyframes fadeIn { from { opacity: 0; } } @keyframes popIn { from { transform: scale(.7); opacity: 0; } }
  .exq img { display: block; width: 100%; height: auto; background: #fff; border: 1px solid var(--plum-light); border-radius: 10px; margin: 10px 0 6px; }
  .opts.abcd { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; } .opts.abcd .opt { text-align: center; font-weight: 700; }
  .tiers { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 8px; }
  .tiers button { padding: 10px 4px; font-size: 14px; line-height: 1.4; } .tiers button small { display: block; font-size: 11px; opacity: .85; }
  .furn button.on { border-color: var(--plum); background: var(--plum-light); } .furn button.has { background: var(--sand); }
  .agrid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; background: #d9b88f; padding: 6px; border-radius: 10px; border-top: 6px solid var(--plum-light); border-left: 6px solid var(--plum-light); max-width: 300px; margin: 0 auto; }
  .agrid button { aspect-ratio: 1; padding: 0; background: #f3e3c9; border: 1.5px dashed #c7a578; color: var(--ink); font-size: 24px; min-width: 0; }
  .wphoto{margin:4px 0 8px}.wphoto img{display:block;width:100%;max-height:260px;object-fit:contain;background:#f4efe6;border-radius:12px;cursor:zoom-in}.wzoom{position:fixed;inset:0;z-index:1000;background:rgba(20,16,12,.92);overflow:auto;cursor:zoom-out;display:flex}.wzoom img{margin:auto;max-width:none;display:block}.wzoom button{position:fixed;top:12px;right:12px;width:44px;height:44px;padding:0;border:0;border-radius:22px;background:rgba(0,0,0,.55);color:#fff;font-size:22px;line-height:44px;cursor:pointer}.wphoto figcaption{font-size:13px;color:#6b5a4a;margin-top:4px;line-height:1.5}.wphoto figcaption span{display:block;font-size:11px;color:#9a8a7a}
.agrid button.on { background: var(--plum-light); border: 2px solid var(--plum); }
  .arow { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
  .arow.a3 { grid-template-columns: repeat(3, 1fr); }
  .arow button { height: 44px; padding: 0; background: #f3e3c9; border: 1.5px dashed #c7a578; color: var(--ink); font-size: 20px; min-width: 0; letter-spacing: -4px; }
  .arow button.on { background: var(--plum-light); border: 2px solid var(--plum); }
  /* 智慧島（v2.24）：渡船靠岸的小島插畫、導師小屋、上課、集章冊 */
  .wscene { border-radius: 14px; overflow: hidden; margin-top: 6px; } .wscene svg { display: block; width: 100%; height: auto; }
  .whut { cursor: pointer; } .whut:hover rect:first-of-type, .whut:active rect:first-of-type { filter: brightness(1.05); }
  .whcard { cursor: pointer; }
  /* 各頁縮短：收起來的區塊、分頁列、玩法說明目錄 */
  details.fold > summary { cursor: pointer; list-style: none; display: flex; align-items: baseline; gap: 6px; }
  details.fold > summary::-webkit-details-marker { display: none; }
  details.fold > summary::before { content: '▸'; color: var(--muted); font-size: 13px; transition: transform .15s; }
  details.fold[open] > summary::before { transform: rotate(90deg); }
  details.fold > summary h3 { margin: 0; display: inline; }
  .ghead { margin: 18px 4px 8px; color: var(--plum); }
  .gsec { padding: 12px 16px; margin-bottom: 8px; }
  .helpchip { display: flex; justify-content: flex-end; margin: -4px 0 6px; }
  .helpchip button { padding: 4px 10px; font-size: 13px; }
  .htabs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-bottom: 12px; }
  .htabs button { padding: 8px 4px; font-size: 14px; }
  .wstamps { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; margin-top: 6px; }
  .wstamp { aspect-ratio: 1; border: 2px dashed var(--plum-light); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: 12px; background: none; padding: 0; }
  .wstamp.on { border-style: solid; background: #fff5f3; font-weight: 700; font-size: 14px; transform: rotate(-8deg); }
  .opt.mine { background: var(--plum-light); border-color: var(--plum); opacity: 1; }
  .wnote { background: var(--sand); border-radius: 12px; padding: 10px 12px; margin-top: 8px; line-height: 1.7; }
  .wwidget { text-align: center; background: var(--sand); border-radius: 14px; padding: 14px 10px; margin: 8px 0; }
  .wbubble { width: 70px; height: 70px; margin: 26px auto; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #fff, #bfe6f0); display: flex; align-items: center; justify-content: center; font-size: 30px; }
  /* 獨立書店（v2.17）：台灣巷弄書店的店內插畫，店貓在幾個點之間走動 */
  .bscene { position: relative; width: 100%; aspect-ratio: 400 / 280; border-radius: 18px; overflow: hidden; background: #f1ead9; box-shadow: inset 0 0 0 1px rgba(90,60,30,.15); margin-top: 10px; user-select: none; -webkit-user-select: none; }
  .bscene .keeper { position: absolute; left: 86%; top: 63%; transform: translate(-50%, -100%); font-size: 34px; z-index: 2; line-height: 1; cursor: pointer; }
  .bscene .keeper .kpic { width: 40px; height: 40px; }
  .bscene svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .bscene .keeper .nm, .bscene .cat .nm { display: none; }
  .bscene .cat { position: absolute; font-size: 30px; line-height: 1; transform: translate(-50%, -100%); transition: left 3.2s ease-in-out, top 3.2s ease-in-out; cursor: pointer; z-index: 3; }
  .bscene .cat .kpic { width: 32px; height: 32px; }
  .bscene .cat .body { display: inline-block; }
  .bscene .cat.walk .body { animation: bsWalk .45s ease-in-out infinite alternate; }
  .bscene .cat.wash .body { animation: bsWash 1.1s ease-in-out infinite; }
  .bscene .cat.sleep .body { transform: scaleY(.72) translateY(14%); }
  .bscene .cat.flip .body { transform: scaleX(-1); }

  { v: '2.47', date: '2026-10-27', items: ['🧮 數學瓶如果不是一時算錯，這次只要選怎麼列式、第一步怎麼做，不用算出答案；算錯的照舊完整算一次。第三次漂回來的考古題還是要完整算。', '🍶 每天撿的瓶子裡，數學最多 2 個，其他名額留給別科；別科沒有瓶子時，數學瓶照樣補上。'] },
  { v: '2.46', date: '2026-10-27', items: ['📅 照計畫完成一項的經驗值，從 +10 提高到 +25（做了一部分從 +5 提高到 +12，Boss 項目一樣雙倍）。讀完一項通常要花不少時間，比做一題久很多，所以多給一些。上週一（10/19）起完成的項目都照新的算，多出來的{補}已經補進去了。'] },
  { v: '2.45.1', date: '2026-10-27', minor: true, items: ['🗼 燈塔不再顯示海灘上一共有幾個瓶子，只告訴你今天漂回來幾個'] },
  { v: '2.45', date: '2026-10-28', items: ['📜 瓶子第三次漂回來時，改放一題同單元、你還沒做過的會考考古題。答對變成燈籠，多一個「考古題也答對」；沒答對的話，原本的瓶子留著、再答對一次就好，這題另外變成新瓶子。', '⭐ 已補強的單元，最近 5 題至少對 4 題，會多一顆星。'] },
  { v: '2.44.1', date: '2026-10-27', minor: true, items: ['🗼 燈室的單元重新整理過：生物的「神經與內分泌」改叫「感應與協調」，植物的感應也算在裡面；另外有十幾題考古題換到更準的單元，有些從生物、地科換到理化'] },
  { v: '2.44', date: '2026-10-27', items: ['🎼 島上多了一座音樂廳：上課練習、樂團排練、聽音樂會看展覽、畫畫寫書法都可以來計時，每 25 分鐘一個音符 🎵 +10 綠點，跟以前一樣；第一次去可以請一位自己的管理員。這週有來，晚上音樂廳的玻璃會亮著。'] },
  { v: '2.43', date: '2026-10-27', items: ['📷 拍錯題更快了：首頁「今日のおつとめ」多了「拍錯題」，一按就進去，也會記得你上次選的科目。燈塔的拍照卡移到瓶子上面，不用往下找。', '讀出來的題先只列題目開頭和答案，AI 讀錯了再點開修改；沒讀出來時，可以用同一張照片再試一次，不用重拍。'] },
  { v: '2.42.1', date: '2026-10-27', items: ['🔭 燈室也變短了：正在補強、再看一眼、大家會、你還沒會放在上面；已補強、跟一開始的自己比、時間花在哪裡、最常錯的原因收起來，點標題才打開。'] },
  { v: '2.42', date: '2026-10-27', items: ['🗼 燈塔最上面多了一列樓層：1F 海灘、2F 航海日誌、3F 燈室、碼頭，一按就過去。還在海上漂的瓶子、燈籠和家具收起來了，點標題才打開，畫面短很多。'] },
  { v: '2.41', date: '2026-10-27', items: ['🧺 商店多了素材櫃：常見素材一個 🪙 2，一天可以買 5 個，買了放進竹籃，到屋台做料理', '💰 做好的料理可以賣給商店：一天最多賣得 🪙 10，也不超過當天讀書拿到的素材數'] },
  { v: '2.40.4', date: '2026-10-27', minor: true, items: ['📷 拍錯題的照片一天不限張數了；每天的前 10 題有經驗值，超過的還是會收進海灘'] },
  { v: '2.40.3', date: '2026-10-27', items: ['📷 拍照收錯題現在一天可以算到 10 題了！這幾天超過 5 題的那 5 題，經驗值 +25 已經補上。謝謝你這麼認真把這些題目收好。'] },
  { v: '2.40.2', date: '2026-10-27', items: ['🔐 你在智慧島、紙船、這週一句話和跨科連結寫的字，家人碼看不到了；願望只給爸爸看，送書的那句話只給收書的人。「誰看得到什麼」也一起更新'] },
  { v: '2.40', date: '2026-10-27', items: ['🎞️ 3D 畫面不順時會自動調低畫質，順了再調回來（小島、智慧島、我的家都會）'] },
  { v: '2.39.2', date: '2026-10-27', minor: true, items: ['📷 拍照收錯題的經驗值，一天最多算 10 題（原本 5 題）', '⭐ 使用說明的「經驗值怎麼算」補上燈塔撿瓶子、拍照收錯題和運動'] },
  { v: '2.39.1', date: '2026-10-27', items: ['👀 燈室多了「再看一眼」：老朋友漂回來時沒答到的題會列在這裡', '📷 記完 Boss 戰，可以順手把這場的錯題拍照收進燈塔', '🗼 燈塔的話會提到這週補起來的地方'] },
  { v: '2.39', date: '2026-10-27', items: ['🧭 燈室的「正在補強」可以按「練一題」，從那個單元你還沒做過的考古題抽一題；挑戰任務選「隨便一條」時，每天前 3 題會從正在補強的單元出，不想要可以在挑戰卡上關掉。', '📘 撿瓶子時，如果你記的原因是觀念不熟或用猜的，會先看一張這個單元的觀念小卡，可以跳過。', '🗂️ 考古題的單元重新整理過，有幾題換到更合適的單元或科目，燈室的「正在補強」會跟著更新。'] },
  { v: '2.38.1', date: '2026-10-27', minor: true, items: ['島民和店主講話改用台灣的說法，例如「午安」'] },

  { v: '2.37', date: '2026-10-26', items: ['🧭 看不懂題目而錯的瓶子，撿起來會先問「這題在問什麼」，選完再答，不影響經驗值和島幣', '📝 一時看錯／算錯的瓶子，可以寫一句「下次要檢查什麼」，之後同一個單元的題目會先提醒你'] },

  { v: '2.36', date: '2026-10-26', items: ['🧭 燈室可以請一位學習顧問（AI）了：學習顧問看得到你交出去的計畫，還有爸爸給的每週檢討和大考成績。爸爸會把下週的航線建議貼在燈室，只是參考，由你決定', '📤 計畫頁可以把這週的計畫整理好給學習顧問看：你按「複製」才會拿到文字，不會自動送出'] },
  { v: '2.35.2', date: '2026-10-26', items: ['🔐 「誰看得到什麼」寫得更清楚了：沒分享的內容存在哪裡、誰打得開，哪些內容會交給 AI'] },
  { v: '2.35.1', date: '2026-10-26', items: ['🥤 喝水也能換綠點：在「我的家」的喝水卡記一筆，每 250cc（一杯）+10 綠點，一天最多算 2,000cc；喝水的紀錄只有你自己看得到'] },
  { v: '2.35', date: '2026-10-26', items: ['🧭 答錯的題可以一鍵記下原因：一時看錯／算錯、觀念不熟、看不懂題目、用猜的', '🫧 答對但有點猜的題，會變成輕輕的瓶子漂回來；下次有把握答對，它就變成燈籠', '🏮 燈室多了「正在補強／已補強」：考古題每一題都標好了單元，做滿 5 題的單元才會列出來', '🔤 英文的題型分得更細了，文法分成 15 個主題，例如時態、被動語態、關係代名詞'] },
  { v: '2.34.2', date: '2026-10-26', items: ['🫶 如果你寫給老師或燈塔的話讓人擔心，回應會附上可以求助的地方（學校輔導室、1925 安心專線），也會請爸爸來關心你；爸爸看不到你寫的字', '💬 島民很久沒見到你，只會說想你，不會抱怨'] },
  { v: '2.34.1', date: '2026-10-26', items: ['⛴️ 智慧島前六講的內容校正過了：幾處事實和用詞更精確，愛因斯坦第 3 講改名〈瑪麗・居禮的兩座獎〉', '🗼 燈塔上的倒數改成「離會考還有 N 天」'] },
  { v: '2.34', date: '2026-10-26', items: ['🎻 上音樂課、練樂器也能換綠點：在「我的家」按「開始練習」，每 25 分鐘一個音符 🎵 +10 綠點，練多久都算'] },
  { v: '2.33', date: '2026-10-26', items: ['📋 首頁的「今日のおつとめ」只放每天要做的事：讀書計畫排第一，紙本檢討變成可選', '🗺️ 書店、智慧島改從島上進去；用清單模式時，板子下面多一列「去島上走走」', '🖌️ 3D 小島的街名牌加上科目小圖示', '🎓 智慧島一本書蓋滿 13 個章，老師會送一件畢業禮物到你家', '⛴️ 渡船屋可以請一位主人，幫你開船去智慧島'] },
  { v: '2.32', date: '2026-10-26', items: ['⚡ 打開小島更快：自訂圖片存在手機裡，換了新圖才重新下載'] },
  { v: '2.31', date: '2026-10-26', items: ['🔭 燈塔頂樓的燈室開放了：大家會、你還沒會的題，跟一開始的自己比，最近 4 週時間花在哪，最常錯的原因', '🏷️ 解說會標出來源：📜 心測中心、📘 課本觀念、📖 島上題庫、🤖 AI 推論', '🖌️ 每一科多了固定的小圖示：🖌️ 國、🔤 英、📐 數、🔬 自、🌏 社', '🍶 瓶子漂回來的間隔會慢慢拉長（1、3、7 天），連續答對三次才變燈籠；燈籠之後每個月會當老朋友漂回來一次', '💞 交情的等級只升不降；這週計畫沒排到的科目，島民會乖乖等你；會考前一個月不會變淡', '🔐 更多頁可以看「誰看得到什麼」，也可以登出這支手機', '🗼 3D 島上點燈塔頂樓就能直接進燈室；老朋友燈籠漂回來那天，岬角前的海上會亮著', '🌱 讀書計時和運動計時換的綠點都不設上限了，每 25 分鐘就 +10；以前超過上限的時間也一起補算', '🪙 島幣算法修正：如果之前改過紀錄而少算了島幣，這次會補回來'] },
  { v: '2.30.4', date: '2026-10-26', items: ['🏷️ 右上角 ❓ 說明頁的最上面可以看到目前的版本和下次更新的時間'] },
  { v: '2.30.3', date: '2026-10-26', items: ['🏮 島の屋台出現在 3D 小島上了：島前面海邊的小攤子，晚上紅燈籠會亮，點它就能進去做料理'] },
  { v: '2.30.2', date: '2026-10-26', items: ['🍁 楓葉飄落加回來了：葉子只在空中飄，不會掉在草地上'] },
  { v: '2.30.1', date: '2026-10-26', items: ['🧹 3D 小島上不再擺漂流瓶，島變乾淨了；今天漂回幾個瓶子，看燈塔上的標籤或去燈塔就知道'] },
  { v: '2.30', date: '2026-10-26', items: ['🍵 家具店多了三種風格：和の家具、台灣味、海邊風，可以慢慢蒐集，例如こたつ、大同電鍋、衝浪板', '🧩 我的家可以自己擺家具了：按「自己擺家具」，點一件家具、再點想放的格子就搬過去，也可以轉個方向', '🏮 燈籠送的家具，進度改在燈塔看，送到的家具一樣擺在我的家', '🔋 3D 小島、智慧島和房間比較省電了：App 切到背景就不畫；手機開了「減少動態效果」，海浪和雲會停住', '🍶 漂流瓶改成漂在燈塔外的海上，不會再堆在岸邊'] },
  { v: '2.29', date: '2026-10-26', items: ['🏮 碼頭邊開了一間「島の屋台」：首頁上方點 🏮 就能去，第一次去先請一位店主', '🧺 讀完一格計畫，那條街的島民會塞素材給你（每條街一天最多 3 個）；Boss 項目和一科整週做完會拿到稀有素材，智慧島上完一講老師也會送珍品', '🍙 湊齊兩三條街的素材就能做料理，一共 12 道：飯糰、抹茶、鯛魚燒、珍珠奶茶……', '📔 絆の手帖裡，交情到「聊得來」就能知道大家最喜歡吃什麼'] },
  { v: '2.28.1', date: '2026-10-26', items: ['💬 島民、老師和嚮導說話都改用「你」來叫你了，以前存下來的台詞也一起改好', '🌤️ 島民的每日訊息不再聊脆上的話題，改聊節氣、天氣和生活小事'] },
  { v: '2.28', date: '2026-10-26', items: ['📔 我的家多了一本「絆の手帖」：翻開有三頁，島民、智慧島的老師與各地方的管理員、島民之間的關係圖', '🪶 和智慧島老師也有交情了：每上一講、寫一句心得就會變深，7 天沒去才會慢慢變淡', '💞 關係圖上點一條線，就能看看兩位島民有多熟'] },
  { v: '2.27', date: '2026-10-26', items: ['🤝 你和每位島民之間有了「絆」：讀他那一科、做他的故事任務、請他講解、送家具、去他家作客、回他的信，交情都會慢慢變深', '💌 島民的信下面可以回一個表情', '🏷️ 島民的家和街區卡上會寫你們現在的交情（はじめまして → 一生的朋友），交情越深，信和故事的語氣越親近', '💞 島民之間也有交情：同一天讀兩科、寫跨科連結，他們就會越來越熟'] },
  { v: '2.26', date: '2026-10-26', items: ['🏝️ 可以用經驗值換衛星小島了：在商店的兌換卡下面，自己挑樣子（沙洲、松樹岩島、漁港、茶園）、方向和名字', '🌉 每座小島都用紅色太鼓橋接回本島，在 3D 小島上點小島就能過去', '🧑‍🌾 每座小島可以請一位你自己設定的管理員，第一次去他會先打招呼', '⭐ 換小島和換島幣用同一包可換的經驗值；經驗值總數和等級都不會變'] },
  { v: '2.25', date: '2026-10-26', items: ['🗣️ 島民設定多了「說話方式／口頭禪」：寫信、故事、挑戰任務、講解都會照著說', '🏘️ 理化、生物、地科、歷史、地理、公民巷的室友，也可以設定自己的個性和說話方式', '📝 每位島民可以寫一段介紹，會出現在島民的家和「更多」頁；智慧島四位老師也有介紹了', '💬 島民家裡的道謝和島上消息，改成島民每天照自己的口吻寫'] },

// PERF_v1 開啟速度小框（11/20 驗收 E2，工程顧問 10/30）：只有網址帶 ?perf=1 才出現；只顯示在畫面上，不存、不送
const PERF = /[?&]perf=1(&|$)/.test(location.search) ? {} : null;
function perfShow() {
  if (!PERF || !document.body) return;
  let el = document.getElementById('perfBox');
  if (!el) { el = document.createElement('div'); el.id = 'perfBox'; el.style.cssText = 'position:fixed;right:8px;bottom:calc(72px + env(safe-area-inset-bottom));z-index:9999;background:rgba(58,42,51,.88);color:#fff;font:12px/1.5 ui-monospace,monospace;padding:6px 8px;border-radius:8px;pointer-events:none;white-space:pre'; document.body.appendChild(el); }
  const f = ms => ms == null ? '…' : ms >= 1000 ? (ms / 1000).toFixed(2) + ' s' : Math.round(ms) + ' ms';
  el.textContent = 'getState 來回 ' + f(PERF.gs) + (PERF.n > 1 ? '（第 ' + PERF.n + ' 次）' : '') + '\n3D 第一幀　 ' + f(PERF.f3d) + '（從開頁算）';
}
if (PERF) {
  const seen = () => { if (PERF.f3d != null || !document.querySelector('#i3d canvas')) return false;

function wisdomRun(g) {
  clearInterval(wisdomTimer);
  const seq = []; for (let r = 0; r < g.times; r++) (g.kind === 'breathe' ? [['吸', g.inhale, 1.6], ['吐', g.exhale, 1]] : g.steps.map(s => [s[0], s[1], 1])).forEach(x => seq.push(x));
  let i = 0, left = 0;
  const tick = () => {
    const bub = document.getElementById('wBub'), cue = document.getElementById('wCue');
    if (!bub || !cue) return clearInterval(wisdomTimer);
    if (left <= 0) { if (i >= seq.length) { cue.textContent = '做完了，慢慢回到這裡。'; bub.style.transform = 'scale(1)'; return clearInterval(wisdomTimer); }
      const [label, sec, sc] = seq[i++]; left = sec; bub.style.transition = `transform ${sec}s ease-in-out`; bub.style.transform = `scale(${sc})`; cue.dataset.label = label; }

  tick(); wisdomTimer = setInterval(tick, 1000);
}

/* --- 燈塔（學習中心）：主島岬角上的燈塔。海灘的漂流瓶是答錯的題，漂回來時用 AI 類題再挑戰，連續兩天答對變成紙燈籠 --- */
// 存檔：lighthouse = { name }；rv:<題目 key> = { why, note, share, tries, lantern }；xc:<題目 key> = 跨科判斷。後端在 Lighthouse.gs
const REVIEW_DAILY = 5, MATH_DAILY = 2;   // v2.47 每天的瓶子裡數學最多 2 個，別科不夠時由數學補滿（工程顧問 10/27）
const LIGHT_NAMES = ['燈塔岬', '寺子屋', '秘密基地', '觀星台'];
function lighthouseName() { return (S.save.lighthouse && S.save.lighthouse.name) || ''; }
function lightTitle() { return lighthouseName() || '燈塔'; }
// 海灘上的所有瓶子：挑戰任務和故事任務答錯的題（漂回來的類題本身不算）
function bottles() {
  const out = [];
  extraQuests().filter(q => q.done && q.correct === false && (!q.review || q.verify)).forEach(q => out.push({ id: q.id, lane: q.lane, tier: q.tier || 'mid', rec: q, wrongAt: q.at || q.date,
    label: (q.verify ? '📜 考古題・' : '') + (q.bank ? q.year + ' 年會考第 ' + q.qn + ' 題' : q.practice ? '類型練習「' + q.practice + '」' : '挑戰任務（AI 出題）') }));   // 錯題循環③：考古題回合答錯的題另外變成新瓶子
  photoWrongs().forEach(q => out.push({ id: q.id, lane: q.lane, tier: 'mid', rec: q, wrongAt: q.at || q.date, label: q.src === 'word' ? '🔤 單字練習「' + q.word + '」' : '📷 你拍的錯題' + (q.n ? '（第 ' + q.n + ' 題）' : '') }));
  // v2.35 有點猜的題：答對了，但她說有點猜，變成「輕輕的瓶子」（rv:<key>.gb＝收進來的那天）
  const gb = k => (S.save['rv:' + k] || {}).gb;
  extraQuests().filter(q => q.done && q.correct && !q.review && gb(q.id)).forEach(q => out.push({ id: q.id, lane: q.lane, tier: q.tier || 'mid', rec: q, guess: true, wrongAt: gb(q.id),
    label: '🫧 有點猜・' + (q.bank ? q.year + ' 年會考第 ' + q.qn + ' 題' : q.practice ? '類型練習「' + q.practice + '」' : '挑戰任務（AI 出題）') }));
  Object.keys(S.save).filter(k => k.startsWith('quest:') && S.save[k] && S.save[k].done && S.save[k].correct === false && S.save[k].qid).forEach(k => {
    const q = S.save[k], p = q.qid.split(':'), item = QUESTS[p[0]] && QUESTS[p[0]][Number(p[1])];
    if (q.bank && q.img) out.push({ id: k, lane: q.lane, tier: q.pass < 40 ? 'adv' : 'mid', rec: q, wrongAt: q.at || k.slice(6), label: '故事任務・' + q.year + ' 年會考第 ' + q.qn + ' 題' });
    else if (item) out.push({ id: k, lane: q.lane, tier: 'mid', rec: q, item, wrongAt: q.at || k.slice(6), label: '故事任務' });
  });
  Object.keys(S.save).filter(k => k.startsWith('quest:') && S.save[k] && S.save[k].done && S.save[k].correct && S.save[k].qid && gb(k)).forEach(k => {
    const q = S.save[k], p = q.qid.split(':'), item = QUESTS[p[0]] && QUESTS[p[0]][Number(p[1])];
    if (q.bank && q.img) out.push({ id: k, lane: q.lane, tier: q.pass < 40 ? 'adv' : 'mid', rec: q, guess: true, wrongAt: gb(k), label: '🫧 有點猜・故事任務・' + q.year + ' 年會考第 ' + q.qn + ' 題' });
    else if (item) out.push({ id: k, lane: q.lane, tier: 'mid', rec: q, item, guess: true, wrongAt: gb(k), label: '🫧 有點猜・故事任務' });
  });
  out.forEach(b => {
    const rv = b.rv = S.save['rv:' + b.id] || {};
    b.lantern = rv.lantern || null; b.streak = reviewStreak(rv);
    b.due = reviewDue(rv, b.wrongAt); b.friend = !!b.lantern;
  });
  return out.sort((a, b) => (b.wrongAt || '').localeCompare(a.wrongAt || ''));
}
// v2.31 間隔複習逐步拉長（爸爸 2026-10-26）：答錯隔 1 天；連續答對 1 次隔 3 天、2 次隔 7 天，第 3 次答對變成燈籠。
// 燈籠放走 21 天後當「老朋友」漂回來一次，之後每 30 天（老朋友答錯就 7 天後再來）；燈籠不會變回瓶子。後端 Lighthouse.gs 的 reviewDue_ 要一致
const REVIEW_GAPS = [1, 3, 7], LANTERN_AT = 3, FRIEND_FIRST = 21, FRIEND_GAP = 30, FRIEND_WRONG = 7;
function reviewStreak(rv) { const t = ((rv && rv.tries) || []).filter(x => !x.friend && !x.hold); let n = 0; for (let i = t.length - 1; i >= 0 && t[i].ok; i--) n++; return n; }
function reviewDue(rv, wrongAt) {
  const t = (rv && rv.tries) || [];
  if (rv && rv.lantern) { const f = t.filter(x => x.friend), l = f[f.length - 1]; return addD(l ? l.at : rv.lantern, !l ? FRIEND_FIRST : l.ok ? FRIEND_GAP : FRIEND_WRONG); }
  return addD(t.length ? t[t.length - 1].at : wrongAt, REVIEW_GAPS[Math.min(reviewStreak(rv), REVIEW_GAPS.length - 1)]);
}
function photoWrongs() { return Object.keys(S.save).filter(k => k.startsWith('pq:') && S.save[k]).sort().map(k => Object.assign({ id: k }, S.save[k])); }
// 今天漂回來的瓶子：一般瓶子先、燈籠老朋友後；同一類裡全國答對率高、她卻答錯的先漂回來
function dueBottles(list) {
  const stuck = stkSkip();   // 換條航線
  const due = (list || bottles()).filter(b => b.due && b.due <= S.today && !(stuck.size && stuck.has(sidOf(b.rec, b.id))))
    .sort((a, b) => (!!a.lantern - !!b.lantern) || (!!a.guess - !!b.guess) || ((b.rec.pass || 0) - (a.rec.pass || 0)) || (a.wrongAt || '').localeCompare(b.wrongAt || ''));   // v2.31：每天的名額先給一般瓶子，老朋友排後面
  // v2.47 今天還能撿的數學瓶以外，多的數學瓶排到最後：別科補得滿就輪不到，補不滿再由它們補上
  let m = Math.max(0, MATH_DAILY - reviewsToday().filter(q => q.lane === '數').length);
  const keep = [], wait = [];
  due.forEach(b => (laneOf(b.rec, b.lane) !== '數' || m-- > 0 ? keep : wait).push(b));
  return keep.concat(wait);
}
function reviewsToday() { return todayChallenges().filter(q => q.review); }
/* --- 換條航線：同一個次觀念最近 14 天有 3 個以上的瓶子，錯因是觀念不熟或看不懂題目，就先停一下那幾個瓶子，換一條路走。
   stuckList 是通用的，吃一份瓶子清單 [{ id, sid, lane, wrongAt, why, lantern }]，家人的瓶子也能用；只記錄，經驗值、島幣、⭐、燈籠都不變。
   存檔 stk:<次觀念> = { at, ok: [{ d, r }], done, note, ex }，後端在 Lighthouse.gs。note 只給她看：不送 AI、不進學習摘要和印錯題卷 --- */
const STK_FROM = '2026-10-30', STK_DAYS = 14, STK_MIN = 3, STK_SHOW = 2, STK_WHY = ['concept', 'reading'], STK_EX_DAILY = 3;
// since(sid)：解除過的次觀念，只算解除隔天以後收進來的瓶子；上線以前收的瓶子都不算（不回溯）
function stuckList(list, today, since) {
  const from = addD(today, -(STK_DAYS - 1)), by = {};
  (list || []).forEach(b => {
    const d = String(b.wrongAt || '').slice(0, 10);
    if (!b.sid || b.sid === '表外' || b.sid === '待確認' || b.lantern || STK_WHY.indexOf(b.why) < 0 || d < from || d > today || d < STK_FROM || (since && d < since(b.sid))) return;
    const x = by[b.sid] || (by[b.sid] = { sid: b.sid, lane: b.lane, ids: [], last: '' });
    if (x.ids.indexOf(b.id) < 0) x.ids.push(b.id);
    if (d > x.last) x.last = d;
  });
  return Object.values(by).filter(x => x.ids.length >= STK_MIN).sort((a, b) => b.last.localeCompare(a.last) || a.sid.localeCompare(b.sid)).slice(0, STK_SHOW);

const XQ_WEAK = 3;
function xqWeakOn() { try { return localStorage.getItem('islandXqWeak') !== 'off'; } catch (e) { return true; } }

async function pickWeakBank(tier) {

  await loadUnits(); if (!unitsData) return null;
  const um = unitMap(); if (!um.weak.length) return null;
  const weak = new Set(um.weak.map(t => t.lane + '|' + t.unit));
  const done = todayChallenges().filter(q => q.bank && !q.review && weak.has(laneOf(q) + '|' + unitsData.tags[q.bank])).length;
  if (done >= XQ_WEAK) return null;
  const t = um.weak[done % um.weak.length];
  return await pickUnitBank(t.lane, t.unit, tier) || (await Promise.all(um.weak.map(w => pickUnitBank(w.lane, w.unit, tier)))).find(Boolean) || null;
}
async function challengeXq(tier) {
  if (xqBusy || todayChallenges().length >= XQ_DAILY) return;

    if (item) S = await call('challengeBank', item);
    else {

      const who = laneWho(lane), r = resident(GROUP[lane] || lane);
      S = await call('challengeQuest', lane, { name: who.name, personality: who.personality, speech: who.speech }, tier);
    }
    D = derive(S);
  } catch (e) { toast('出題失敗：' + (e.message || e)); }

let xqGuess = false;

}

function weekData(wk) {
  const plan = planOf(wk), planned = {}, done = {}, add = (o, r, v) => o[r] = (o[r] || 0) + v;
  plan.days.forEach(d => d.forEach(r => add(planned, r, 1)));

    for (let i = 0; i < 7; i++) { const lg = logOf(addD(wk, i)); Object.keys(lg).forEach(r => { daily = true; add(done, r, lg[r] === 2 ? 1 : 0.5); }); }
  }

    if (gi >= 0) S.items.forEach(it => { const s = (S.grid[it.row] || [])[gi]; if (s === 2) done[it.row] = 1; else if (s === 1) done[it.row] = 0.5; });

/* --- 同步：改動先顯示在畫面上，稍後在背景寫回試算表 --- */
const pending = {};
let syncTimer = null, syncChain = Promise.resolve();
function queueSave(key, fn, ...args) {
  if (isFamily()) { call(fn, ...args).catch(() => {}); return; }
  pending[key] = { fn, args };
  setSync('同步中…');
  clearTimeout(syncTimer); syncTimer = setTimeout(() => flush().catch(() => {}), 1200);
}
// 一次只送一批，送完才送下一批；回傳的 Promise 在這一批寫好後才完成
function flush() { clearTimeout(syncTimer); syncChain = syncChain.then(doFlush, doFlush); return syncChain; }
async function doFlush() {
  const jobs = Object.entries(pending);
  if (!jobs.length) return;
  jobs.forEach(([k]) => delete pending[k]);
  try {
    let st = null;
    for (const [, j] of jobs) st = await call(j.fn, ...j.args);
    const mine = S.save;
    S = st;
    Object.keys(pending).forEach(k => S.save[k] = mine[k]);   // 送出後又改的部分，以畫面上的為準
    D = derive(S);
    setSync(Object.keys(pending).length ? '同步中…' : '✓ 已存到試算表');
    softRender();
  } catch (e) {
    jobs.forEach(([k, j]) => { if (!pending[k]) pending[k] = j; });
    setSync('⚠️ 還沒存到，稍後重試');
    clearTimeout(syncTimer); syncTimer = setTimeout(() => flush().catch(() => {}), 8000);
    throw e;
  }
}
function setSync(t) { syncState = t; document.querySelectorAll('.syncState').forEach(el => el.textContent = t); }
let syncState = '';

/* --- 學習指標：計畫一格從哪裡來。key＝'<天 0～6 或 t>|<列號或待定>'；self 自己加（拍手寫計畫也算）、pick 點了 App 的建議、keep 照上週排、fam 家人排（後兩種還沒有入口）。

/* ===== 讀書計時（集中の砂時計，v2.9） =====

const FOCUS_GLASS = 25, FOCUS_GREEN = 10, FOCUS_MAX = 90;   // 一顆幾分鐘、一顆幾綠點、一次最多算幾分鐘（防忘了按停止）

   兩支手機各記各的，後端取較大值合併，所以同一天兩支都用時會少算（寧可少算，不會重複算）。 ===== */
const TM_IDLE = 150000, TM_EVERY = 300000, TM_STEP = 15000;
// 通用：zoneOf() 回傳 0～2（不算就回 -1）；get(日期) 讀已存的三區分鐘；save({ 日期: [三區] }) 寫回。
// 分鐘數變了、離上次存超過 5 分鐘才存；切到背景或離開時補存一次。讀一小時書最多存 13 次
function zoneTimer(zoneOf, get, save) {
  let act = Date.now(), t0 = Date.now(), last = Date.now();
  const base = {}, sec = {}, sent = {};
  const day = t => new Date(t + 8 * 3600e3).toISOString().slice(0, 10);   // 台北日期，跨午夜分到兩天
  const val = d => base[d].map((b, i) => b + Math.floor(sec[d][i] / 60));
  const changed = () => Object.keys(sec).filter(d => String(val(d)) !== String(sent[d] || base[d]));
  const push = () => {
    const ds = changed().slice(-10); if (!ds.length) return;
    const days = {}; ds.forEach(d => { days[d] = val(d); sent[d] = days[d]; });
    last = Date.now(); save(days);
  };
  const tick = () => {
    const now = Date.now(), dt = Math.min(now - t0, 2 * TM_STEP); t0 = now;
    if (document.visibilityState !== 'visible' || now - act > TM_IDLE) return;
    const z = zoneOf(); if (!(z >= 0 && z <= 2)) return;
    const d = day(now);
    if (!sec[d]) { sec[d] = [0, 0, 0]; base[d] = (get(d) || [0, 0, 0]).map(x => Number(x) || 0); }
    sec[d][z] += dt / 1000;
    if (now - last >= TM_EVERY) push();
  };
  ['pointerdown', 'keydown', 'scroll', 'touchstart', 'wheel'].forEach(e => document.addEventListener(e, () => { if (Date.now() - act > TM_IDLE) t0 = Date.now(); act = Date.now(); }, { passive: true, capture: true }));
  const leave = () => { tick(); push(); };
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') leave(); else { t0 = Date.now(); act = Date.now(); } });
  window.addEventListener('pagehide', leave);
  setInterval(tick, TM_STEP);
  return { tick, push, val: d => sec[d] ? val(d) : null };
}

  if (!o) { o = document.createElement('div'); o.id = 'scanWait'; o.style.cssText = 'position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;padding:16px'; document.body.appendChild(o); }
  o.innerHTML = `<div class="card" style="max-width:360px;width:100%">${html}</div>`;
}
function scanOverlayClose() { clearInterval(scanOverlay.t); const o = document.getElementById('scanWait'); if (o) o.remove(); }
async function scanPlanPhoto(file) {
  const wk = planWeek, t0 = Date.now();
  const tick = () => scanOverlay(`<div class="big">🔍</div><h3 style="text-align:center">島民正在讀你的計畫…</h3><div class="muted" style="text-align:center">大約 10 到 60 秒・已經 ${Math.round((Date.now() - t0) / 1000)} 秒</div>`);
  tick(); clearInterval(scanOverlay.t); scanOverlay.t = setInterval(tick, 1000);
  try {
    const photo = await shrinkPhoto(file);
    if (!S.save.abbr) await seedDefaults(); else await flush();
    const res = await Promise.race([call('scanPlan', wk, photo),
      new Promise((_, bad) => setTimeout(() => bad(new Error('等了 150 秒還沒讀完，可能是網路或 AI 太忙，過一下再拍一次')), 150000))]);
    scanOverlayClose();
    draft = { scan: res, week: wk, markDone: true }; tab = 'scan'; render(); window.scrollTo(0, 0);
  } catch (e) {
    clearInterval(scanOverlay.t);
    scanOverlay(`<div class="big">😵</div><h3 style="text-align:center">這次沒讀出來</h3><div class="muted" style="text-align:center">${esc(e.message || String(e))}</div><div class="row" style="margin-top:12px"><button class="grow" onclick="scanOverlayClose()">知道了</button></div>`);
  }
}
function viewScan() {
  const r = draft.scan, wk = draft.week, n = r.days.flat().length + r.tray.length;
  const cur = planOf(wk), hasPlan = cur.days.some(d => d.length) || cur.tray.length;
  const weekNums = DAYS.map((_, i) => parseD(addD(wk, i)).getDate());
  const wrongWeek = r.dates && r.dates.length && !r.dates.some(d => weekNums.includes(d));
  const pills = (rows, i) => rows.map(x => {
      const label = isPending(x) ? '❓ ' + pendingName(x) : D.itemsByRow[x] ? D.itemsByRow[x].subject + '・' + D.itemsByRow[x].name : '';
      if (!label) return '';
      const done = i >= 0 && r.done[i].includes(x);
      return `<span class="pill">${done ? '✓ ' : ''}${esc(label)}<button class="x" style="padding:0 0 0 6px;color:inherit" onclick="scanDrop(${i},'${x}')" aria-label="移除">✕</button></span>`; }).join('')
    || '<span class="muted">（沒有）</span>';
  const struckOf = i => r.struck[i].filter(x => !isPending(x) && D.itemsByRow[x]).map(x => D.itemsByRow[x]);
  const anyDone = r.done.flat().length;
  const dayName = d => d < 0 ? '沒寫哪天' : '週' + DAYS[d];
  return `<div class="card"><h2>📷 讀到的計畫</h2>
      <div class="muted">${short(wk)}–${short(addD(wk, 6))}，一共 ${n} 項。讀錯的按 ✕ 拿掉，套用之後還可以在計畫頁一天一天改。</div>
      ${wrongWeek ? `<div style="color:#c0392b;margin-top:6px">⚠️ 照片上的日期（${r.dates.join('、')} 日）好像不是這一週，確定要套用嗎？</div>` : ''}</div>
    <div class="card">${r.days.map((d, i) => `<div class="item" style="display:block"><b>週${DAYS[i]} ${short(addD(wk, i))}</b><div style="margin-top:4px">${pills(d, i)}</div>
        ${struckOf(i).length ? `<div class="muted" style="margin-top:4px">劃掉（取消）：<s>${struckOf(i).map(it => esc(it.subject + '・' + it.name)).join('、')}</s></div>` : ''}</div>`).join('')}
      ${r.tray.length ? `<div class="item" style="display:block"><b>📦 沒寫哪天</b><div style="margin-top:4px">${pills(r.tray, -1)}</div></div>` : ''}
      ${(r.exercise || []).some((v, i) => v === 'done' && addD(wk, i) <= S.today) ? `<div style="margin-top:10px">🏃 運動打勾的日子：${(r.exercise || []).map((v, i) => v === 'done' && addD(wk, i) <= S.today ? '週' + DAYS[i] : '').filter(Boolean).join('、')}，套用時會自動蓋運動章。</div>` : ''}
      ${anyDone ? `<label class="row" style="margin-top:10px;color:var(--ink)"><input type="checkbox" class="check" ${draft.markDone ? 'checked' : ''} onchange="draft.markDone=this.checked"> 打勾（✓）的項目，順便記成「完成」</label>` : ''}
</div>
    ${r.unknown.length ? `<div class="card"><h3>🤔 這些看不懂</h3>
      <div class="muted">告訴島民它是哪一項，下次就認得了。不是讀書的行程，按「無關」以後就會略過。</div>
      ${r.unknown.map((u, k) => `<div class="item" style="display:block"><div><b>「${esc(u.text)}」</b> <span class="muted">${dayName(u.day)}${u.done ? '・有打勾' : ''}</span></div>
        <div class="row" style="margin-top:6px">${itemSelect('unk' + k)}<button onclick="scanTeach(${k})">記住</button><button class="ghost" onclick="scanIgnore(${k})">無關</button></div></div>`).join('')}</div>` : ''}
    <div class="row"><button class="grow" onclick="applyScan(false)">${hasPlan ? '用這份取代原本的計畫' : '✅ 用這份計畫'}</button>
      ${hasPlan ? '<button class="ghost grow" onclick="applyScan(true)">加進原本的計畫</button>' : ''}
      <button class="ghost" onclick="draft={};tab=\'plan\';render()">取消</button></div>`;
}
function scanDrop(i, x) {
  const r = draft.scan;
  const keep = y => String(y) !== String(x);
  if (i < 0) r.tray = r.tray.filter(keep);
  else { r.days[i] = r.days[i].filter(keep); r.done[i] = r.done[i].filter(keep); }
  render();
}
// 教島民一個新寫法：記進字典，並把這一項排進那天
function scanTeach(k) {
  const r = draft.scan, u = r.unknown[k], row = Number(document.getElementById('unk' + k).value);
  if (!row) return toast('先選它是哪一項');
  const a = abbrOf(); a.map[u.text] = row; setAbbr(a);
  if (u.day >= 0) { if (!r.days[u.day].includes(row)) r.days[u.day].push(row); if (u.done && !r.done[u.day].includes(row)) r.done[u.day].push(row); }
  else if (!r.tray.includes(row)) r.tray.push(row);
  r.unknown.splice(k, 1);
  toast('記住了！下次看到「' + u.text + '」就知道'); render();
}
function scanIgnore(k) {
  const r = draft.scan, u = r.unknown[k], a = abbrOf();
  if (!a.ignore.includes(u.text)) a.ignore.push(u.text);
  setAbbr(a); r.unknown.splice(k, 1);
  toast('好，以後看到「' + u.text + '」就略過'); render();
}
function applyScan(merge) {
  const r = draft.scan, wk = draft.week, cur = planOf(wk);
  const uniq = a => [...new Set(a)];
  const plan = merge ? { days: cur.days.map((d, i) => uniq(d.concat(r.days[i]))), tray: uniq(cur.tray.concat(r.tray)) } : { days: r.days.map(uniq), tray: uniq(r.tray) };
  setPlan(wk, plan, 'self', !merge);
  // 照片上打勾（或劃掉）的項目，今天以前的日子直接記成完成
  let logged = 0;
  DAYS.forEach((_, i) => {
    const date = addD(wk, i); if (date > S.today) return;
    const rows = (draft.markDone ? r.done[i] : []).filter(x => !isPending(x) && r.days[i].includes(x));
    if (!rows.length) return;
    const lg = Object.assign({}, logOf(date)); rows.forEach(x => { lg[x] = 2; logged++; });
    S.save['log:' + date] = { rows: lg }; queueSave('log:' + date, 'logDay', date, lg);
  });
  // 計畫本上「運動」有打勾的日子，自動蓋運動章
  let stamped = 0;
  (r.exercise || []).forEach((v, i) => {
    const date = addD(wk, i); if (v !== 'done' || date > S.today || S.save['ex:' + date]) return;
    S.save['ex:' + date] = { at: S.today, src: 'scan' }; queueSave('ex:' + date, 'saveExercise', date, true, 'scan'); stamped++;
  });
  D = derive(S); flush().catch(() => {});
  planWeek = wk; planDay = null; draft = {}; tab = 'plan';
  toast((logged ? '計畫排好了，也記下 ' + logged + ' 個打勾的項目！' : '計畫排好了！') + (stamped ? '運動章蓋了 ' + stamped + ' 個 🏃' : '')); render(); window.scrollTo(0, 0);
}

/* --- 我的寫法（字典） --- */
function viewAbbr() {
  const a = abbrOf(), keys = Object.keys(a.map).sort(), pick = draft.abRows || [];
  return `<div class="card"><h2>📖 我的寫法</h2>
      <div class="muted">拍計畫時，島民會先查這本字典。左邊是你在計畫本上的寫法，右邊是週檢討表上的項目。拍照時遇到看不懂的字，教過一次也會記在這裡。</div></div>
    <div class="card"><h3>寫法對照</h3>
      ${keys.length ? keys.map(k => `<div class="item"><div class="name"><b>${esc(k)}</b> → ${esc(abbrName(a.map[k]))}</div><button class="x" onclick="abbrDel('map', ${esc(JSON.stringify(k))})" aria-label="刪除">✕</button></div>`).join('') : '<div class="muted">還沒有。</div>'}
      <h3 style="margin-top:14px">新增一個寫法</h3>
      <label>計畫本上的寫法</label><input id="abK" placeholder="例如：理複、Wei M" value="${esc(draft.abK || '')}">
      <label>對應到哪一項（一個寫法可以對到好幾項）</label>
      <div class="row">${itemSelect('abR')}<button class="ghost" onclick="abbrPush()">＋ 加這項</button></div>
      ${pick.length ? `<div style="margin-top:6px">${pick.map((r, k) => `<span class="pill">${esc(D.itemsByRow[r].subject + '・' + D.itemsByRow[r].name)}<button class="x" style="padding:0 0 0 6px;color:inherit" onclick="draft.abRows.splice(${k},1);abbrKeep();render()">✕</button></span>`).join('')}</div>` : ''}
      ${pick.length > 1 ? `<label>這幾項是</label><select id="abM"><option value="all" ${draft.abM !== 'pick' ? 'selected' : ''}>全部都要做（例如「國三」＝online、閱策、成語）</option><option value="pick" ${draft.abM === 'pick' ? 'selected' : ''}>其中一項，上課後才知道（例如「Wei H」）</option></select>` : ''}
      <div style="margin-top:8px"><button onclick="abbrAdd()">存進字典</button></div></div>
    <div class="card"><h3>跟讀書無關的行程</h3><div class="muted">看到這些寫法就略過，例如才藝課、運動。</div>
      <div style="margin-top:6px">${a.ignore.map(x => `<span class="pill">${esc(x)}<button class="x" style="padding:0 0 0 6px;color:inherit" onclick="abbrDel('ignore', ${esc(JSON.stringify(x))})" aria-label="刪除">✕</button></span>`).join('') || '<span class="muted">還沒有。</span>'}</div>
      <div class="row" style="margin-top:8px"><input id="abI" class="grow" placeholder="例如：violin"><button class="ghost" onclick="abbrIgnore()">加入</button></div></div>
    <div class="row"><span class="muted syncState grow">${syncState}</span><button class="ghost" onclick="go('items')">📝 任務清單</button><button class="ghost" onclick="go('more')">返回</button></div>`;
}
function abbrKeep() {
  const k = document.getElementById('abK'), m = document.getElementById('abM');
  if (k) draft.abK = k.value; if (m) draft.abM = m.value;
}
function abbrPush() {
  const r = Number(document.getElementById('abR').value); if (!r) return toast('先選一個項目');
  abbrKeep(); draft.abRows = draft.abRows || [];
  if (!draft.abRows.includes(r)) draft.abRows.push(r);
  render();
}
function abbrAdd() {
  abbrKeep();
  const k = (draft.abK || '').trim(), rows = (draft.abRows || []).slice(), cur = Number(document.getElementById('abR').value);
  if (cur && !rows.includes(cur)) rows.push(cur);
  if (!k || !rows.length) return toast('寫法和項目都要填');
  const a = abbrOf();
  a.map[k] = rows.length === 1 ? rows[0] : { rows, mode: draft.abM === 'pick' ? 'pick' : 'all' };
  setAbbr(a); draft = {}; toast('記住「' + k + '」了'); render();
}
function abbrIgnore() {
  const x = document.getElementById('abI').value.trim(); if (!x) return;
  const a = abbrOf(); if (!a.ignore.includes(x)) a.ignore.push(x); abbrKeep(); setAbbr(a); render();
}
function abbrDel(kind, k) {
  const a = abbrOf();
  if (kind === 'map') delete a.map[k]; else a.ignore = a.ignore.filter(x => x !== k);
  abbrKeep(); setAbbr(a); render();
}

/* --- 任務清單：週檢討表上的項目，可以新增、改名 --- */

      <div class="muted">這裡就是爸爸週檢討表上的項目。新增會在那一科最後面多一列，改名會直接改表上的名字，以前的紀錄都會保留。</div></div>

      ${S.items.filter(i => i.subject === sub).map(it => `<div class="item"><div class="name">${esc(it.name)}${isBoss(it.name) ? '<span class="tag">Boss</span>' : ''}</div><button class="ghost" style="padding:6px 12px" onclick="itemRename(${it.row})">✏️ 改名</button></div>`).join('')}</div>`).join('')}

async function itemAdd(sub) {
  const n = (prompt('在「' + sub + '」新增一個項目：') || '').trim(); if (!n) return;
  try { await flush(); toast('新增中…'); S = await call('addItem', sub, n); D = derive(S); toast('新增好了，週檢討表也多了一列'); render(); }
  catch (e) { toast('新增失敗：' + (e.message || e)); }
}
async function itemRename(row) {
  const it = D.itemsByRow[row], n = (prompt('把「' + it.name + '」改成：', it.name) || '').trim();
  if (!n || n === it.name) return;
  try { await flush(); S = await call('renameItem', row, n); D = derive(S); toast('改好了'); render(); }
  catch (e) { toast('改名失敗：' + (e.message || e)); }
}

/* --- 週日確認：帶入每天的紀錄，補上漏記的，再寫回週檢討 --- */
function openConfirm(wk) {
  const wd = weekData(wk);
  draft = { week: wk, counts: Object.assign({}, wd.done), showAll: !wd.total && !Object.keys(wd.done).length };
  tab = 'confirm'; render(); window.scrollTo(0, 0);
}
function viewConfirm() {
  const wk = draft.week, wd = weekData(wk), c = draft.counts;
  const rows = draft.showAll ? S.items.map(i => i.row)
    : [...new Set(Object.keys(wd.planned).concat(Object.keys(c)).map(Number))].filter(r => D.itemsByRow[r]).sort((a, b) => a - b);
  const fmt = v => String(v).replace('.5', '½').replace(/^0½$/, '½');
  let total = 0, got = 0; Object.keys(wd.planned).forEach(r => { total += wd.planned[r]; got += Math.min(c[r] || 0, wd.planned[r]); });
  const pct = total ? Math.round(got / total * 100) : 0;
  const fmin = {}; for (let i = 0; i < 7; i++) ((S.save['focus:' + addD(wk, i)] || {}).list || []).forEach(x => fmin[x.row] = (fmin[x.row] || 0) + (x.min || 0));
  return `<div class="card"><h2>✅ 確認 ${short(wk)}–${short(addD(wk, 6))}</h2>
      <div class="muted">每一項做了幾次，已經從每天的紀錄帶進來了。漏記的用 ＋／－ 補上，做了一半就按「½」。${wd.settled ? '<br>這週確認過了，再送出會覆蓋。' : ''}</div>
      ${total ? `<div class="row" style="margin-top:10px"><div class="bar grow" style="margin-top:0"><i id="cfBar" style="width:${pct}%"></i></div><b id="cfPct">${pct}%</b></div>` : ''}
      <div style="margin-top:8px"><button class="ghost" onclick="draft.showAll=!draft.showAll;draft.note=document.getElementById('note').value;render()">${draft.showAll ? '只看這週的計畫和紀錄' : '顯示全部項目'}</button></div></div>
    ${(() => { const p = wd.plan, blocks = p.days.map((d, i) => [i, d]).concat([[7, p.tray]]).filter(([, d]) => d.some(isPending));
      return blocks.length ? `<div class="card"><h3>❓ 還沒決定是哪一項</h3>${blocks.map(([i, d]) => `<div class="subj">${i === 7 ? '沒排天' : '週' + DAYS[i]}</div>` + pendingList(d, wk, i, false)).join('')}</div>` : ''; })()}
    <div class="card">${rows.length ? itemList(rows, r => (fmin[r] ? `<span class="muted">⏳ ${fmin[r]} 分</span>` : '') + `<div class="step" data-row="${r}"><button data-d="-1">－</button><b>${fmt(c[r] || 0)}</b><span class="muted">/${wd.planned[r] || '－'}</span><button data-d="1">＋</button><button data-d="half" class="ghost">½</button></div>`) : '<div class="muted">這週沒有計畫也沒有紀錄。按「顯示全部項目」補記，或直接確認，當作休息週。</div>'}
      <label>這週一句話（只會存在島上）</label><textarea id="note" placeholder="例如：數學卡在二次函數，但歷史影片看完了">${esc(draft.note != null ? draft.note : (wd.settled && wd.settled.note) || '')}</textarea>
      <div class="row" style="margin-top:12px"><button id="doConfirm" class="grow">確認這週 ✨</button><button class="ghost" onclick="draft={};tab='plan';render()">返回</button></div></div>
    ${card('link', viewLinkForm())}`;
}
function bindConfirm() {
  const $ = id => document.getElementById(id), c = draft.counts;
  document.querySelectorAll('.step').forEach(st => st.onclick = e => {
    const b = e.target.closest('button'); if (!b) return;
    const r = Number(st.dataset.row), v = c[r] || 0;
    let n = b.dataset.d === 'half' ? (v % 1 ? v - 0.5 : v + 0.5) : Math.max(0, v + Number(b.dataset.d));
    n = Math.min(n, 14);
    if (n > 0) c[r] = n; else delete c[r];
    draft.note = $('note').value; render();
  });
  $('doConfirm').onclick = async () => {
    $('doConfirm').disabled = true; $('doConfirm').textContent = '寫回試算表中…';
    const wk = draft.week, before = D.xp;
    try {
      await flush();
      S = await call('confirmWeek', wk, c, $('note').value);
      D = derive(S);
      const wd = weekData(wk), g = guide(), units = Object.values(wd.done).reduce((a, b) => a + b, 0);
      const pc = wd.total ? Math.round(wd.got / wd.total * 100) : null;
      const rateLine = pc != null ? `<div style="text-align:center;margin:8px 0"><div style="font-size:34px;font-weight:800;color:var(--plum)">${pc}%</div>
        <div class="muted">計畫完成 ${wd.got}／${wd.total} 次${pc >= 100 ? '・FULL COMBO 🎵' : pc >= 80 ? '・GREAT' : pc >= 50 ? '・CLEAR' : ''}</div></div>` : '';
      draft = { after: `<div class="card"><div class="big">🎉</div><h2 style="text-align:center">這週確認完成！+${D.xp - before} 經驗值</h2>${rateLine}
        <div style="text-align:center">這週一共做了 ${units} 次。${g.ipic} ${esc(g.name)}：「${units > 0 ? '這些都是真的蓋起來的房子喔。' : '這週休息也沒關係，島還在。'}」</div>
        <div class="muted" style="text-align:center;margin-top:8px">接著排下週的計畫吧：拍手寫計畫，或點日子自己加。</div>
        ${card('lightWord', `<button class="ghost" style="width:100%;margin-top:10px" onclick="openLightWord('${wk}')">🗼 去看燈塔的話</button>`)}</div>` + feelCard() };
      lightWordLater(wk);
      planWeek = addD(wk, 7); planDay = 0; tab = 'plan'; render(); window.scrollTo(0, 0);
    } catch (e) { toast('寫入失敗：' + (e.message || e)); $('doConfirm').disabled = false; $('doConfirm').textContent = '確認這週 ✨'; }
  };
  if ($('addLink')) $('addLink').onclick = async () => {   // 家人島沒有跨科連結這張卡
    const a = $('la').value, b = $('lb').value, n = $('ln').value.trim();
    if (a === b) return toast('選兩個不同的科目喔');
    if (!n) return toast('寫一句話說明它們怎麼連在一起');
    draft.note = $('note').value;
    S = await call('saveLink', { a, b, note: n }); D = derive(S);
    toast(resident(a).name + ' 和 ' + resident(b).name + ' 的好感度上升了！'); render();
  };
}

function itemList(rows, right) {
  let html = '', last = '';
  rows.forEach(r => {
    const it = D.itemsByRow[r]; if (!it) return;
    if (it.subject !== last) { html += `<div class="subj">${subIc(it.subject)} ${esc(it.subject)}</div>`; last = it.subject; }
    html += `<div class="item"><div class="name">${esc(it.name)}${isBoss(it.name) ? '<span class="tag">Boss</span>' : ''}</div>${right(r)}</div>`;
  });
  return html;

async function submitExam() {
  const levels = {}; document.querySelectorAll('[data-sub]').forEach(x => levels[x.dataset.sub] = x.value);
  const wrong = {}; document.querySelectorAll('[data-wrong]').forEach(x => { const v = x.value.trim(); if (v) wrong[x.dataset.wrong] = v; });
  if (Object.values(wrong).some(v => !/^\d{1,2}$/.test(v) || Number(v) > 60)) return toast('題數要填 0～60 的整數，或空著');
  const rec = { date: document.getElementById('exDate').value, source: document.getElementById('exSrc').value.trim(), levels, writing: document.getElementById('exW').value, wrong };
  if (!Object.values(levels).some(Boolean) && !rec.writing) return toast('至少選一科的等級');
  if (!rec.source) return toast('寫一下考卷來源');
  document.getElementById('exGo').disabled = true;
  try {
    S = await call('addAssessment', rec); D = derive(S);
    // 錯題循環③：有一科不是 A++ 才問要不要收錯題（小卡上已經說記好了，不另外跳提示）；「先不用」不留紀錄、不再問
    const lv = Object.values(levels).filter(Boolean);
    if (lv.some(x => x !== 'A++')) { go('exam'); draft.bossWrong = rec.source; draft.bossDate = rec.date; render(); } else { toast('Boss 戰結果已記錄，島民等級更新！'); go('home'); }
  } catch (e) { toast('寫入失敗：' + (e.message || e)); document.getElementById('exGo').disabled = false; }
}

async function drawQrs() {

const BOOK_CATALOG = [{"id": "ginga","title": "銀河鐵道之夜","author": "宮澤賢治","cat": "日本","about": "孤單的喬凡尼在祭典夜晚坐上銀河列車，和好友康帕內拉一起穿越星空。","value": "用一趟星空旅行，溫柔地談「失去」和「真正的幸福是什麼」。許多日本動畫和小說都受它影響，讀過之後會在很多作品裡認出它。","warn": "","tags": ["奇幻","友情"],"hours": 3,"color": "#1f2a4d","ic": "🌌","batch": 1},{"id": "chumon","title": "要求很多的餐廳","author": "宮澤賢治","cat": "日本","about": "兩個紳士獵人在山裡走進一間餐廳，門上一道一道的「要求」越來越怪。","value": "十分鐘就能讀完，結局卻會讓人倒抽一口氣。用童話的方式嘲諷人的傲慢，示範短篇怎麼靠「反轉」說道理。","warn": "","tags": ["童話","短篇"],"hours": 0.5,"color": "#5b3a1e","ic": "🍽️","batch": 1},{"id": "kaze","title": "風又三郎","author": "宮澤賢治","cat": "日本","about": "山村小學來了一個紅頭髮的轉學生，孩子們懷疑他是風的精靈。","value": "把東北山村的風、雨、河寫得像會呼吸一樣，是體會宮澤賢治「人和自然是一體」的入門作。","warn": "","tags": ["童話","自然"],"hours": 2,"color": "#3f6e8c","ic": "🍃","batch": 1},{"id": "izu","title": "伊豆的舞孃","author": "川端康成","cat": "日本","about": "高中生獨自旅行伊豆，和巡迴藝人一家同行幾天。","value": "諾貝爾文學獎作家最好入口的短篇。示範日本文學「什麼都沒說破」的含蓄美：一段沒有開始的心動，卻讓人記很久。","warn": "","tags": ["青春","短篇"],"hours": 1.5,"color": "#b5653a","ic": "🪭","batch": 1},{"id": "koto","title": "古都","author": "川端康成","cat": "日本","about": "京都布莊的養女千重子，在祇園祭遇見長得一模一樣的姊妹。","value": "一整年的京都祭典、和服、北山杉都寫進故事裡，像一本用小說寫的京都歲時記，也談「身世」與「選擇」","warn": "","tags": ["京都","家人"],"hours": 5,"color": "#7a4b6b","ic": "⛩️","batch": 1},{"id": "botchan","title": "少爺","author": "夏目漱石","cat": "日本","about": "直腸子的東京青年到四國鄉下中學當老師，和同事、學生鬥智。","value": "一百多年前的日本國民小說，到現在讀還是很好笑。主角的「正直到笨拙」讓人重新想：圓滑和正直哪個重要。","warn": "","tags": ["幽默","校園"],"hours": 4,"color": "#2f5d62","ic": "🍡","batch": 1},{"id": "rashomon","title": "羅生門・蜘蛛之絲","author": "芥川龍之介","cat": "日本","about": "短篇集：亂世中的僕人、地獄裡抓住一根蜘蛛絲的強盜。","value": "每篇幾頁就把人性的兩難寫透。「羅生門」這個詞後來變成「各說各話」的代名詞，讀了才知道出處。","warn": "","tags": ["短篇","人性"],"hours": 3,"color": "#3a3a3a","ic": "🕸️","batch": 1},{"id": "totto","title": "窗邊的小荳荳","author": "黑柳徹子","cat": "日本","about": "被退學的小荳荳轉進用電車當教室的巴氏學園。","value": "真人真事。校長一句「你真是個好孩子」改變了她一生，讓人看見被理解、被接納對一個人有多重要。","warn": "","tags": ["真人真事","校園"],"hours": 4,"color": "#e98fb3","ic": "🚃","batch": 1},{"id": "saga","title": "佐賀的超級阿嬤","author": "島田洋七","cat": "日本","about": "戰後被寄養在佐賀的男孩，和窮得很樂觀的阿嬤一起生活。","value": "真人真事改編，邊讀邊笑。阿嬤的「窮有兩種：消極的窮和開朗的窮」是很實用的人生觀。","warn": "","tags": ["真人真事","家人"],"hours": 3,"color": "#c8963e","ic": "🍅","batch": 1},{"id": "hakase","title": "博士熱愛的算式","author": "小川洋子","cat": "日本","about": "記憶只有 80 分鐘的數學博士、新來的管家和她十歲的兒子。","value": "少見把數學寫得這麼溫暖的小說：友愛數、完全數變成人和人之間的語言。讀完會覺得數學不只是考試。","warn": "","tags": ["數學","溫暖"],"hours": 5,"color": "#3b5b8c","ic": "🔢","batch": 1},{"id": "namiya","title": "解憂雜貨店","author": "東野圭吾","cat": "日本","about": "三個逃亡的年輕人躲進廢棄雜貨店，收到來自過去的煩惱信。","value": "推理作家寫的溫情小說，幾條故事最後全部扣在一起，很好看。也讓人想：給別人建議，和自己做決定，有什麼不同。","warn": "","tags": ["溫暖","懸疑"],"hours": 7,"color": "#8c6a3e","ic": "✉️","batch": 1},{"id": "kiki","title": "魔女宅急便","author": "角野榮子","cat": "日本","about": "13 歲的見習魔女琪琪離家一年，在海邊小鎮開送貨店。","value": "宮崎駿動畫的原著，比電影多很多章。講第一次離家、靠自己的本事被需要，和「沒自信的時候怎麼辦」","warn": "","tags": ["奇幻","成長"],"hours": 4,"color": "#2e3a59","ic": "🧹","batch": 1},{"id": "natsu","title": "夏之庭","author": "湯本香樹實","cat": "日本","about": "三個小學男生想知道死亡是什麼，開始「監視」一位獨居老人。","value": "從孩子的好奇出發，談死亡卻一點也不沉重。一個夏天的忘年之交，讓人想珍惜身邊的長輩。","warn": "","tags": ["成長","夏天"],"hours": 3,"color": "#6b9a52","ic": "🌻","batch": 1},{"id": "colorful","title": "多彩的黑","author": "森繪都","cat": "日本","about": "一個做錯事的靈魂得到重來的機會，住進一位想不開的國三生身體裡。","value": "主角就是國三生。用局外人的眼光重新看家人、同學和自己，發現每個人都不只一種顏色，對正在升學壓力中的人很有力量。","warn": "","tags": ["成長","國三"],"hours": 5,"color": "#5b6c7d","ic": "🎨","batch": 1},{"id": "yoru","title": "夜間遠足","author": "恩田陸","cat": "日本","about": "高中一年一度、全校走一整夜八十公里的「步行祭」","value": "幾乎沒有大事件，卻把青春最後一次集體活動寫得讓人想一直走下去。日本書店大賞第一名。","warn": "","tags": ["青春","友情"],"hours": 7,"color": "#2a3560","ic": "🌙","batch": 1},{"id": "seirei","title": "精靈守護者","author": "上橋菜穗子","cat": "日本","about": "女保鏢巴爾莎保護被精靈寄宿、被親生父親追殺的皇子。","value": "作者是文化人類學家，整個世界的民俗、神話都有根據。主角是三十歲、靠本事活著的女戰士，很不一樣的奇幻英雄。","warn": "","tags": ["奇幻","冒險"],"hours": 7,"color": "#6b7f3a","ic": "🗡️","batch": 1},{"id": "taiyo","title": "小太陽","author": "林良","cat": "台灣","about": "一個台北家庭和三個女兒長大的日常散文。","value": "兒童文學大師林良的代表作。示範怎麼把平凡的家常寫得有溫度，很適合當寫作文的範本。","warn": "","tags": ["散文","家人"],"hours": 4,"color": "#e8b84a","ic": "☀️","batch": 1},{"id": "tetsudo","title": "11 元的鐵道旅行","author": "劉克襄","cat": "台灣","about": "自然作家只搭區間車，在台灣的小車站下車散步。","value": "讓人發現家門口就有旅行。每一站的老街、小吃、植物都寫得很細，看完會想自己去搭一次。","warn": "","tags": ["旅行","台灣"],"hours": 4,"color": "#2f7fd1","ic": "🚉","batch": 1},{"id": "magician","title": "天橋上的魔術師","author": "吳明益","cat": "台灣","about": "中華商場長大的孩子們，和天橋上變魔術的人。","value": "用孩子的眼睛記下已經拆掉的台北中華商場。魔幻和寫實混在一起，也有改編影集。","warn": "","tags": ["台北","短篇"],"hours": 5,"color": "#8c2f2b","ic": "🎩","batch": 1},{"id": "saigon","title": "西貢小子","author": "張友漁","cat": "台灣","about": "台灣爸爸、越南媽媽的男孩，暑假回到越南外婆家。","value": "從新住民孩子的角度看兩個家鄉。讓人理解班上可能有的同學心裡在想什麼。","warn": "","tags": ["新住民","成長"],"hours": 4,"color": "#d35400","ic": "🛵","batch": 1},{"id": "subway","title": "地下鐵","author": "幾米","cat": "台灣","about": "失明的女孩在地下鐵裡想像一站一站的風景。","value": "繪本，十分鐘看完卻能看很多次。圖畫裡藏著很多細節，適合累的時候翻。","warn": "","tags": ["繪本","想像"],"hours": 0.5,"color": "#16a085","ic": "🚇","batch": 1},{"id": "prince","title": "小王子","author": "聖修伯里","cat": "世界","about": "飛行員在沙漠遇見從小行星來的小王子。","value": "小時候讀和長大讀，是兩本不一樣的書。「真正重要的東西，眼睛是看不見的」","warn": "","tags": ["經典","寓言"],"hours": 2,"color": "#2f6fae","ic": "🌹","batch": 1},{"id": "wonder","title": "奇蹟男孩","author": "R. J. Palacio","cat": "世界","about": "臉部先天缺陷的奧吉第一次上學。","value": "每一章換一個角色說話，讓人練習站在別人的位置想事情。「在對與善良之間，選擇善良」","warn": "","tags": ["校園","善良"],"hours": 6,"color": "#3f6e8c","ic": "🚀","batch": 1},{"id": "henshaw","title": "親愛的漢修先生","author": "Beverly Cleary","cat": "世界","about": "男孩寫信給喜歡的作家，後來開始寫日記。","value": "全書都是信和日記，看一個孩子怎麼透過寫字整理難過的事，順便學會寫作。","warn": "","tags": ["書信","寫作"],"hours": 3,"color": "#8a5a2c","ic": "✏️","batch": 1},{"id": "doukyusei","title": "同級生（第一集）","author": "中村明日美子","cat": "BL","about": "合唱祭前，愛玩樂團的草壁和優等生佐條慢慢靠近。","value": "畫風乾淨、節奏細膩，把「喜歡上一個人」最笨拙的樣子畫得很真。被很多讀者當作 BL 入門。","warn": "只放第一集，續集《卒業生》之後尺度較大。動畫電影分級 PG12","tags": ["漫畫","戀愛"],"hours": 1,"color": "#e9e3d6","ic": "🎵","batch": 1},{"id": "kinou","title": "昨日的美食","author": "吉永史","cat": "BL","about": "律師史朗和美髮師賢二的同居日常，每話一道家常菜。","value": "用每天的晚餐，寫兩個人怎麼在現實裡一起生活，也談出櫃、家人、變老。菜都能照著做。","warn": "青年漫畫，集數多，可以先送第一集","tags": ["漫畫","料理"],"hours": 1,"color": "#c0392b","ic": "🍳","batch": 1},{"id": "sugakugirl","title": "數學女孩","author": "結城浩","cat": "日本","about": "高中生「我」和數學天才米爾迦、學妹蒂蒂，放學後在圖書館一起解數學題。","value": "把數列、質數、母函數寫進校園故事，算式就是對話。讓人看到數學「想通的那一刻」有多快樂，國中程度就能跟上前幾章。","warn": "","tags": ["數學","校園"],"hours": 6,"color": "#c2416b","ic": "➗","batch": 2},{"id": "nijushi","title": "二十四隻瞳","author": "壺井榮","cat": "日本","about": "小豆島的新老師大石，和十二個一年級學生從戰前到戰後的二十年。","value": "用一個班級的命運，寫戰爭怎麼一點一點奪走平凡的日子。沒有戰場，卻是日本最有名的反戰小說之一。","warn": "","tags": ["戰爭","師生"],"hours": 4,"color": "#3f7fa8","ic": "👀","batch": 2},{"id": "lupine","title": "魯冰花","author": "鍾肇政","cat": "台灣","about": "茶園小鎮裡很會畫畫的窮孩子古阿明，和看見他才華的代課老師。","value": "台灣文學經典，寫一個天才怎麼被大人的偏見和比賽制度埋沒。讀完會想：「好成績」和「真本事」是同一件事嗎。","warn": "","tags": ["台灣","天才"],"hours": 4,"color": "#d9a520","ic": "🌼","batch": 2},{"id": "sakinu","title": "山豬・飛鼠・撒可努","author": "亞榮隆・撒可努","cat": "台灣","about": "排灣族作者寫和父親、祖父一起上山打獵、學看森林的日子。","value": "國文課本選過的原住民文學。獵人父親教的不是殺生，而是「森林會告訴你什麼時候該停手」，是另一種看世界的方式。","warn": "","tags": ["原住民","自然"],"hours": 4,"color": "#4f6b3a","ic": "🐗","batch": 2},{"id": "kavalan","title": "少年噶瑪蘭","author": "李潼","cat": "台灣","about": "噶瑪蘭族後代的少年潘新格，意外回到兩百年前祖先的部落。","value": "用穿越冒險認識宜蘭平埔族的歷史，是台灣少年小說的經典。讓人想：「我是誰、從哪裡來」","warn": "","tags": ["穿越","歷史"],"hours": 4,"color": "#2f7f8c","ic": "🛶","batch": 2},{"id": "wangyang","title": "汪洋中的一條船","author": "鄭豐喜","cat": "台灣","about": "天生雙腳畸形的作者，從澎湖窮苦的童年一路讀到大學、當上老師的自傳。","value": "幾十年來國中最常推薦的勵志書。真實的人生比小說還硬，看完會重新算一算自己擁有的東西。","warn": "","tags": ["真人真事","勵志"],"hours": 5,"color": "#2f4f7a","ic": "⛵","batch": 2},{"id": "whale","title": "鯨生鯨世","author": "廖鴻基","cat": "台灣","about": "討海人作家在花蓮外海尋找、記錄鯨魚和海豚。","value": "台灣海洋文學的代表，作者的文章也選進課本。把台灣東邊那片海寫得又近又遼闊，讀完會想去賞鯨。","warn": "","tags": ["海洋","散文"],"hours": 4,"color": "#1f5f8c","ic": "🐋","batch": 2},{"id": "chengnan","title": "城南舊事","author": "林海音","cat": "華文","about": "小英子在北京城南長大，看見瘋女人、小偷、奶媽各自的故事。","value": "用孩子的眼睛看大人的悲歡，寫得淡卻很有餘韻。作者後來在台灣辦《純文學》，是台灣文壇的重要推手。","warn": "","tags": ["童年","散文"],"hours": 3,"color": "#9a6b4a","ic": "🐫","batch": 2},{"id": "shediao","title": "射鵰英雄傳","author": "金庸","cat": "華文","about": "憨直的郭靖和聰明的黃蓉一路闖蕩江湖、學武、保家衛國。","value": "武俠小說的入門首選，很多人因為它愛上閱讀。郭靖證明「笨」也能靠苦練成為大俠，準備考試的人會很有共鳴。","warn": "套書共四冊，可以先送第一冊","tags": ["武俠","冒險"],"hours": 12,"color": "#8c2f2b","ic": "🦅","batch": 2},{"id": "xiyouji","title": "西遊記","author": "吳承恩","cat": "華文","about": "唐僧帶著孫悟空、豬八戒、沙悟淨去西天取經，一路降妖除魔。","value": "四大奇書裡最好讀的一本，很多成語和流行文化都出自這裡。建議送白話或少年版，讀起來輕鬆。","warn": "","tags": ["古典","冒險"],"hours": 10,"color": "#d35400","ic": "🐒","batch": 2},{"id": "women","title": "我們仨","author": "楊絳","cat": "華文","about": "作者回憶和丈夫錢鍾書、女兒錢瑗一家三口的生活。","value": "一家人一起讀書、一起過苦日子，寫得平靜又深情。看完會很想好好珍惜和家人一起吃飯的時間。","warn": "","tags": ["家人","散文"],"hours": 4,"color": "#7a6a5a","ic": "🕯️","batch": 2},{"id": "anne","title": "安妮日記","author": "安妮・法蘭克","cat": "世界","about": "猶太少女安妮躲在阿姆斯特丹的密室兩年，寫下的日記。","value": "十三到十五歲的真實心聲，和你差不多年紀。讓歷史課本上的戰爭，變成一個有名字、會鬥嘴、會作夢的女孩。","warn": "","tags": ["日記","歷史"],"hours": 7,"color": "#b5653a","ic": "📔","batch": 2},{"id": "oldman","title": "老人與海","author": "海明威","cat": "世界","about": "老漁夫聖地牙哥獨自出海，和一條巨大的馬林魚搏鬥三天三夜。","value": "篇幅很短，作者因此拿到諾貝爾文學獎。「人可以被毀滅，但不能被打敗」，是很多人撐過難關時想起的一句話。","warn": "","tags": ["經典","海洋"],"hours": 2,"color": "#2f6fae","ic": "🎣","batch": 2},{"id": "charlotte","title": "夏綠蒂的網","author": "E. B. 懷特","cat": "世界","about": "小豬韋伯快被宰了，蜘蛛夏綠蒂在網上織字救牠。","value": "美國最受喜愛的童書之一，用最簡單的故事談友誼和生命的結束。文字乾淨，英文原版也很適合練閱讀。","warn": "","tags": ["童書","友誼"],"hours": 3,"color": "#c8963e","ic": "🕷️","batch": 2},{"id": "hatchet","title": "手斧男孩","author": "蓋瑞・伯森","cat": "世界","about": "十三歲的布萊恩搭的小飛機墜落在加拿大荒野，身上只有一把手斧。","value": "一個人在森林裡活下來，每一步都要自己想辦法。讀完會更相信：慌張沒有用，冷靜想下一步才有用。","warn": "","tags": ["求生","冒險"],"hours": 4,"color": "#5b7a3a","ic": "🪓","batch": 2},{"id": "giver","title": "記憶傳承人","author": "露薏絲・勞瑞","cat": "世界","about": "在沒有痛苦、也沒有顏色的完美社會，十二歲的喬納思被選為唯一保存記憶的人。","value": "國外中學最常指定的反烏托邦小說。讓人想：如果可以拿掉所有難過，我們會不會也失去快樂和選擇。","warn": "","tags": ["反烏托邦","選擇"],"hours": 4,"color": "#5b6c7d","ic": "🛷","batch": 2},{"id": "alchemist","title": "牧羊少年奇幻之旅","author": "保羅・科爾賀","cat": "世界","about": "西班牙牧羊少年為了一個夢，橫越沙漠到埃及的金字塔找寶藏。","value": "像寓言一樣好讀，全世界賣出上億本。「當你真心渴望某樣東西，整個宇宙都會聯合起來幫助你」，適合迷惘時讀。","warn": "","tags": ["寓言","夢想"],"hours": 3,"color": "#d9a54a","ic": "🐑","batch": 2},{"id": "curious","title": "深夜小狗神秘習題","author": "馬克・海登","cat": "世界","about": "數學很好、和別人不太一樣的十五歲男孩克里斯多弗，決定調查鄰居的狗被殺的案子。","value": "章節全部用質數編號，主角用數學和邏輯理解讓他困惑的世界。讓人體會「和別人不一樣的腦袋」怎麼看事情。","warn": "","tags": ["推理","數學"],"hours": 5,"color": "#c0392b","ic": "🐕","batch": 2},{"id": "fermat","title": "費馬最後定理","author": "賽門・辛","cat": "世界","about": "一道三百五十年沒人解開的數學題，和終於解開它的懷爾斯。","value": "不用會高深數學也看得懂的數學史，像推理小說一樣好看。讓人看見一個人花七年專心做一件事是什麼樣子。","warn": "","tags": ["數學史","真人真事"],"hours": 8,"color": "#2e3a59","ic": "📐","batch": 2},{"id": "holmes","title": "福爾摩斯冒險史","author": "柯南・道爾","cat": "世界","about": "名偵探福爾摩斯和華生醫生的十二個短篇案件。","value": "推理小說的源頭，每一篇都在示範「從觀察到推論」。一篇半小時，很適合睡前讀一案。","warn": "","tags": ["推理","短篇"],"hours": 6,"color": "#3a3a3a","ic": "🔍","batch": 2},{"id": "orient","title": "東方快車謀殺案","author": "阿嘉莎・克莉絲蒂","cat": "世界","about": "被大雪困住的列車上發生命案，車上每個乘客都有不在場證明。","value": "推理女王最有名的作品之一，結局非常有名。讀的時候可以自己列表比對線索，試試能不能比白羅先想到。","warn": "","tags": ["推理","火車"],"hours": 5,"color": "#5b2a3a","ic": "🚂","batch": 2},{"id": "eighty","title": "環遊世界八十天","author": "凡爾納","cat": "世界","about": "英國紳士福格和人打賭，要在八十天內繞地球一圈。","value": "跟著火車、輪船、大象跑遍半個地球，順便複習地理。結尾藏著一個和「時區」有關的漂亮反轉。","warn": "","tags": ["冒險","地理"],"hours": 6,"color": "#8a5a2c","ic": "🌍","batch": 2},{"id": "feynman","title": "別鬧了，費曼先生","author": "理查・費曼","cat": "世界","about": "諾貝爾物理獎得主的趣味自傳：開保險箱、打鼓、在巴西學森巴。","value": "讓人看到科學家原來可以這麼好玩。費曼「不懂就自己動手弄清楚」的態度，比任何讀書方法都受用。","warn": "","tags": ["科學家","幽默"],"hours": 8,"color": "#e3a21a","ic": "🥁","batch": 2},{"id": "fabre","title": "昆蟲記","author": "法布爾","cat": "世界","about": "法布爾在自家荒地觀察糞金龜、螳螂、蟬等昆蟲幾十年的紀錄。","value": "科學和文學合在一起的經典。示範什麼是真正的「觀察」：耐心、記錄、提出問題，正是自然科最需要的能力。","warn": "","tags": ["觀察","昆蟲"],"hours": 6,"color": "#6b7f3a","ic": "🪲","batch": 2},{"id": "lorenz","title": "所羅門王的指環","author": "勞倫茲","cat": "世界","about": "動物行為學家和家裡的寒鴉、灰雁、狗一起生活的觀察筆記。","value": "作者是諾貝爾獎得主，小鵝把他當媽媽的故事就出自這本。幽默又專業，讀完會用不一樣的眼光看身邊的動物。","warn": "","tags": ["動物","幽默"],"hours": 4,"color": "#7a8a5a","ic": "🪿","batch": 2},{"id": "silent","title": "寂靜的春天","author": "瑞秋・卡森","cat": "世界","about": "一位生物學家調查農藥怎麼讓鳥不再歌唱、春天變得安靜。","value": "一本書改變了全世界的環保政策。讓人看到科學證據加上好文字，真的可以改變社會。","warn": "","tags": ["環境","科學"],"hours": 7,"color": "#6b9a52","ic": "🐦","batch": 2},{"id": "sandcounty","title": "沙郡年記","author": "李奧帕德","cat": "世界","about": "作者在威斯康辛州的農場，一個月一個月記下的四季。","value": "生態保育的經典，提出「土地倫理」：人是自然的一份子，不是主人。文字很美，適合一個月讀一篇。","warn": "","tags": ["自然","四季"],"hours": 5,"color": "#9a7a4a","ic": "🌳","batch": 2},{"id": "treeman","title": "種樹的男人","author": "讓・紀沃諾","cat": "世界","about": "一個牧羊人在荒涼的高原上，每天種一百顆橡實，種了幾十年。","value": "一個小時就能讀完。讓人看見每天做一點點、持續很久，可以把荒地變成森林，很適合準備會考時讀。","warn": "","tags": ["寓言","自然"],"hours": 1,"color": "#4f8a4a","ic": "🌰","batch": 2},{"id": "bookthief","title": "偷書賊","author": "馬格斯・朱薩克","cat": "世界","about": "二戰時的德國小鎮，寄養女孩莉賽爾靠偷來的書學會讀字。","value": "由「死神」來說故事，非常特別。讓人看見文字在最黑暗的時候，可以給人多大的力量。","warn": "","tags": ["二戰","閱讀"],"hours": 9,"color": "#3a3a4a","ic": "📚","batch": 2},{"id": "animalfarm","title": "動物農莊","author": "喬治・歐威爾","cat": "世界","about": "農場的動物趕走人類自己當家，豬卻慢慢變成新的主人。","value": "一百多頁的寓言，看懂權力怎麼一步步變質。「所有動物一律平等，但有些動物比其他動物更平等」，公民課最好的補充。","warn": "","tags": ["寓言","公民"],"hours": 2,"color": "#8c4a3a","ic": "🐖","batch": 2}];

}

/* --- 自訂圖片：裁成正方形並縮小，才能存進試算表的一格 --- */
function shrinkImage(file) {
  return new Promise((ok, bad) => {
    const img = new Image();
    img.onload = () => {
      const tryEncode = (size, type, q) => {
        const cv = document.createElement('canvas'); cv.width = cv.height = size;
        const ctx = cv.getContext('2d');
        if (type === 'image/jpeg') { ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, size, size); }
        const m = Math.min(img.width, img.height);
        ctx.drawImage(img, (img.width - m) / 2, (img.height - m) / 2, m, m, 0, 0, size, size);
        return cv.toDataURL(type, q);
      };
      const tries = [[160, 'image/webp', .85], [160, 'image/png'], [128, 'image/webp', .7], [128, 'image/jpeg', .8], [96, 'image/jpeg', .7]];
      for (const t of tries) {
        const url = tryEncode(...t);
        if (url.startsWith('data:' + t[1]) && url.length < 45000) return ok(url);
      }
      bad(new Error('圖片太複雜了，換一張試試'));
    };
    img.onerror = () => bad(new Error('讀不到這張圖片'));
    img.src = URL.createObjectURL(file);
  });
}

function setPath(obj, path, val) {
  const k = path.split('.'); let o = obj;
  for (let i = 0; i < k.length - 1; i++) o = o[k[i]];
  o[k[k.length - 1]] = val;
}
function bindSetup() {
  const c = draft.cfg;
  document.querySelectorAll('[data-f]').forEach(el => el.oninput = el.onchange = () =>
    setPath(c, el.dataset.f, el.type === 'number' ? Number(el.value) : el.value));
  document.querySelectorAll('.emojis').forEach(box => box.onclick = e => {
    const b = e.target.closest('button'); if (!b) return;
    setPath(c, box.dataset.key, b.textContent);
    box.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b));
  });
  document.querySelectorAll('.upl').forEach(box => {
    const key = box.dataset.img;
    box.querySelector('input').onchange = async e => {
      const f = e.target.files[0]; if (!f) return;

      try { S = await call('saveImage', key, await shrinkImage(f)); D = derive(S); toast('圖片換好了！'); render(); }
      catch (err) { toast('圖片上傳失敗：' + (err.message || err)); }
    };
    const del = box.querySelector('[data-del]');

  });

    if (first) local.set('islandSeenVersion', APP_VERSION);

  };
}

/* --- 台北的即時時間與天氣（Open-Meteo，免金鑰）：讓小島跟著天色和天氣變化 --- */
const env = { phase: 'day', hhmm: '', weather: null, temp: null };
const WEATHER_URL = 'https://api.open-meteo.com/v1/forecast?latitude=25.03&longitude=121.56&current=temperature_2m,weather_code,is_day&timezone=Asia%2FTaipei';
const WEATHER_ICON = { clear: '☀️', cloudy: '⛅', fog: '🌫️', rain: '🌧️', storm: '⛈️' };
const WEATHER_NAME = { clear: '晴', cloudy: '多雲', fog: '起霧', rain: '下雨', storm: '雷雨' };
const PHASE_ICON = { dawn: '🌅', day: '🏝️', dusk: '🌇', night: '🌙' };
function taipeiClock() {
  const parts = new Intl.DateTimeFormat('en-GB', { timeZone: 'Asia/Taipei', hour: '2-digit', minute: '2-digit', hour12: false }).formatToParts(new Date());
  const h = Number(parts.find(p => p.type === 'hour').value) % 24, m = parts.find(p => p.type === 'minute').value;
  return { h, hhmm: String(h).padStart(2, '0') + ':' + m };
}
function phaseOf(h) { return h >= 19 || h < 5 ? 'night' : h < 7 ? 'dawn' : h < 17 ? 'day' : 'dusk'; }
function weatherKind(code) {
  if (code >= 95) return 'storm';
  if ((code >= 51 && code <= 67) || (code >= 80 && code <= 82) || (code >= 71 && code <= 77) || code === 85 || code === 86) return 'rain';
  if (code === 45 || code === 48) return 'fog';
  if (code >= 2) return 'cloudy';
  return 'clear';
}
// 二十四節氣（台灣常用的日期，前後差一天沒關係）：整座島的草地、樹葉和飄落物跟著變
const TERMS = [['小寒', 1, 6], ['大寒', 1, 20], ['立春', 2, 4], ['雨水', 2, 19], ['驚蟄', 3, 6], ['春分', 3, 21], ['清明', 4, 5], ['穀雨', 4, 20],
  ['立夏', 5, 6], ['小滿', 5, 21], ['芒種', 6, 6], ['夏至', 6, 21], ['小暑', 7, 7], ['大暑', 7, 23], ['立秋', 8, 8], ['處暑', 8, 23],
  ['白露', 9, 8], ['秋分', 9, 23], ['寒露', 10, 8], ['霜降', 10, 23], ['立冬', 11, 7], ['小雪', 11, 22], ['大雪', 12, 7], ['冬至', 12, 22]];
const TERM_NOTE = {
  立春: '春天開始了，樹梢冒出淡淡的粉紅', 雨水: '春雨來了，第一批櫻花開始飄', 驚蟄: '春雷叫醒了小蟲，櫻花正盛', 春分: '晝夜一樣長，滿島櫻花',
  清明: '櫻花吹雪的最後幾天', 穀雨: '雨水滋潤新綠，櫻花謝了', 立夏: '夏天開始，島上一片新綠', 小滿: '麥子漸漸飽滿，樹葉更深了',
  芒種: '梅雨季，晚上有螢火蟲', 夏至: '一年白天最長的一天，晚上螢火蟲最多', 小暑: '熱起來了，夜裡螢火蟲還在', 大暑: '一年最熱的時候，記得多喝水',
  立秋: '秋天開始，暑氣還沒退', 處暑: '暑氣慢慢退了，有幾片葉子轉黃', 白露: '早晚涼了，葉子開始變色', 秋分: '晝夜又一樣長，島上一半轉黃',
  寒露: '楓葉轉紅，開始飄落', 霜降: '楓紅最美的時候，滿地紅葉', 立冬: '冬天開始，最後一批楓葉', 小雪: '天氣涼了，樹葉安靜下來',
  大雪: '台灣不下雪，島上換上深綠的冬裝', 冬至: '一年夜晚最長，吃湯圓的日子', 小寒: '寒流來了，山茶花開', 大寒: '一年最冷的時候，早開的櫻花在等春天'
};
function solarTerm(date) {
  const d = parseD(date), m = d.getMonth() + 1, day = d.getDate();
  let t = '冬至'; TERMS.forEach(x => { if (m > x[1] || (m === x[1] && day >= x[2])) t = x[0]; });
  return t;
}
function termIcon(t) { const i = TERMS.findIndex(x => x[0] === t); return ['❄️', '❄️', '🌸', '🌸', '🌸', '🌸', '🌸', '🌱', '🌿', '🌿', '🌿', '🌿', '🌿', '🌿', '🌾', '🌾', '🌾', '🌾', '🍁', '🍁', '🍁', '🍂', '❄️', '❄️'][i] || '🌿'; }
function envText() {
  const ph = env.phase === 'night' && env.weather === 'clear' ? '🌙' : (env.weather ? WEATHER_ICON[env.weather] : PHASE_ICON[env.phase]);
  const t = S && S.today ? solarTerm(S.today) : '';
  return `${ph} 台北 ${env.hhmm}${env.temp != null ? '・' + WEATHER_NAME[env.weather] + ' ' + env.temp + '°C' : ''}${t ? '・' + termIcon(t) + t : ''}`;
}
function updateEnv() {
  const t = taipeiClock();
  env.hhmm = t.hhmm; env.phase = phaseOf(t.h);
  const chip = document.getElementById('envChip'); if (chip) chip.textContent = envText();
  if (window.Island3D && Island3D.setEnvironment) Island3D.setEnvironment({ phase: env.phase, weather: env.weather || 'clear' });
}
async function fetchWeather() {
  try {
    const j = await (await fetch(WEATHER_URL)).json();
    env.temp = Math.round(j.current.temperature_2m);
    env.weather = weatherKind(Number(j.current.weather_code));
  } catch (e) { /* 沒網路就只跟著時間變化 */ }
  updateEnv();
}
updateEnv(); fetchWeather();
setInterval(updateEnv, 60 * 1000);
setInterval(fetchWeather, 10 * 60 * 1000);

boot();
</script>
