<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#741b47">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="會考小島">

<title>會考小島</title>
<style>
  :root {
    --plum: #741b47; --plum-mid: #c27ba0; --plum-light: #ead1dc;
    --sea: #cfe8f3; --sand: #fdf6ec; --grass: #dff0d8; --ink: #3a2a33; --muted: #8a7480;
    --card: #ffffff; --gold: #e3a21a;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
         background: var(--sea); color: var(--ink); -webkit-tap-highlight-color: transparent; }
  main { max-width: 720px; margin: 0 auto; padding: max(16px, env(safe-area-inset-top)) 16px 96px; }
  h1, h2, h3 { margin: 0 0 8px; }
  h2 { font-size: 20px; } h3 { font-size: 16px; }
  .card { background: var(--card); border-radius: 16px; padding: 16px; margin-bottom: 14px;
          box-shadow: 0 2px 0 rgba(116,27,71,.12); }
  .muted { color: var(--muted); font-size: 13px; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .grow { flex: 1; }
  button { font: inherit; border: none; border-radius: 12px; padding: 10px 16px; cursor: pointer;
           background: var(--plum); color: #fff; }
  button.ghost { background: var(--plum-light); color: var(--plum); }
  button:disabled { opacity: .5; cursor: default; }
  input, select, textarea { font: inherit; padding: 8px 10px; border: 1.5px solid var(--plum-light);
           border-radius: 10px; background: #fff; color: var(--ink); width: 100%; }
  textarea { min-height: 60px; }
  label { display: block; font-size: 13px; color: var(--muted); margin: 8px 0 4px; }

  /* 頂部狀態列 */
  .hud { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; text-align: center; }
  .hud b { display: block; font-size: 20px; color: var(--plum); }
  .bar { height: 10px; background: var(--plum-light); border-radius: 6px; overflow: hidden; margin-top: 8px; }
  .bar > i { display: block; height: 100%; background: var(--plum); }

  /* 小島 */
  .island { background: var(--grass); border: 10px solid var(--sand); padding: 14px; border-radius: 32px; }
  .districts { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 10px; }
  .district { background: rgba(255,255,255,.85); border-radius: 14px; padding: 12px; }
  .resident { display: flex; gap: 10px; align-items: center; }
  .avatar { font-size: 34px; line-height: 1; }
  .grade { margin-left: auto; font-weight: 700; color: #fff; background: var(--plum); border-radius: 8px; padding: 2px 8px; }
  .grade.none { background: #bbb; }
  .town { font-size: 20px; letter-spacing: 2px; margin-top: 8px; min-height: 26px; word-break: break-all; }
  .lane { display: flex; align-items: center; gap: 6px; margin-top: 6px; }
  .lane-name { flex: 0 0 72px; font-size: 13px; color: var(--plum); }
  .lane-name small { display: block; color: var(--muted); font-size: 11px; }
  .lane .town { margin-top: 0; font-size: 17px; min-height: 0; }
  .speech { background: var(--sand); border-radius: 14px; padding: 10px 14px; position: relative; }

  /* 結算 */
  .subj { margin-top: 12px; font-weight: 700; color: var(--plum); }
  .item { display: flex; align-items: center; gap: 8px; padding: 8px 0; border-bottom: 1px dashed var(--plum-light); }
  .item .name { flex: 1; }
  .tag { font-size: 11px; background: var(--gold); color: #fff; border-radius: 6px; padding: 1px 6px; margin-left: 4px; }
  .seg { display: flex; border-radius: 10px; overflow: hidden; border: 1.5px solid var(--plum-light); }
  .seg button { border-radius: 0; padding: 6px 10px; background: #fff; color: var(--muted); }
  .seg button[data-s="2"].on { background: var(--plum); color: #fff; }
  .seg button[data-s="1"].on { background: var(--plum-mid); color: #fff; }
  .seg button[data-s="0"].on { background: var(--plum-light); color: var(--plum); }
  .check { width: 22px; height: 22px; accent-color: var(--plum); }

  .badges { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 8px; }
  .badge { text-align: center; padding: 10px 6px; border-radius: 12px; background: var(--sand); font-size: 12px; }
  .badge .ic { font-size: 28px; display: block; }
  .badge.locked { filter: grayscale(1); opacity: .45; }

  td:first-child { white-space: nowrap; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  th, td { padding: 6px 4px; text-align: center; border-bottom: 1px solid var(--plum-light); }

  /* 底部分頁 */
  nav { position: fixed; bottom: 0; left: 0; right: 0; background: #fff; display: flex;
        box-shadow: 0 -2px 8px rgba(0,0,0,.08); padding-bottom: env(safe-area-inset-bottom); }
  nav button { flex: 1; background: none; color: var(--muted); border-radius: 0; padding: 10px 0 8px; font-size: 12px; }
  nav button span { display: block; font-size: 22px; }
  nav button.on { color: var(--plum); font-weight: 700; }

  .pic { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; vertical-align: middle; background: #fff; }
  .avatar .pic { width: 52px; height: 52px; }
  .ipic { width: 1.4em; height: 1.4em; border-radius: 50%; object-fit: cover; vertical-align: -0.35em; background: #fff; }
  .upl { margin-top: 6px; }
  .upl label.btn { display: inline-block; margin: 0; font-size: 14px; background: var(--plum-light); color: var(--plum); padding: 6px 12px; border-radius: 10px; cursor: pointer; }
  .upl button { font-size: 14px; padding: 6px 12px; }
  .emojis { display: flex; flex-wrap: wrap; gap: 4px; }
  .emojis button { background: #fff; border: 1.5px solid var(--plum-light); font-size: 22px; padding: 4px 6px; }
  .emojis button.on { border-color: var(--plum); background: var(--plum-light); }

  .toast { position: fixed; left: 50%; top: 20px; transform: translateX(-50%); background: var(--ink); color: #fff;
           padding: 10px 18px; border-radius: 12px; z-index: 9; display: none; max-width: 90%; }
  .loading { text-align: center; padding: 60px 0; color: var(--muted); }
  .big { font-size: 40px; text-align: center; }

  /* 計畫頁 */
  .chips { display: grid; grid-template-columns: repeat(8, 1fr); gap: 4px; }
  .chip { padding: 6px 0; background: var(--sand); color: var(--ink); border-radius: 10px; font-size: 15px; font-weight: 700; line-height: 1.2; }
  .chip small { display: block; font-size: 10px; font-weight: 400; color: var(--muted); }
  .chip i { display: block; font-style: normal; font-size: 10px; font-weight: 400; color: var(--plum); min-height: 12px; }
  .chip.today { box-shadow: inset 0 0 0 2px var(--gold); }
  .chip.on { background: var(--plum); color: #fff; } .chip.on small, .chip.on i { color: #fde; }
  button.x { background: none; color: var(--muted); padding: 4px 6px; }
  label.btn { display: block; margin: 0; font-size: 16px; background: var(--plum); color: #fff; padding: 10px 16px; border-radius: 12px; cursor: pointer; }
  .pill { display: inline-block; background: var(--plum-light); color: var(--plum); border-radius: 8px; padding: 2px 8px; margin: 2px 4px 2px 0; font-size: 13px; }
  .step { display: flex; align-items: center; gap: 4px; }
  .step button { padding: 4px 10px; } .step b { min-width: 26px; text-align: center; }
  /* 故事任務 */
  .opts { display: grid; gap: 6px; }
  .opt { background: #fff; color: var(--ink); border: 1.5px solid var(--plum-light); text-align: left; }
  .opt.right { background: #dff3e3; border-color: #3f9a55; color: #1f5a2e; opacity: 1; }
  .opt.wrong { background: #fbe0e0; border-color: #c0392b; color: #7a1f1f; opacity: 1; }
  .env { font-size: 13px; color: var(--muted); }
  /* 我的家 */
  .room { display: flex; flex-direction: column; justify-content: space-between; min-height: 230px; padding: 12px 8px; border-radius: 14px; border: 2px solid var(--plum-light); }
  .zone { display: flex; flex-wrap: wrap; justify-content: center; gap: 4px 10px; min-height: 70px; align-items: flex-end; }
  .slot { display: flex; flex-direction: column; align-items: center; justify-content: flex-end; min-width: 52px; }
  .slot .pic { width: 40px; height: 40px; }
  .slot span { font-size: 34px; line-height: 1.1; } .slot small { font-size: 10px; color: var(--muted); }
  .furn { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 6px; margin-top: 8px; }
  .furn button { background: #fff; color: var(--ink); border: 1.5px solid var(--plum-light); padding: 8px 4px; font-size: 13px; }
  .furn button span { display: block; font-size: 26px; } .furn button small { display: block; color: var(--muted); font-size: 11px; }
  .stamps { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin-top: 10px; }
  .stamp { aspect-ratio: 1; border: 2px dashed var(--plum-light); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: 13px; }
  .stamp.today { border-color: var(--plum); }
  .stamp.on { border: 2px solid #c0392b; background: #fff5f3; color: #c0392b; font-weight: 700; font-size: 18px; transform: rotate(-8deg); }
  .hanko { display: inline-flex; width: 30px; height: 30px; border: 2px solid #c0392b; border-radius: 50%; color: #c0392b; font-weight: 700; align-items: center; justify-content: center; transform: rotate(-8deg); }
  .greet { position: fixed; inset: 0; background: rgba(60, 20, 45, .35); display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 50; animation: fadeIn .3s; }
  .greet-card { background: #fff; border-radius: 24px; padding: 22px 18px; max-width: 380px; width: 100%; text-align: center; box-shadow: 0 10px 40px rgba(0,0,0,.2); animation: popIn .45s cubic-bezier(.2,1.4,.4,1); }
  .greet-pic { font-size: 64px; line-height: 1; } .greet-pic .pic { width: 84px; height: 84px; }
  @keyframes fadeIn { from { opacity: 0; } } @keyframes popIn { from { transform: scale(.7); opacity: 0; } }
  .exq img { display: block; width: 100%; height: auto; background: #fff; border: 1px solid var(--plum-light); border-radius: 10px; margin: 10px 0 6px; }
  .opts.abcd { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; } .opts.abcd .opt { text-align: center; font-weight: 700; }
  .tiers { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 8px; }
  .tiers button { padding: 10px 4px; font-size: 14px; line-height: 1.4; } .tiers button small { display: block; font-size: 11px; opacity: .85; }
  .furn button.on { border-color: var(--plum); background: var(--plum-light); } .furn button.has { background: var(--sand); }
</style>
</head>
<body>
<main id="app"><div class="loading">🏝️ 小島載入中…</div></main>
<nav id="nav" style="display:none"></nav>
<div class="toast" id="toast"></div>

<script src="config.js"></script>
<script>
/* ===== 基本設定 ===== */
const SUBJECTS = ['國', '英', '數', '自', '社'];
const SUBJECT_NAME = { 國: '國文', 英: '英文', 數: '數學', 自: '自然', 社: '社會' };
const GROUP = { 國: '國', 英: '英', 數: '數', 理化: '自', 生物: '自', 地科: '自', 自然: '自',
                歷史: '社', 地理: '社', 公民: '社', 社會: '社' };
// 自然、社會底下的分科，各自有一條小巷，房子分開蓋
const SUBS = { 自: ['理化', '生物', '地科'], 社: ['歷史', '地理', '公民'] };
const LEVELS = ['A++', 'A+', 'A', 'B++', 'B+', 'B', 'C'];
const EMOJIS = ['🐱','🐶','🐰','🦊','🐻','🐼','🐨','🐸','🐧','🦉','🐙','🦄','🐹','🦝','🐳','🐯','🦁','🐮','🐷','🐤','🌸','⭐','🍀','🎧','⚾','🎮','📚','🔮'];
// 每 2 點蓋一棟 🏠；5 棟合成 🏘️，4 個 🏘️ 合成 🏢，4 棟 🏢 合成 🏰
const TIERS = [['🏰', 80], ['🏢', 20], ['🏘️', 5], ['🏠', 1]];
const TONES = { 朋友: '像朋友一樣聊天', 學姊: '溫柔的學姊', 吐槽: '愛吐槽但很挺你', 中二: '中二熱血' };

let S = null;          // 後端給的狀態
let D = null;          // 計算後的遊戲數值
let tab = 'home';
let draft = {};        // 表單暫存

/* ===== 版本與更新紀錄：每次改版都要更新這裡和 viewGuide() 的玩法說明 ===== */
const APP_VERSION = '2.5';
const CHANGELOG = [
  { v: '2.5', date: '2026-10-25', items: ['🏃 運動集章卡：今天運動了就蓋一章，一週 3 章得 3 枚島幣，連續達標解鎖排球和日本風家具', '海邊步道：每蓋一章鋪一段木棧道，每三章多一盞燈籠', '⛵ 紙船碼頭：檢討完紙本考卷放一艘紙船，和爸爸一起檢討是親子船', '🍁 整座島跟著二十四節氣換季：春天櫻花、夏夜螢火蟲、秋天楓紅'] },
  { v: '2.4', date: '2026-10-24', items: ['💡 讓島順起來：在嚮導卡下面寫你對小島的想法，爸爸會收到，也會在這裡回覆你'] },
  { v: '2.3', date: '2026-10-24', items: ['嚮導每天第一次見面會先跟你打招呼', '加碼任務改成「挑戰任務」：不用花島幣，自己選基礎／中級／進階，答對賺 1～3 枚島幣，每天最多 10 題', '挑戰任務的題目來自會考考古題（106～115 年，心測中心）', '我的家可以用 3D 走進房間看', '可以去島民家作客、送他們家具、幫他們換牆壁顏色'] },
  { v: '2.2', date: '2026-10-24', items: ['🏠 我的家：在島中央蓋你的家，島嶼升級就會擴建', '🛋️ 家具店：用島幣買家具，擺進自己的房間', '📬 信箱：島民每天的信和嚮導的新聞都收在這裡', '🪙 加碼任務降價，1 枚島幣就能換一題'] },
  { v: '2.1', date: '2026-10-24', items: ['🪙 加碼任務：用 3 枚島幣換一題新的會考題，島民每次出的都不一樣', '📮 島民每天都會寫一則訊息給你，語氣跟他的個性一樣，還會聊 Threads 上的熱門話題', '📰 嚮導每天會講一則昨天的國內外新聞，還會告訴你跟會考哪一科有關'] },
  { v: '2.0', date: '2026-10-24', items: ['📅 新的「計畫」頁：一天一天排這週要做的項目，取代出戰名單', '📷 拍下手寫計畫，小島會幫你排進每一天，打勾的順便記成完成', '📖 我的寫法：教島民認你的縮寫，行程可以標成無關；一個寫法可以代表好幾項', '❓ 待定項目：還不知道是哪一科的先排著，上課後再選', '📝 任務清單：可以自己新增、改名，國文多了「成語」', '📝 首頁多了「今天」：做完就點完成，隨時記、週日一次補都可以', '✅ 週日結算變成「確認這週」：每天的紀錄自動帶進來，達成率照次數算', '📖 故事任務：島民遇到難題，幫他解一題會考題，答對 +15', '🌦️ 3D 小島跟著台北的時間和天氣變化，晚上會亮燈、下雨會下雨'] },
  { v: '1.4', date: '2026-10-24', items: ['🗺️ 3D 小島：可以轉動、縮放，點一條街看島民和房子', '⏳ 成長回放：從 5 月第一週開始，看你的島一週一週長出來', '跨科連結會變成島民之間的粉紅色拱橋', '首頁可以在「3D 小島」和「清單」之間切換'] },
  { v: '1.3', date: '2026-10-24', items: ['新增「玩法說明」：右上角的 ❓ 隨時可以打開', '說明「島民」和「室友」的差別', '每次更新後，首頁會告訴你這次多了什麼'] },
  { v: '1.2', date: '2026-10-24', items: ['嚮導、島民、室友都可以換成自己的圖片'] },
  { v: '1.1', date: '2026-10-24', items: ['自然街、社會街分成三條小巷，房子分開蓋', '可以替理化、生物、地科、歷史、地理、公民各取一位室友'] },
  { v: '1.0', date: '2026-10-24', items: ['開島！小島、週日結算、出戰名單、Boss 戰、商店、休息卡'] }
];
// 3D 小島只在網頁 App 版提供（需要同資料夾的 three.js）；Apps Script 版沒有 config.js，維持清單畫面
const BETA3D = !!window.ISLAND_API_URL;
const local = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} }
};

/* ===== 後端呼叫（透過 Apps Script API 同步到 Google 試算表） ===== */
const store = local;
async function call(fn, ...args) {
  let res;
  try {
    res = await fetch(window.ISLAND_API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },   // 用 text/plain 避免跨網域預檢
      body: JSON.stringify({ token: store.get('islandToken'), fn, args })
    });
  } catch (e) {
    throw new Error('連不上小島伺服器，檢查一下網路再試一次');
  }
  const j = await res.json();
  if (j.error === 'unauthorized') { store.del('islandToken'); showPair('配對碼不對或已經更換，請重新輸入'); throw new Error('需要重新配對'); }
  if (j.error) throw new Error(j.error);
  if (j.result && j.result.weeks) store.set('islandCache', JSON.stringify(j.result));
  return j.result;
}
function showPair(msg) {
  document.getElementById('nav').style.display = 'none';
  document.getElementById('app').innerHTML = `<div class="card" style="margin-top:40px"><div class="big">🏝️</div>
    <h2 style="text-align:center">登島配對</h2>
    <div class="muted" style="text-align:center">第一次使用時，輸入爸爸給你的 8 碼配對碼。之後就不用再輸入了。</div>
    ${msg ? `<div style="text-align:center;color:var(--plum);margin-top:8px">${esc(msg)}</div>` : ''}
    <label>配對碼</label><input id="pairCode" autocomplete="off" autocapitalize="characters" placeholder="例如 K7MX2QPA" style="text-transform:uppercase;letter-spacing:4px;text-align:center;font-size:22px">
    <div style="margin-top:12px"><button style="width:100%" id="pairGo">登島</button></div></div>`;
  document.getElementById('pairGo').onclick = () => {
    const v = document.getElementById('pairCode').value.trim().toUpperCase();
    if (v.length < 6) return toast('配對碼是 8 個字');
    store.set('islandToken', v);
    document.getElementById('app').innerHTML = '<div class="loading">🏝️ 登島中…</div>';
    load();
  };
}
function boot() {
  if (!window.ISLAND_API_URL || /請貼上/.test(window.ISLAND_API_URL)) {
    document.getElementById('app').innerHTML = '<div class="card">還沒設定小島伺服器的網址（config.js）。</div>';
    return;
  }
  if (!store.get('islandToken')) return showPair();
  const cached = store.get('islandCache');
  if (cached) { try { S = JSON.parse(cached); D = derive(S); render(); } catch (e) {} }
  load();
}
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.style.display = 'block';
  clearTimeout(toast.h); toast.h = setTimeout(() => t.style.display = 'none', 2600);
}
async function load(fn, ...args) {
  try {
    S = await call(fn || 'getState', ...args);
    D = derive(S);
    render();
    seedDefaults();
  } catch (e) {
    if (!store.get('islandToken')) return;              // 已經切到配對畫面
    if (S) toast(e.message || String(e));             // 有離線資料就先顯示，提示同步失敗
    else document.getElementById('app').innerHTML = '<div class="card">讀取失敗：' + esc(e.message || e) + '</div>';
  }
}

/* ===== 日期 ===== */
function parseD(s) { const p = s.split('-').map(Number); return new Date(p[0], p[1] - 1, p[2]); }
function fmtD(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function addD(s, n) { const d = parseD(s); d.setDate(d.getDate() + n); return fmtD(d); }
function mondayOf(s) { const d = parseD(s); const w = (d.getDay() + 6) % 7; d.setDate(d.getDate() - w); return fmtD(d); }
function short(s) { const p = s.split('-'); return Number(p[1]) + '/' + Number(p[2]); }
function assessDate(s) {
  const m = String(s).match(/(\d{4})\D(\d{1,2})\D?(\d{1,2})?/);
  return m ? new Date(+m[1], +m[2] - 1, +(m[3] || 1)) : new Date(0);
}

/* ===== 遊戲數值 ===== */
function isBoss(name) { return /歷屆|模卷|會考|學測/.test(name); }

function derive(S) {
  const save = S.save || {};
  const cfg = save.config || null;
  const itemsByRow = {}; S.items.forEach(it => itemsByRow[it.row] = it);
  let xp = 0, coinXp = 0;   // 島幣只從開島後的活動計算，過去的紀錄只換成經驗值和房子
  const pts = { 國: 0, 英: 0, 數: 0, 自: 0, 社: 0 };
  const ptsBy = {};   // 依試算表上的科目（理化、生物…）分開累計
  let bossDone = 0, fullCombo = 0;
  const log = [];

  // 每週紀錄、連續週數與休息卡；一週做了幾次看 App 的紀錄，舊的週看試算表顏色
  let streak = 0, best = 0, cards = 0, earned = 0, recordedWeeks = 0;
  const rates = [];       // 確認過、有計畫的週：達成率
  const weekPts = [];     // 每週各分科的點數，給 3D 成長回放用
  const curMon = mondayOf(S.today);
  weekList().forEach(start => {
    if (start > S.today) return;
    const wd = weekData(start), wp = {};
    let any = false, wxp = 0;
    Object.keys(wd.done).forEach(r => {
      const it = itemsByRow[r], u = wd.done[r];
      if (!it || !(u > 0)) return;
      any = true;
      const g = GROUP[it.subject] || it.subject;
      wxp += u * 10 * (isBoss(it.name) ? 2 : 1);
      if (pts[g] !== undefined) pts[g] += u;
      ptsBy[it.subject] = (ptsBy[it.subject] || 0) + u;
      wp[it.subject] = (wp[it.subject] || 0) + u;
      if (u >= 1 && isBoss(it.name)) bossDone++;
    });
    weekPts.push({ start, pts: wp });
    if (wd.settled) { any = true; wxp += 20; }
    if (wd.settled && wd.total) {
      const ratio = wd.got / wd.total;
      if (ratio >= 1) { wxp += 40; fullCombo++; } else if (ratio >= .8) wxp += 25; else if (ratio >= .5) wxp += 10;
      rates.push({ start, got: wd.got, total: wd.total });
    }
    const isCurrent = start === curMon;
    if (any) {
      recordedWeeks++; streak++; earned++;
      if (earned % 6 === 0) cards++;
    } else if (!isCurrent) {
      if (cards > 0) { cards--; streak++; log.push('休息卡守住了 ' + short(start) + ' 那週'); }
      else streak = 0;
    }
    best = Math.max(best, streak);
    xp += wxp;
    if (wd.settled || wd.daily) coinXp += wxp;
  });
  xp = Math.round(xp); coinXp = Math.round(coinXp);

  const exams = S.assessments.length;
  xp += exams * 50;
  const links = save.links || [];
  xp += links.length * 15;
  coinXp += ((save.exams || []).length * 50) + links.length * 15;
  const questsDone = Object.keys(save).filter(k => k.startsWith('quest:') && save[k] && save[k].done).map(k => save[k]);
  const questsRight = questsDone.filter(q => q.correct).length;
  const xqDone = Object.keys(save).filter(k => k.startsWith('xq:') && save[k] && save[k].done).map(k => save[k]);
  const sumXp = list => list.reduce((a, q) => a + (q.xp || 0), 0);
  // 挑戰任務（有難度的加碼任務）答對直接給島幣，經驗值只拿來升級；舊的付費加碼任務照舊換島幣
  const xqCoins = xqDone.filter(q => q.tier).reduce((a, q) => a + (q.coins || 0), 0);
  xp += sumXp(questsDone) + sumXp(xqDone);
  coinXp += sumXp(questsDone) + sumXp(xqDone.filter(q => !q.tier));

  // 運動集章卡：一章 +5 經驗值；一週集滿 3 章 +3 枚島幣；每週 ≥ 3 章算連續達標
  const exDays = Object.keys(save).filter(k => k.startsWith('ex:') && save[k]).map(k => k.slice(3)).sort();
  const exWeeks = {}; exDays.forEach(d => { const w = mondayOf(d); exWeeks[w] = (exWeeks[w] || 0) + 1; });
  xp += exDays.length * 5;
  const exCoins = Object.values(exWeeks).filter(n => n >= EX_GOAL).length * 3;
  let exStreak = 0, exBest = 0;
  if (exDays.length) {
    for (let w = mondayOf(exDays[0]); w <= curMon; w = addD(w, 7)) {
      if ((exWeeks[w] || 0) >= EX_GOAL) exStreak++;
      else if (w !== curMon) exStreak = 0;   // 這週還沒結束，不算斷
      exBest = Math.max(exBest, exStreak);
    }
  }
  // 紙船（自己檢討）、親子船（爸爸一起）：第一科 2 枚＋20 經驗值，每多一科 +1 枚，一次最多 4 枚；兩種船各自每天算 1 次
  const papers = Object.keys(save).filter(k => k.startsWith('paper:') && save[k]).sort().map(k => Object.assign({ id: k }, save[k]));
  const sessions = []; papers.forEach(x => { let ss = sessions.find(y => y.session === x.session); if (!ss) sessions.push(ss = { session: x.session, kind: x.kind, date: x.at, note: x.note, lanes: [], rows: [] }); ss.lanes.push(x.lane); ss.rows.push(x); });
  const paidDay = {}; let paperCoins = 0;
  sessions.forEach(ss => { const k = ss.kind + ss.date; ss.paid = !paidDay[k]; paidDay[k] = true;
    if (ss.paid) { ss.coins = Math.min(PAPER_MAX, 1 + ss.lanes.length); paperCoins += ss.coins; xp += 20; } });

  const spent = (save.purchases || []).reduce((a, p) => a + p.price, 0);
  const coins = 20 + Math.floor(coinXp / 10) + xqCoins + exCoins + paperCoins - spent;   // 開島禮物 20 枚
  const level = Math.floor(Math.sqrt(xp / 60)) + 1;
  const lvBase = 60 * Math.pow(level - 1, 2), lvNext = 60 * Math.pow(level, 2);

  // 每科最新一次試煉的等級
  const grades = {};
  SUBJECTS.concat(['文']).forEach(s => {
    const rows = S.assessments.filter(a => a[s]).sort((a, b) => assessDate(b.date) - assessDate(a.date));
    grades[s] = rows[0] ? { level: rows[0][s], date: rows[0].date, source: rows[0].source } : null;
  });

  // 島民之間的好感度（跨科連結）
  const bond = {};
  links.forEach(l => { const k = [l.a, l.b].sort().join(''); bond[k] = (bond[k] || 0) + 1; });

  const settledCount = Object.keys(save).filter(k => k.startsWith('settled:')).length;
  const badges = [
    { ic: '🏝️', name: '開島紀念', ok: !!cfg },
    { ic: '📝', name: '第一次確認', ok: settledCount >= 1 },
    { ic: '🔥', name: '連續 4 週', ok: best >= 4 },
    { ic: '🔥', name: '連續 12 週', ok: best >= 12 },
    { ic: '🌋', name: '連續 24 週', ok: best >= 24 },
    { ic: '⚔️', name: 'Boss 獵人 ×5', ok: bossDone >= 5 },
    { ic: '🗡️', name: 'Boss 獵人 ×20', ok: bossDone >= 20 },
    { ic: '🎵', name: 'Full Combo', ok: fullCombo >= 1 },
    { ic: '🎶', name: 'Full Combo ×5', ok: fullCombo >= 5 },
    { ic: '🔗', name: '跨科偵探', ok: links.length >= 3 },
    { ic: '🧭', name: '試煉者 ×10', ok: exams >= 10 },
    { ic: '🎯', name: '任務達人 ×10', ok: questsDone.length >= 10 },
    { ic: '📖', name: '解題高手 ×20', ok: questsRight + xqDone.filter(q => q.correct).length >= 20 },
    { ic: '🪙', name: '加碼挑戰 ×10', ok: xqDone.length >= 10 },
    { ic: '🏰', name: '島嶼 Lv.10', ok: level >= 10 },
    { ic: '🏐', name: '運動集章 ×30', ok: exDays.length >= 30 },
    { ic: '⛵', name: '紙船 ×10', ok: sessions.length >= 10 }
  ];

  return { cfg, xp, coins, level, lvBase, lvNext, pts, ptsBy, streak, best, cards, recordedWeeks, grades, bond,
           links, badges, bossDone, fullCombo, log, itemsByRow, questsDone, rates, weekPts,
           exDays, exWeeks, exStreak, exBest, paperSessions: sessions };
}

/* ===== 共用 ===== */
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
// 自訂圖片存在存檔的 img:<key>，沒有圖片時用 emoji
function imgOf(key) { return S && S.save && S.save['img:' + key]; }
function pic(key, emoji) { const src = imgOf(key); return src ? `<img class="pic" src="${src}" alt="">` : emoji; }
function ipic(key, emoji) { const src = imgOf(key); return src ? `<img class="ipic" src="${src}" alt="">` : emoji; }
function resident(s) {
  const r = (D.cfg && D.cfg.residents && D.cfg.residents[s]) || {};
  const emoji = r.emoji || '🙂';
  return { name: r.name || SUBJECT_NAME[s] + '島民', emoji, pic: pic(s, emoji), ipic: ipic(s, emoji), personality: r.personality || '', relation: r.relation || '' };
}
function roommate(sub) {
  const r = (D.cfg && D.cfg.roommates && D.cfg.roommates[sub]) || {};
  return { name: r.name || '', emoji: r.emoji || '' };
}
function streets(s) {
  if (!SUBS[s]) return `<div class="town">${town(D.pts[s])}</div>`;
  const rows = SUBS[s].map(sub => {
    const m = roommate(sub);
    return `<div class="lane"><span class="lane-name">${imgOf('sub:' + sub) || m.emoji ? ipic('sub:' + sub, m.emoji) + ' ' : ''}${esc(m.name || sub)}<small>${m.name ? sub : ''}</small></span><span class="town">${town(D.ptsBy[sub] || 0)}</span></div>`;
  });
  const whole = s === '自' ? '自然' : '社會';
  if (D.ptsBy[whole]) rows.push(`<div class="lane"><span class="lane-name">綜合廣場<small>模卷・歷屆</small></span><span class="town">${town(D.ptsBy[whole])}</span></div>`);
  return rows.join('');
}
function guide() {
  const g = (D.cfg && D.cfg.guide) || {}, emoji = g.emoji || '🦉';
  return { name: g.name || '嚮導', emoji, pic: pic('guide', emoji), ipic: ipic('guide', emoji), tone: g.tone || '朋友' };
}
function town(p) {
  let n = Math.floor(p / 2), out = '';
  TIERS.forEach(([ic, size]) => { out += ic.repeat(Math.floor(n / size)); n %= size; });
  return out || '🌱';
}
function daySeed() { return S.today.split('-').reduce((a, x) => a * 31 + Number(x), 7); }

function guideLine() {
  const g = guide(), t = g.tone, seed = daySeed();
  const lines = {
    朋友: ['今天想從哪一格開始都可以喔。', '慢慢來，蓋一棟也是蓋。', '我在碼頭等你，有空來聊聊。'],
    學姊: ['累了就先休息，島不會跑掉的。', '你上週其實做得比你以為的多喔。', '今天挑一個最想做的就好。'],
    吐槽: ['又在想「我好爛」了吧？資料可不是這樣說的。', '先做再說，煩惱留給 Boss。', '島民們說你再不來他們要罷工了。'],
    中二: ['封印在歷屆試題裡的 Boss 正在甦醒…！', '今日的修行，開始吧！', '你的連擊數，就是你的力量。']
  };
  const arr = lines[t] || lines['朋友'];
  if (env.weather === 'rain' || env.weather === 'storm') return '外面在下雨，正好窩在家裡。' + arr[seed % arr.length];
  if (env.phase === 'night') return '晚上了，' + (env.hhmm >= '23' ? '記得早點睡喔。' : '今天辛苦了。') + arr[seed % arr.length];
  return arr[seed % arr.length];
}
function residentEvent() {
  const seed = daySeed();
  const s = SUBJECTS[seed % 5], r = resident(s);
  const evs = [
    r.name + ' 在廣場貼了一張紙條：「今天要不要來找我一下？」',
    r.name + ' 說昨晚夢到你一次 Full Combo。',
    r.name + ' 正在整理' + SUBJECT_NAME[s] + '街的招牌，看起來心情不錯。',
    r.name + ' 想考你一題，答不出來也沒關係，他會請你喝飲料。'
  ];
  return { r, text: evs[(seed >> 3) % evs.length] };
}

/* --- 島民的每日訊息、嚮導的昨日新聞（每天第一次打開時由 AI 寫好，存在 daily:日期） --- */
let dailyState = 'idle';   // idle、loading、failed
// 她多久沒碰這一科：看 App 的每日紀錄，沒有就看試算表最後一次有顏色的那週
function daysAway(s) {
  let last = null;
  Object.keys(S.save).filter(k => k.startsWith('log:')).forEach(k => {
    const d = k.slice(4), rows = (S.save[k] && S.save[k].rows) || {};
    if (Object.keys(rows).some(r => D.itemsByRow[r] && (GROUP[D.itemsByRow[r].subject] || D.itemsByRow[r].subject) === s) && (!last || d > last)) last = d;
  });
  if (!last) S.weeks.forEach((w, i) => {
    if (w.start > S.today) return;
    if (S.items.some(it => (GROUP[it.subject] || it.subject) === s && (S.grid[it.row] || [])[i] >= 1)) last = w.end < S.today ? w.end : S.today;
  });
  return last ? Math.round((parseD(S.today) - parseD(last)) / 86400000) : null;
}
function dailyCtx() {
  const g = guide();
  return {
    residents: SUBJECTS.map(s => { const r = resident(s);
      return { key: s, name: r.name, personality: r.personality, relation: r.relation, subject: SUBJECT_NAME[s], daysAway: daysAway(s), grade: D.grades[s] ? D.grades[s].level : null }; }),
    guide: { name: g.name, tone: TONES[g.tone] || g.tone },
    weather: '現在 ' + env.hhmm + (env.temp != null ? '，' + WEATHER_NAME[env.weather] + ' ' + env.temp + '°C' : '') + '；今天的節氣是' + solarTerm(S.today) + '（' + TERM_NOTE[solarTerm(S.today)] + '）'
  };
}
async function ensureDaily() {
  if (!D.cfg || S.save['daily:' + S.today] || dailyState !== 'idle') return;
  dailyState = 'loading';
  try {
    const st = await call('getDaily', S.today, dailyCtx());
    S.save['daily:' + S.today] = st.save['daily:' + S.today];   // 只拿每日訊息，不蓋掉畫面上還沒存的改動
    dailyState = 'idle';
  } catch (e) { dailyState = 'failed'; }

}

function xqCard() {
  const all = extraQuests(), open = all.find(q => !q.done), last = all[all.length - 1];
  const today = todayChallenges(), left = Math.max(0, XQ_DAILY - today.length);
  const earned = today.filter(q => q.done).reduce((a, q) => a + (q.coins || 0), 0);
  const tag = q => q.tier ? XQ_TIERS[q.tier].ic + ' ' + XQ_TIERS[q.tier].name : '🪙 加碼';
  const show = q => {
    const who = laneWho(q.lane), story = esc(q.story || '').replace(/\{who\}/g, `<b>${esc(who.name)}</b>`);
    return `<div class="row" style="flex-wrap:nowrap"><span class="avatar">${who.pic}</span><div class="grow"><b>⚔️ 挑戰任務・${esc(laneLabel(q.lane))}・${tag(q)}</b>
        <div class="speech" style="margin-top:6px">${story || esc(who.name) + '想請你幫忙解一題。'}</div></div></div>
      ${q.img ? `<div class="exq">${q.ctx ? `<img src="exam/${esc(q.ctx)}" alt="題組文章">` : ''}<img src="exam/${esc(q.img)}" alt="題目"></div>
        <div class="muted" style="font-size:12px;margin-bottom:6px">📜 ${q.year} 年會考第 ${q.qn} 題・試題來源：心測中心 國中教育會考歷屆試題</div>`
      : `<div style="margin:12px 0 8px;font-weight:700;white-space:pre-wrap">${esc(q.q)}</div>`}`;
  };
  let html = '';
  if (open) {
    const t = XQ_TIERS[open.tier];
    html = show(open) + `<div class="opts${open.img ? ' abcd' : ''}">${open.o.map((o, i) => `<button class="opt" onclick="answerXq('${open.id}',${i})">${esc(o)}</button>`).join('')}</div>
      <div class="muted" style="margin-top:6px">${t ? `答對 🪙 +${t.coins}、+${t.xp} 經驗值` : '答對 +10 經驗值'}；答錯 +${XQ_WRONG} 經驗值，會看到正確答案。</div>`;
  } else {
    if (last && last.done && last.at === S.today) html = show(last) + `<div class="opts${last.img ? ' abcd' : ''}">${last.o.map((o, i) => `<button class="opt ${i === last.a ? 'right' : i === last.choice ? 'wrong' : ''}" disabled>${esc(o)}</button>`).join('')}</div>
      <div class="speech" style="margin-top:10px">${last.correct ? '⭕ 答對了！' : '❌ 這次沒答對。'}${esc(last.ex)}</div>
      <div class="muted" style="margin:6px 0 12px">${last.coins ? '🪙 +' + last.coins + '、' : ''}+${last.xp} 經驗值</div>`;
    const opts = `<option value="">🎲 隨便一條</option>` + QLANES.map(l => `<option value="${l}"${l === xqLanePick ? ' selected' : ''}>${esc(laneLabel(l))}</option>`).join('');
    html += `<div class="row"><b class="grow">⚔️ 挑戰任務</b><span class="muted">今天還有 ${left}／${XQ_DAILY} 題${earned ? '・已賺 🪙 ' + earned : ''}</span></div>
      ${left ? `<select id="xqLane" style="width:100%;margin-top:8px" onchange="xqLanePick=this.value">${opts}</select>
      <div class="tiers">${Object.keys(XQ_TIERS).map(k => { const t = XQ_TIERS[k];
        return `<button onclick="challengeXq('${k}')" ${xqBusy ? 'disabled' : ''}>${t.ic} ${t.name}<small>答對 🪙 +${t.coins}</small></button>`; }).join('')}</div>
      <div class="muted" style="margin-top:6px">${xqBusy ? '✍️ 島民出題中…' : '題目來自會考考古題。基礎：七成以上的考生答對；中級：四到七成；進階：不到四成。難度越高，島幣越多。'}</div>`
      : '<div class="muted" style="margin-top:6px">今天的挑戰都完成了，明天島民還會再來找你 🌙</div>'}`;
  }
  return `<div class="card" id="xqCard">${html}</div>`;
}
async function challengeXq(tier) {
  if (xqBusy || todayChallenges().length >= XQ_DAILY) return;
  const sel = document.getElementById('xqLane'), chosen = sel && sel.value;
  xqBusy = true; softRender();
  try {
    await flush();
    const item = await pickBank(tier, chosen);   // 先從考古題挑，挑不到（題庫用完或沒有題庫）才請 AI 出
    if (item) S = await call('challengeBank', item);
    else {
      const lane = chosen || pickQuest(S.today, 50 + extraQuests().length).lane;
      const who = laneWho(lane), r = resident(GROUP[lane] || lane);
      S = await call('challengeQuest', lane, { name: who.name, personality: r.personality }, tier);
    }
    D = derive(S);
  } catch (e) { toast('出題失敗：' + (e.message || e)); }
  xqBusy = false; softRender();
  const el = document.getElementById('xqCard'); if (el) el.scrollIntoView({ block: 'start' });
}
async function answerXq(id, i) {
  document.querySelectorAll('#xqCard .opt').forEach(b => b.disabled = true);
  try {
    S = await call('answerQuest', id, i); D = derive(S);
    const q = S.save[id]; toast(q.correct ? '答對了！' + (q.coins ? '🪙 +' + q.coins + '、' : '') + '+' + q.xp + ' 經驗值 🎉' : '+' + q.xp + ' 經驗值，看看解說吧');
  } catch (e) { toast('送出失敗：' + (e.message || e)); }
  softRender();
}

function seeded(n) { let x = n >>> 0; return () => (x = (x * 1664525 + 1013904223) >>> 0) / 4294967296; }

// 依日期和換題次數抽一條巷子：比較少讀的巷子、最近沒出過題的巷子比較容易被抽到
function pickQuest(date, rerolls, avoid) {
  const vals = QLANES.map(l => D.ptsBy[l] || 0).sort((a, b) => a - b), median = vals[Math.floor(vals.length / 2)];
  const recent = questHistory().filter(q => q.at >= addD(date, -3)).map(q => q.lane);
  const cands = QLANES.filter(l => l !== avoid).map(l => {
    let w = 1;
    if ((D.ptsBy[l] || 0) < median) w *= 2.5;
    if (recent.includes(l)) w *= 0.3;
    return { l, w };
  });
  const total = cands.reduce((a, c) => a + c.w, 0);
  const r = seeded(date.split('-').reduce((a, x) => a * 37 + Number(x), 11) + rerolls * 7919);
  r(); let t = r() * total, lane = cands[cands.length - 1].l;

  const right = questHistory().filter(q => q.lane === lane && q.correct).map(q => q.qid);
  const bank = QUESTS[lane];

}

function weekData(wk) {
  const plan = planOf(wk), planned = {}, done = {}, add = (o, r, v) => o[r] = (o[r] || 0) + v;
  plan.days.forEach(d => d.forEach(r => add(planned, r, 1)));
  plan.tray.forEach(r => add(planned, r, 1));
  const settled = S.save['settled:' + wk];
  let daily = false;
  if (settled && settled.counts) {
    daily = true;
    Object.keys(settled.counts).forEach(r => done[r] = Number(settled.counts[r]));
  } else {
    for (let i = 0; i < 7; i++) { const lg = logOf(addD(wk, i)); Object.keys(lg).forEach(r => { daily = true; add(done, r, lg[r] === 2 ? 1 : 0.5); }); }
  }
  if (!daily) {
    const gi = S.weeks.findIndex(w => w.start === wk);
    if (gi >= 0) S.items.forEach(it => { const s = (S.grid[it.row] || [])[gi]; if (s === 2) done[it.row] = 1; else if (s === 1) done[it.row] = 0.5; });
  }
  let total = 0, got = 0;
  Object.keys(planned).forEach(r => { total += planned[r]; got += Math.min(done[r] || 0, planned[r]); });
  return { plan, planned, done, daily, settled, total, got };

/* --- 同步：改動先顯示在畫面上，稍後在背景寫回試算表 --- */
const pending = {};
let syncTimer = null, syncChain = Promise.resolve();
function queueSave(key, fn, ...args) {
  pending[key] = { fn, args };
  setSync('同步中…');
  clearTimeout(syncTimer); syncTimer = setTimeout(() => flush().catch(() => {}), 1200);
}
// 一次只送一批，送完才送下一批；回傳的 Promise 在這一批寫好後才完成
function flush() { clearTimeout(syncTimer); syncChain = syncChain.then(doFlush, doFlush); return syncChain; }
async function doFlush() {
  const jobs = Object.entries(pending);
  if (!jobs.length) return;
  jobs.forEach(([k]) => delete pending[k]);
  try {
    let st = null;
    for (const [, j] of jobs) st = await call(j.fn, ...j.args);
    const mine = S.save;
    S = st;
    Object.keys(pending).forEach(k => S.save[k] = mine[k]);   // 送出後又改的部分，以畫面上的為準
    D = derive(S);
    setSync(Object.keys(pending).length ? '同步中…' : '✓ 已存到試算表');
    softRender();
  } catch (e) {
    jobs.forEach(([k, j]) => { if (!pending[k]) pending[k] = j; });
    setSync('⚠️ 還沒存到，稍後重試');
    clearTimeout(syncTimer); syncTimer = setTimeout(() => flush().catch(() => {}), 8000);
    throw e;
  }
}
function setSync(t) { syncState = t; document.querySelectorAll('.syncState').forEach(el => el.textContent = t); }
let syncState = '';
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') flush().catch(() => {}); });

  } else if (tab === 'plan') render();
}

function bindPicker() {

/* --- 拍照讀手寫計畫 --- */
function shrinkPhoto(file) {
  return new Promise((ok, bad) => {
    const img = new Image();
    img.onload = () => {
      const k = Math.min(1, 2000 / Math.max(img.width, img.height));
      const cv = document.createElement('canvas'); cv.width = Math.round(img.width * k); cv.height = Math.round(img.height * k);
      const g = cv.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, cv.width, cv.height); g.drawImage(img, 0, 0, cv.width, cv.height);
      ok(cv.toDataURL('image/jpeg', 0.85));
    };
    img.onerror = () => bad(new Error('讀不到這張照片'));
    img.src = URL.createObjectURL(file);
  });
}
// 她的寫法字典：縮寫 → 項目，以及跟讀書無關的行程。拍照辨識時會先參考這本字典
// 第一次拍照前，先放進從她計畫本看到的固定寫法（找不到的項目會略過）
const DEFAULT_ABBR = {
  map: { '理複': '理化・複講-1回', '歷圖': '歷史・圖表集', '地主': '地理・主題式全攻略', '英藍': '英・藍文法', '英dragon': '英・龍-文法',
         '國3688': '國・3688', '英3688': '英・3688', '社3688': '社會・模卷／３６８８', '自3688': '自然・3688-1回', '數3688': '數・3688-1單元',
         'Wei M': '數・wei', 'Wei S': '理化・wei', 'online': '國・online-2單元', '地科': '地科・講義', 'S英': '英・空英',
         '國三': { mode: 'all', names: ['國・online-2單元', '國・閱策', '國・成語'] },
         'Wei H': { mode: 'pick', names: ['數・wei', '理化・wei'] } },
  ignore: ['violin']
};
// 字典的一筆統一成 { rows, mode }：mode 'all' 是全部都要做，'pick' 是其中一項、之後才知道
function abbrEntry(v) { return typeof v === 'object' && v ? { rows: (v.rows || []).slice(), mode: v.mode || 'all' } : { rows: [Number(v)], mode: 'all' }; }
function abbrName(v) {
  const e = abbrEntry(v), names = e.rows.map(r => D.itemsByRow[r]).map(it => it ? it.subject + '・' + it.name : '（找不到）');
  return names.join(e.mode === 'pick' ? ' 或 ' : ' ＋ ') + (e.mode === 'pick' && names.length > 1 ? '（上課後再選）' : '');
}
function abbrOf() {
  if (S.save.abbr) return JSON.parse(JSON.stringify({ map: S.save.abbr.map || {}, ignore: S.save.abbr.ignore || [] }));
  const find = n => { const [sub, name] = n.split('・'), it = S.items.find(i => i.subject === sub && i.name === name); return it && it.row; };
  const map = {};
  Object.keys(DEFAULT_ABBR.map).forEach(k => {
    const v = DEFAULT_ABBR.map[k];
    if (typeof v === 'string') { const r = find(v); if (r) map[k] = r; }
    else { const rows = v.names.map(find).filter(Boolean); if (rows.length) map[k] = rows.length > 1 ? { rows, mode: v.mode } : rows[0]; }
  });
  return { map, ignore: DEFAULT_ABBR.ignore.slice() };
}
// 第一次用 v2：國文加上「成語」這一項，再存好預設的寫法字典
let seeding = false;
async function seedDefaults() {
  if (S && S.save.abbr) migrateAbbr();
  if (seeding || !S || S.save.abbr || !D.cfg) return;
  seeding = true;
  try {
    await flush();
    if (S.items.some(i => i.subject === '國') && !S.items.some(i => i.subject === '國' && i.name === '成語')) { S = await call('addItem', '國', '成語'); D = derive(S); }
    S = await call('saveAbbr', abbrOf()); D = derive(S);
    if (tab === 'home') softRender(); else if (tab === 'abbr' || tab === 'items' || tab === 'plan') render();
  } catch (e) { /* 下次打開再試 */ } finally { seeding = false; }
}
function migrateAbbr() {
  const a = S.save.abbr;
  if (a && (a.ignore || []).includes('運動')) setAbbr(Object.assign({}, a, { ignore: a.ignore.filter(x => x !== '運動') }));
}
function setAbbr(a) { S.save.abbr = a; queueSave('abbr', 'saveAbbr', a); }
function itemSelect(id) {
  let html = `<select id="${id}"><option value="">選一個項目…</option>`, last = '';
  S.items.forEach(it => {
    if (it.subject !== last) { html += (last ? '</optgroup>' : '') + `<optgroup label="${esc(it.subject)}">`; last = it.subject; }
    html += `<option value="${it.row}">${esc(it.subject)}・${esc(it.name)}</option>`;
  });
  return html + '</optgroup></select>';
}

function scanDrop(i, x) {
  const r = draft.scan;
  const keep = y => String(y) !== String(x);
  if (i < 0) r.tray = r.tray.filter(keep);
  else { r.days[i] = r.days[i].filter(keep); r.done[i] = r.done[i].filter(keep); }
  render();
}
// 教島民一個新寫法：記進字典，並把這一項排進那天
function scanTeach(k) {
  const r = draft.scan, u = r.unknown[k], row = Number(document.getElementById('unk' + k).value);
  if (!row) return toast('先選它是哪一項');
  const a = abbrOf(); a.map[u.text] = row; setAbbr(a);
  if (u.day >= 0) { if (!r.days[u.day].includes(row)) r.days[u.day].push(row); if (u.done && !r.done[u.day].includes(row)) r.done[u.day].push(row); }
  else if (!r.tray.includes(row)) r.tray.push(row);
  r.unknown.splice(k, 1);
  toast('記住了！下次看到「' + u.text + '」就知道'); render();
}
function scanIgnore(k) {
  const r = draft.scan, u = r.unknown[k], a = abbrOf();
  if (!a.ignore.includes(u.text)) a.ignore.push(u.text);
  setAbbr(a); r.unknown.splice(k, 1);
  toast('好，以後看到「' + u.text + '」就略過'); render();
}
function applyScan(merge) {
  const r = draft.scan, wk = draft.week, cur = planOf(wk);
  const uniq = a => [...new Set(a)];
  const plan = merge ? { days: cur.days.map((d, i) => uniq(d.concat(r.days[i]))), tray: uniq(cur.tray.concat(r.tray)) } : { days: r.days.map(uniq), tray: uniq(r.tray) };
  setPlan(wk, plan);
  // 照片上打勾（或劃掉）的項目，今天以前的日子直接記成完成
  let logged = 0;
  DAYS.forEach((_, i) => {
    const date = addD(wk, i); if (date > S.today) return;
    const rows = (draft.markDone ? r.done[i] : []).filter(x => !isPending(x) && r.days[i].includes(x));
    if (!rows.length) return;
    const lg = Object.assign({}, logOf(date)); rows.forEach(x => { lg[x] = 2; logged++; });
    S.save['log:' + date] = { rows: lg }; queueSave('log:' + date, 'logDay', date, lg);
  });
  // 計畫本上「運動」有打勾的日子，自動蓋運動章
  let stamped = 0;
  (r.exercise || []).forEach((v, i) => {
    const date = addD(wk, i); if (v !== 'done' || date > S.today || S.save['ex:' + date]) return;
    S.save['ex:' + date] = { at: S.today, src: 'scan' }; queueSave('ex:' + date, 'saveExercise', date, true, 'scan'); stamped++;
  });
  D = derive(S); flush().catch(() => {});
  planWeek = wk; planDay = null; draft = {}; tab = 'plan';
  toast((logged ? '計畫排好了，也記下 ' + logged + ' 個打勾的項目！' : '計畫排好了！') + (stamped ? '運動章蓋了 ' + stamped + ' 個 🏃' : '')); render(); window.scrollTo(0, 0);
}

      ${pick.length ? `<div style="margin-top:6px">${pick.map((r, k) => `<span class="pill">${esc(D.itemsByRow[r].subject + '・' + D.itemsByRow[r].name)}<button class="x" style="padding:0 0 0 6px;color:inherit" onclick="draft.abRows.splice(${k},1);abbrKeep();render()">✕</button></span>`).join('')}</div>` : ''}
      ${pick.length > 1 ? `<label>這幾項是</label><select id="abM"><option value="all" ${draft.abM !== 'pick' ? 'selected' : ''}>全部都要做（例如「國三」＝online、閱策、成語）</option><option value="pick" ${draft.abM === 'pick' ? 'selected' : ''}>其中一項，上課後才知道（例如「Wei H」）</option></select>` : ''}
      <div style="margin-top:8px"><button onclick="abbrAdd()">存進字典</button></div></div>
    <div class="card"><h3>跟讀書無關的行程</h3><div class="muted">看到這些寫法就略過，例如才藝課、運動。</div>
      <div style="margin-top:6px">${a.ignore.map(x => `<span class="pill">${esc(x)}<button class="x" style="padding:0 0 0 6px;color:inherit" onclick="abbrDel('ignore', ${esc(JSON.stringify(x))})" aria-label="刪除">✕</button></span>`).join('') || '<span class="muted">還沒有。</span>'}</div>
      <div class="row" style="margin-top:8px"><input id="abI" class="grow" placeholder="例如：violin"><button class="ghost" onclick="abbrIgnore()">加入</button></div></div>
    <div class="row"><span class="muted syncState grow">${syncState}</span><button class="ghost" onclick="go('items')">📝 任務清單</button><button class="ghost" onclick="go('more')">返回</button></div>`;
}
function abbrKeep() {
  const k = document.getElementById('abK'), m = document.getElementById('abM');
  if (k) draft.abK = k.value; if (m) draft.abM = m.value;
}
function abbrPush() {
  const r = Number(document.getElementById('abR').value); if (!r) return toast('先選一個項目');
  abbrKeep(); draft.abRows = draft.abRows || [];
  if (!draft.abRows.includes(r)) draft.abRows.push(r);
  render();
}
function abbrAdd() {
  abbrKeep();
  const k = (draft.abK || '').trim(), rows = (draft.abRows || []).slice(), cur = Number(document.getElementById('abR').value);
  if (cur && !rows.includes(cur)) rows.push(cur);
  if (!k || !rows.length) return toast('寫法和項目都要填');
  const a = abbrOf();
  a.map[k] = rows.length === 1 ? rows[0] : { rows, mode: draft.abM === 'pick' ? 'pick' : 'all' };
  setAbbr(a); draft = {}; toast('記住「' + k + '」了'); render();
}
function abbrIgnore() {
  const x = document.getElementById('abI').value.trim(); if (!x) return;
  const a = abbrOf(); if (!a.ignore.includes(x)) a.ignore.push(x); abbrKeep(); setAbbr(a); render();
}
function abbrDel(kind, k) {
  const a = abbrOf();
  if (kind === 'map') delete a.map[k]; else a.ignore = a.ignore.filter(x => x !== k);
  abbrKeep(); setAbbr(a); render();
}

/* --- 週日確認：帶入每天的紀錄，補上漏記的，再寫回週檢討 --- */
function openConfirm(wk) {
  const wd = weekData(wk);
  draft = { week: wk, counts: Object.assign({}, wd.done), showAll: !wd.total && !Object.keys(wd.done).length };
  tab = 'confirm'; render(); window.scrollTo(0, 0);
}
function viewConfirm() {
  const wk = draft.week, wd = weekData(wk), c = draft.counts;
  const rows = draft.showAll ? S.items.map(i => i.row)
    : [...new Set(Object.keys(wd.planned).concat(Object.keys(c)).map(Number))].filter(r => D.itemsByRow[r]).sort((a, b) => a - b);
  const fmt = v => String(v).replace('.5', '½').replace(/^0½$/, '½');
  let total = 0, got = 0; Object.keys(wd.planned).forEach(r => { total += wd.planned[r]; got += Math.min(c[r] || 0, wd.planned[r]); });
  const pct = total ? Math.round(got / total * 100) : 0;
  return `<div class="card"><h2>✅ 確認 ${short(wk)}–${short(addD(wk, 6))}</h2>
      <div class="muted">每一項做了幾次，已經從每天的紀錄帶進來了。漏記的用 ＋／－ 補上，做了一半就按「½」。${wd.settled ? '<br>這週確認過了，再送出會覆蓋。' : ''}</div>
      ${total ? `<div class="row" style="margin-top:10px"><div class="bar grow" style="margin-top:0"><i id="cfBar" style="width:${pct}%"></i></div><b id="cfPct">${pct}%</b></div>` : ''}
      <div style="margin-top:8px"><button class="ghost" onclick="draft.showAll=!draft.showAll;draft.note=document.getElementById('note').value;render()">${draft.showAll ? '只看這週的計畫和紀錄' : '顯示全部項目'}</button></div></div>
    ${(() => { const p = wd.plan, blocks = p.days.map((d, i) => [i, d]).concat([[7, p.tray]]).filter(([, d]) => d.some(isPending));
      return blocks.length ? `<div class="card"><h3>❓ 還沒決定是哪一項</h3>${blocks.map(([i, d]) => `<div class="subj">${i === 7 ? '沒排天' : '週' + DAYS[i]}</div>` + pendingList(d, wk, i, false)).join('')}</div>` : ''; })()}
    <div class="card">${rows.length ? itemList(rows, r => `<div class="step" data-row="${r}"><button data-d="-1">－</button><b>${fmt(c[r] || 0)}</b><span class="muted">/${wd.planned[r] || '－'}</span><button data-d="1">＋</button><button data-d="half" class="ghost">½</button></div>`) : '<div class="muted">這週沒有計畫也沒有紀錄。按「顯示全部項目」補記，或直接確認，當作休息週。</div>'}
      <label>這週一句話（只會存在島上）</label><textarea id="note" placeholder="例如：數學卡在二次函數，但歷史影片看完了">${esc(draft.note != null ? draft.note : (wd.settled && wd.settled.note) || '')}</textarea>
      <div class="row" style="margin-top:12px"><button id="doConfirm" class="grow">確認這週 ✨</button><button class="ghost" onclick="draft={};tab='plan';render()">返回</button></div></div>
    ${viewLinkForm()}`;
}
function bindConfirm() {
  const $ = id => document.getElementById(id), c = draft.counts;
  document.querySelectorAll('.step').forEach(st => st.onclick = e => {
    const b = e.target.closest('button'); if (!b) return;
    const r = Number(st.dataset.row), v = c[r] || 0;
    let n = b.dataset.d === 'half' ? (v % 1 ? v - 0.5 : v + 0.5) : Math.max(0, v + Number(b.dataset.d));
    n = Math.min(n, 14);
    if (n > 0) c[r] = n; else delete c[r];
    draft.note = $('note').value; render();
  });
  $('doConfirm').onclick = async () => {
    $('doConfirm').disabled = true; $('doConfirm').textContent = '寫回試算表中…';
    const wk = draft.week, before = D.xp;
    try {
      await flush();
      S = await call('confirmWeek', wk, c, $('note').value);
      D = derive(S);
      const wd = weekData(wk), g = guide(), units = Object.values(wd.done).reduce((a, b) => a + b, 0);
      const pc = wd.total ? Math.round(wd.got / wd.total * 100) : null;
      const rateLine = pc != null ? `<div style="text-align:center;margin:8px 0"><div style="font-size:34px;font-weight:800;color:var(--plum)">${pc}%</div>
        <div class="muted">計畫完成 ${wd.got}／${wd.total} 次${pc >= 100 ? '・FULL COMBO 🎵' : pc >= 80 ? '・GREAT' : pc >= 50 ? '・CLEAR' : ''}</div></div>` : '';
      draft = { after: `<div class="card"><div class="big">🎉</div><h2 style="text-align:center">這週確認完成！+${D.xp - before} 經驗值</h2>${rateLine}
        <div style="text-align:center">這週一共做了 ${units} 次。${g.ipic} ${esc(g.name)}：「${units > 0 ? '這些都是真的蓋起來的房子喔。' : '這週休息也沒關係，島還在。'}」</div>
        <div class="muted" style="text-align:center;margin-top:8px">接著排下週的計畫吧：拍手寫計畫，或點日子自己加。</div></div>` };
      planWeek = addD(wk, 7); planDay = 0; tab = 'plan'; render(); window.scrollTo(0, 0);
    } catch (e) { toast('寫入失敗：' + (e.message || e)); $('doConfirm').disabled = false; $('doConfirm').textContent = '確認這週 ✨'; }
  };
  $('addLink').onclick = async () => {
    const a = $('la').value, b = $('lb').value, n = $('ln').value.trim();
    if (a === b) return toast('選兩個不同的科目喔');
    if (!n) return toast('寫一句話說明它們怎麼連在一起');
    draft.note = $('note').value;
    S = await call('saveLink', { a, b, note: n }); D = derive(S);
    toast(resident(a).name + ' 和 ' + resident(b).name + ' 的好感度上升了！'); render();
  };
}

function itemList(rows, right) {
  let html = '', last = '';
  rows.forEach(r => {
    const it = D.itemsByRow[r]; if (!it) return;
    if (it.subject !== last) { html += `<div class="subj">${esc(it.subject)}</div>`; last = it.subject; }
    html += `<div class="item"><div class="name">${esc(it.name)}${isBoss(it.name) ? '<span class="tag">Boss</span>' : ''}</div>${right(r)}</div>`;
  });
  return html;
}

async function submitExam() {
  const levels = {}; document.querySelectorAll('[data-sub]').forEach(x => levels[x.dataset.sub] = x.value);

/* --- 自訂圖片：裁成正方形並縮小，才能存進試算表的一格 --- */
function shrinkImage(file) {
  return new Promise((ok, bad) => {
    const img = new Image();
    img.onload = () => {
      const tryEncode = (size, type, q) => {
        const cv = document.createElement('canvas'); cv.width = cv.height = size;
        const ctx = cv.getContext('2d');
        if (type === 'image/jpeg') { ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, size, size); }
        const m = Math.min(img.width, img.height);
        ctx.drawImage(img, (img.width - m) / 2, (img.height - m) / 2, m, m, 0, 0, size, size);
        return cv.toDataURL(type, q);
      };
      const tries = [[160, 'image/webp', .85], [160, 'image/png'], [128, 'image/webp', .7], [128, 'image/jpeg', .8], [96, 'image/jpeg', .7]];
      for (const t of tries) {
        const url = tryEncode(...t);
        if (url.startsWith('data:' + t[1]) && url.length < 45000) return ok(url);
      }
      bad(new Error('圖片太複雜了，換一張試試'));
    };
    img.onerror = () => bad(new Error('讀不到這張圖片'));
    img.src = URL.createObjectURL(file);
  });
}

/* --- 開島設定 --- */
function viewSetup() {
  if (!draft.cfg) draft.cfg = JSON.parse(JSON.stringify(D.cfg || { islandName: '', guide: { name: '', emoji: '🦉', tone: '朋友' }, residents: {}, shop: [{ name: '', price: 10 }] }));
  const c = draft.cfg; SUBJECTS.forEach(s => c.residents[s] = c.residents[s] || { name: '', emoji: '', personality: '', relation: '' });
  c.roommates = c.roommates || {};
  Object.values(SUBS).flat().forEach(sub => c.roommates[sub] = c.roommates[sub] || { name: '', emoji: '' });
  const upl = key => { const src = imgOf(key);
    return `<div class="row upl" data-img="${key}">${src ? `<img class="pic" src="${src}" alt="">` : ''}
      <label class="btn">${src ? '換一張圖片' : '或上傳自己的圖片'}<input type="file" accept="image/*" hidden></label>
      ${src ? '<button type="button" class="ghost" data-del>改回 emoji</button>' : ''}</div>`; };
  const pick = (key, cur) => `<div class="emojis" data-key="${key}">${EMOJIS.map(e => `<button type="button" class="${e === cur ? 'on' : ''}">${e}</button>`).join('')}</div>`;
  return `<div class="card"><div class="big">🏝️</div><h2 style="text-align:center">${D.cfg ? '修改島嶼設定' : '歡迎來到你的島'}</h2>
    <div class="muted" style="text-align:center">這座島會跟著你一路到會考。島上的一切都由你決定。</div>
    ${D.cfg ? '' : `<div class="muted" style="text-align:center;margin-top:6px">你過去 ${D.recordedWeeks} 週的週檢討已經變成島上的房子了 🏠</div>`}</div>
  <div class="card"><h3>1. 島的名字</h3><input data-f="islandName" value="${esc(c.islandName)}" placeholder="例如：呱呱島"></div>
  <div class="card"><h3>2. 你的嚮導夥伴</h3><div class="muted">每天在島上跟你說話的角色。</div>
    <label>名字</label><input data-f="guide.name" value="${esc(c.guide.name)}">
    <label>長相</label>${pick('guide.emoji', c.guide.emoji)}${upl('guide')}
    <label>說話風格</label><select data-f="guide.tone">${Object.entries(TONES).map(([k, v]) => `<option value="${k}" ${c.guide.tone === k ? 'selected' : ''}>${v}</option>`).join('')}</select></div>
  <div class="card"><h3>3. 五位島民</h3><div class="muted">每一科住著一位島民。你讀那一科，就是在培養他。</div>
    ${SUBJECTS.map(s => { const r = c.residents[s]; return `<div style="border-top:1px dashed var(--plum-light);margin-top:12px;padding-top:8px">
      <b>${SUBJECT_NAME[s]}街</b>
      <label>名字</label><input data-f="residents.${s}.name" value="${esc(r.name)}">
      <label>長相</label>${pick('residents.' + s + '.emoji', r.emoji)}${upl(s)}
      <label>個性</label><input data-f="residents.${s}.personality" value="${esc(r.personality)}" placeholder="例如：嘴硬心軟">
      <label>和其他島民的關係</label><input data-f="residents.${s}.relation" value="${esc(r.relation)}" placeholder="例如：跟數學是青梅竹馬">
      ${SUBS[s] ? `<label>室友（選填）：島民是${SUBJECT_NAME[s]}街的街長；${SUBS[s].join('、')}各有一條小巷，可以各住一位室友當巷長。不填就顯示科目名稱。</label>
        ${SUBS[s].map(sub => `<div class="row" style="margin-top:4px"><span style="width:40px">${sub}</span>
          <select style="width:72px" data-f="roommates.${sub}.emoji"><option value="">－</option>${EMOJIS.map(e => `<option ${c.roommates[sub].emoji === e ? 'selected' : ''}>${e}</option>`).join('')}</select>
          <input class="grow" data-f="roommates.${sub}.name" value="${esc(c.roommates[sub].name)}" placeholder="名字"></div>${upl('sub:' + sub)}`).join('')}` : ''}</div>`; }).join('')}</div>
  <div class="card"><h3>4. 島嶼商店</h3><div class="muted">你想用島幣換什麼？價格你自己訂，再跟爸媽討論。一般一週大約賺 10 到 15 枚。</div>
    <div id="shopRows">${c.shop.map((x, i) => `<div class="row" style="margin-top:6px"><input class="grow" data-f="shop.${i}.name" value="${esc(x.name)}" placeholder="例如：追劇一集"><input style="width:80px" type="number" min="1" data-f="shop.${i}.price" value="${x.price}"></div>`).join('')}</div>
    <div style="margin-top:8px"><button class="ghost" type="button" id="addShop">＋ 新增商品</button></div></div>
  <div class="row"><button id="saveCfg" class="grow">${D.cfg ? '儲存' : '開島！'}</button>${D.cfg ? `<button class="ghost" onclick="go('more')">取消</button>` : ''}</div>`;
}
function setPath(obj, path, val) {
  const k = path.split('.'); let o = obj;
  for (let i = 0; i < k.length - 1; i++) o = o[k[i]];
  o[k[k.length - 1]] = val;
}
function bindSetup() {
  const c = draft.cfg;
  document.querySelectorAll('[data-f]').forEach(el => el.oninput = el.onchange = () =>
    setPath(c, el.dataset.f, el.type === 'number' ? Number(el.value) : el.value));
  document.querySelectorAll('.emojis').forEach(box => box.onclick = e => {
    const b = e.target.closest('button'); if (!b) return;
    setPath(c, box.dataset.key, b.textContent);
    box.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b));
  });
  document.querySelectorAll('.upl').forEach(box => {
    const key = box.dataset.img;
    box.querySelector('input').onchange = async e => {
      const f = e.target.files[0]; if (!f) return;
      toast('圖片處理中…');
      try { S = await call('saveImage', key, await shrinkImage(f)); D = derive(S); toast('圖片換好了！'); render(); }
      catch (err) { toast('圖片上傳失敗：' + (err.message || err)); }
    };
    const del = box.querySelector('[data-del]');
    if (del) del.onclick = async () => { S = await call('saveImage', key, ''); D = derive(S); render(); };
  });
  document.getElementById('addShop').onclick = () => { c.shop.push({ name: '', price: 10 }); render(); };
  document.getElementById('saveCfg').onclick = async () => {
    if (!c.islandName.trim()) return toast('先幫島取個名字吧');
    c.shop = c.shop.filter(x => x.name.trim());
    document.getElementById('saveCfg').disabled = true;
    const first = !D.cfg;
    S = await call('saveConfig', c); D = derive(S);
    toast(first ? '🏝️ ' + c.islandName + ' 開島成功！' : '設定已儲存');
    if (first) local.set('islandSeenVersion', APP_VERSION);
    go(first ? 'guide' : 'home');
  };
}

/* --- 台北的即時時間與天氣（Open-Meteo，免金鑰）：讓小島跟著天色和天氣變化 --- */
const env = { phase: 'day', hhmm: '', weather: null, temp: null };
const WEATHER_URL = 'https://api.open-meteo.com/v1/forecast?latitude=25.03&longitude=121.56&current=temperature_2m,weather_code,is_day&timezone=Asia%2FTaipei';
const WEATHER_ICON = { clear: '☀️', cloudy: '⛅', fog: '🌫️', rain: '🌧️', storm: '⛈️' };
const WEATHER_NAME = { clear: '晴', cloudy: '多雲', fog: '起霧', rain: '下雨', storm: '雷雨' };
const PHASE_ICON = { dawn: '🌅', day: '🏝️', dusk: '🌇', night: '🌙' };
function taipeiClock() {
  const parts = new Intl.DateTimeFormat('en-GB', { timeZone: 'Asia/Taipei', hour: '2-digit', minute: '2-digit', hour12: false }).formatToParts(new Date());
  const h = Number(parts.find(p => p.type === 'hour').value) % 24, m = parts.find(p => p.type === 'minute').value;
  return { h, hhmm: String(h).padStart(2, '0') + ':' + m };
}
function phaseOf(h) { return h >= 19 || h < 5 ? 'night' : h < 7 ? 'dawn' : h < 17 ? 'day' : 'dusk'; }
function weatherKind(code) {
  if (code >= 95) return 'storm';
  if ((code >= 51 && code <= 67) || (code >= 80 && code <= 82) || (code >= 71 && code <= 77) || code === 85 || code === 86) return 'rain';
  if (code === 45 || code === 48) return 'fog';
  if (code >= 2) return 'cloudy';
  return 'clear';
}
// 二十四節氣（台灣常用的日期，前後差一天沒關係）：整座島的草地、樹葉和飄落物跟著變
const TERMS = [['小寒', 1, 6], ['大寒', 1, 20], ['立春', 2, 4], ['雨水', 2, 19], ['驚蟄', 3, 6], ['春分', 3, 21], ['清明', 4, 5], ['穀雨', 4, 20],
  ['立夏', 5, 6], ['小滿', 5, 21], ['芒種', 6, 6], ['夏至', 6, 21], ['小暑', 7, 7], ['大暑', 7, 23], ['立秋', 8, 8], ['處暑', 8, 23],
  ['白露', 9, 8], ['秋分', 9, 23], ['寒露', 10, 8], ['霜降', 10, 23], ['立冬', 11, 7], ['小雪', 11, 22], ['大雪', 12, 7], ['冬至', 12, 22]];
const TERM_NOTE = {
  立春: '春天開始了，樹梢冒出淡淡的粉紅', 雨水: '春雨來了，第一批櫻花開始飄', 驚蟄: '春雷叫醒了小蟲，櫻花正盛', 春分: '晝夜一樣長，滿島櫻花',
  清明: '櫻花吹雪的最後幾天', 穀雨: '雨水滋潤新綠，櫻花謝了', 立夏: '夏天開始，島上一片新綠', 小滿: '麥子漸漸飽滿，樹葉更深了',
  芒種: '梅雨季，晚上有螢火蟲', 夏至: '一年白天最長的一天，晚上螢火蟲最多', 小暑: '熱起來了，夜裡螢火蟲還在', 大暑: '一年最熱的時候，記得多喝水',
  立秋: '秋天開始，暑氣還沒退', 處暑: '暑氣慢慢退了，有幾片葉子轉黃', 白露: '早晚涼了，葉子開始變色', 秋分: '晝夜又一樣長，島上一半轉黃',
  寒露: '楓葉轉紅，開始飄落', 霜降: '楓紅最美的時候，滿地紅葉', 立冬: '冬天開始，最後一批楓葉', 小雪: '天氣涼了，樹葉安靜下來',
  大雪: '台灣不下雪，島上換上深綠的冬裝', 冬至: '一年夜晚最長，吃湯圓的日子', 小寒: '寒流來了，山茶花開', 大寒: '一年最冷的時候，早開的櫻花在等春天'
};
function solarTerm(date) {
  const d = parseD(date), m = d.getMonth() + 1, day = d.getDate();
  let t = '冬至'; TERMS.forEach(x => { if (m > x[1] || (m === x[1] && day >= x[2])) t = x[0]; });
  return t;
}
function termIcon(t) { const i = TERMS.findIndex(x => x[0] === t); return ['❄️', '❄️', '🌸', '🌸', '🌸', '🌸', '🌸', '🌱', '🌿', '🌿', '🌿', '🌿', '🌿', '🌿', '🌾', '🌾', '🌾', '🌾', '🍁', '🍁', '🍁', '🍂', '❄️', '❄️'][i] || '🌿'; }
function envText() {
  const ph = env.phase === 'night' && env.weather === 'clear' ? '🌙' : (env.weather ? WEATHER_ICON[env.weather] : PHASE_ICON[env.phase]);
  const t = S && S.today ? solarTerm(S.today) : '';
  return `${ph} 台北 ${env.hhmm}${env.temp != null ? '・' + WEATHER_NAME[env.weather] + ' ' + env.temp + '°C' : ''}${t ? '・' + termIcon(t) + t : ''}`;
}
function updateEnv() {
  const t = taipeiClock();
  env.hhmm = t.hhmm; env.phase = phaseOf(t.h);
  const chip = document.getElementById('envChip'); if (chip) chip.textContent = envText();
  if (window.Island3D && Island3D.setEnvironment) Island3D.setEnvironment({ phase: env.phase, weather: env.weather || 'clear' });
}
async function fetchWeather() {
  try {
    const j = await (await fetch(WEATHER_URL)).json();
    env.temp = Math.round(j.current.temperature_2m);
    env.weather = weatherKind(Number(j.current.weather_code));
  } catch (e) { /* 沒網路就只跟著時間變化 */ }
  updateEnv();
}
updateEnv(); fetchWeather();
setInterval(updateEnv, 60 * 1000);
setInterval(fetchWeather, 10 * 60 * 1000);

boot();
</script>
