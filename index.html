<style>

  * { box-sizing: border-box; }
  body { margin: 0; font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
         background: var(--sea); color: var(--ink); -webkit-tap-highlight-color: transparent; }

  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

  .upl button { font-size: 14px; padding: 6px 12px; }
  .emojis { display: flex; flex-wrap: wrap; gap: 4px; }

  .emojis button.on { border-color: var(--plum); background: var(--plum-light); }

  .loading { text-align: center; padding: 60px 0; color: var(--muted); }

  .chip i { display: block; font-style: normal; font-size: 10px; font-weight: 400; color: var(--plum); min-height: 12px; }
  .chip.today { box-shadow: inset 0 0 0 2px var(--gold); }
  .chip.on { background: var(--plum); color: #fff; } .chip.on small, .chip.on i { color: #fde; }
  button.x { background: none; color: var(--muted); padding: 4px 6px; }

  .purple-ic { display: inline-block; filter: hue-rotate(185deg) saturate(1.4); }   /* 紫色的烏龜 */
  .pill { display: inline-block; background: var(--plum-light); color: var(--plum); border-radius: 8px; padding: 2px 8px; margin: 2px 4px 2px 0; font-size: 13px; }
  .step { display: flex; align-items: center; gap: 4px; }
  .step button { padding: 4px 10px; } .step b { min-width: 26px; text-align: center; }

  .opt.wrong { background: #fbe0e0; border-color: #c0392b; color: #7a1f1f; opacity: 1; }
  .env { font-size: 13px; color: var(--muted); }
  /* 我的家 */
  .room { display: flex; flex-direction: column; justify-content: space-between; min-height: 230px; padding: 12px 8px; border-radius: 14px; border: 2px solid var(--plum-light); }
  .zone { display: flex; flex-wrap: wrap; justify-content: center; gap: 4px 10px; min-height: 70px; align-items: flex-end; }
  .slot { display: flex; flex-direction: column; align-items: center; justify-content: flex-end; min-width: 52px; }
  .slot .pic { width: 40px; height: 40px; }
  .slot span { font-size: 34px; line-height: 1.1; } .slot small { font-size: 10px; color: var(--muted); }
  .furn { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 6px; margin-top: 8px; }

  .board .bbody { background: var(--sand); border-radius: 14px; padding: 12px; margin: 0 0 10px; }
  .board .bbody .card { background: transparent; box-shadow: none; border: none !important; padding: 0; margin: 0; border-radius: 0; }

  .mailbtn { position: relative; padding: 4px 10px; }
  .mailbtn .dot { position: absolute; top: -5px; right: -5px; min-width: 18px; height: 18px; border-radius: 9px; background: #d9534f; color: #fff; font-size: 11px; line-height: 18px; text-align: center; padding: 0 4px; }
  .stamps { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin-top: 10px; }
  .stamp { aspect-ratio: 1; border: 2px dashed var(--plum-light); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: 13px; }
  .stamp.today { border-color: var(--plum); }
  .stamp.on { border: 2px solid #c0392b; background: #fff5f3; color: #c0392b; font-weight: 700; font-size: 18px; transform: rotate(-8deg); }
  .hanko { display: inline-flex; width: 30px; height: 30px; border: 2px solid #c0392b; border-radius: 50%; color: #c0392b; font-weight: 700; align-items: center; justify-content: center; transform: rotate(-8deg); }
  .greet { position: fixed; inset: 0; background: rgba(60, 20, 45, .35); display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 50; animation: fadeIn .3s; }
  .greet-card { background: #fff; border-radius: 24px; padding: 22px 18px; max-width: 380px; width: 100%; text-align: center; box-shadow: 0 10px 40px rgba(0,0,0,.2); animation: popIn .45s cubic-bezier(.2,1.4,.4,1); }
  .greet-pic { font-size: 64px; line-height: 1; } .greet-pic .pic { width: 84px; height: 84px; }
  @keyframes fadeIn { from { opacity: 0; } } @keyframes popIn { from { transform: scale(.7); opacity: 0; } }
  .exq img { display: block; width: 100%; height: auto; background: #fff; border: 1px solid var(--plum-light); border-radius: 10px; margin: 10px 0 6px; }
  .opts.abcd { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; } .opts.abcd .opt { text-align: center; font-weight: 700; }
  .tiers { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 8px; }

  .furn button.on { border-color: var(--plum); background: var(--plum-light); } .furn button.has { background: var(--sand); }
</style>

(function () {
  const SKIP = { OPTION: 1, TEXTAREA: 1, SCRIPT: 1, STYLE: 1, TITLE: 1 };
  function wrap(root) {
    if (!root) return;
    if (root.nodeType === 3) { if (root.data.indexOf('🐢') >= 0) one(root); return; }
    if (root.nodeType !== 1 || SKIP[root.tagName]) return;
    const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT), list = [];
    while (w.nextNode()) if (w.currentNode.data.indexOf('🐢') >= 0) list.push(w.currentNode);
    list.forEach(one);

    const f = document.createDocumentFragment();
    t.data.split('🐢').forEach((x, i) => { if (i) { const s = document.createElement('span'); s.className = 'purple-ic'; s.textContent = '🐢'; f.appendChild(s); } if (x) f.appendChild(document.createTextNode(x)); });
    par.replaceChild(f, t);
  }

// 3D 小島只在網頁 App 版提供（需要同資料夾的 three.js）；Apps Script 版沒有 config.js，維持清單畫面
const BETA3D = !!window.ISLAND_API_URL;
const local = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} }
};

/* ===== 後端呼叫（透過 Apps Script API 同步到 Google 試算表） ===== */
const store = local;
async function call(fn, ...args) {
  let res;
  try {
    res = await fetch(window.ISLAND_API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },   // 用 text/plain 避免跨網域預檢
      body: JSON.stringify({ token: store.get('islandToken'), fn, args })
    });
  } catch (e) {
    throw new Error('連不上小島伺服器，檢查一下網路再試一次');
  }
  const j = await res.json();
  if (j.error === 'unauthorized') { store.del('islandToken'); showPair('配對碼不對或已經更換，請重新輸入'); throw new Error('需要重新配對'); }
  if (j.error) throw new Error(j.error);
  if (j.result && j.result.weeks) store.set('islandCache', JSON.stringify(j.result));
  return j.result;
}
function showPair(msg) {
  document.getElementById('nav').style.display = 'none';
  document.getElementById('app').innerHTML = `<div class="card" style="margin-top:40px"><div class="big">🏝️</div>
    <h2 style="text-align:center">登島配對</h2>

    ${msg ? `<div style="text-align:center;color:var(--plum);margin-top:8px">${esc(msg)}</div>` : ''}
    <label>配對碼</label><input id="pairCode" autocomplete="off" autocapitalize="characters" placeholder="例如 K7MX2QPA" style="text-transform:uppercase;letter-spacing:4px;text-align:center;font-size:22px">
    <div style="margin-top:12px"><button style="width:100%" id="pairGo">登島</button></div></div>`;
  document.getElementById('pairGo').onclick = () => {
    const v = document.getElementById('pairCode').value.trim().toUpperCase();
    if (v.length < 6) return toast('配對碼是 8 個字');

    load();
  };
}
function boot() {
  if (!window.ISLAND_API_URL || /請貼上/.test(window.ISLAND_API_URL)) {
    document.getElementById('app').innerHTML = '<div class="card">還沒設定小島伺服器的網址（config.js）。</div>';
    return;
  }
  if (!store.get('islandToken')) return showPair();
  const cached = store.get('islandCache');
  if (cached) { try { S = JSON.parse(cached); D = derive(S); render(); } catch (e) {} }
  load();
}

/* ===== 家人碼（v2.6）：家人看到的畫面和她一樣，但只能做這幾件事；後端也會再擋一次 ===== */
const FAMILY_FNS = ['getState', 'familyInvite', 'postcardCandidates', 'sendPostcard'];
function isFamily() { return !!(S && S.who && S.who.role === 'family'); }
let familyBase = null;   // 家人模式下最後一次從伺服器拿到的狀態，誤按時用來還原畫面
const callAsOwner = call;
call = function (fn, ...args) {
  if (isFamily() && !FAMILY_FNS.includes(fn)) {
    toast('👀 家人觀看中：這是她的操作，不會改到');
    if (familyBase) { S = JSON.parse(JSON.stringify(familyBase)); D = derive(S); setTimeout(render, 0); }
    return Promise.reject(new Error('家人觀看中・唯讀'));
  }
  return callAsOwner(fn, ...args).then(st => {
    if (st && st.who && st.who.role === 'family' && st.weeks) familyBase = JSON.parse(JSON.stringify(st));
    return st;
  });
};
function toast(msg) {
  const t = document.getElementById('toast');

  clearTimeout(toast.h); toast.h = setTimeout(() => t.style.display = 'none', 2600);
}
async function load(fn, ...args) {
  try {
    S = await call(fn || 'getState', ...args);
    D = derive(S);
    render();

    if (!store.get('islandToken')) return;              // 已經切到配對畫面

    else document.getElementById('app').innerHTML = '<div class="card">讀取失敗：' + esc(e.message || e) + '</div>';

}

/* ===== 日期 ===== */
function parseD(s) { const p = s.split('-').map(Number); return new Date(p[0], p[1] - 1, p[2]); }
function fmtD(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function addD(s, n) { const d = parseD(s); d.setDate(d.getDate() + n); return fmtD(d); }
function mondayOf(s) { const d = parseD(s); const w = (d.getDay() + 6) % 7; d.setDate(d.getDate() - w); return fmtD(d); }
function short(s) { const p = s.split('-'); return Number(p[1]) + '/' + Number(p[2]); }
function assessDate(s) {
  const m = String(s).match(/(\d{4})\D(\d{1,2})\D?(\d{1,2})?/);
  return m ? new Date(+m[1], +m[2] - 1, +(m[3] || 1)) : new Date(0);
}

/* ===== 遊戲數值 ===== */
function isBoss(name) { return /歷屆|模卷|會考|學測/.test(name); }

function derive(S) {
  const save = S.save || {};

  const itemsByRow = {}; S.items.forEach(it => itemsByRow[it.row] = it);

      wxp += u * 10 * (isBoss(it.name) ? 2 : 1);
      if (pts[g] !== undefined) pts[g] += u;
      ptsBy[it.subject] = (ptsBy[it.subject] || 0) + u;
      wp[it.subject] = (wp[it.subject] || 0) + u;
      if (u >= 1 && isBoss(it.name)) bossDone++;
    });
    weekPts.push({ start, pts: wp });
    if (wd.settled) { any = true; wxp += 20; }
    if (wd.settled && wd.total) {
      const ratio = wd.got / wd.total;
      if (ratio >= 1) { wxp += 40; fullCombo++; } else if (ratio >= .8) wxp += 25; else if (ratio >= .5) wxp += 10;

    if (any) {
      recordedWeeks++; streak++; earned++;
      if (earned % 6 === 0) cards++;
    } else if (!isCurrent) {

      else streak = 0;
    }
    best = Math.max(best, streak);
    xp += wxp;

  xp = Math.round(xp); coinXp = Math.round(coinXp);

  const exDays = Object.keys(save).filter(k => k.startsWith('ex:') && save[k]).map(k => k.slice(3)).sort();

  // 砂時計不給經驗值和島幣（Simon，2026-10-25），綠點只從這裡來，種樹那邊用 D.focusGreen 算（開張禮＋focusGreen－種樹花掉的）

  const moveDays = {}; let moveSteps = 0;

  if (exDays.length) {
    for (let w = mondayOf(exDays[0]); w <= curMon; w = addD(w, 7)) {
      if ((exWeeks[w] || 0) >= EX_GOAL) exStreak++;
      else if (w !== curMon) exStreak = 0;   // 這週還沒結束，不算斷
      exBest = Math.max(exBest, exStreak);
    }
  }
  // 紙船（自己檢討）、親子船（爸爸一起）：第一科 2 枚＋20 經驗值，每多一科 +1 枚，一次最多 4 枚；兩種船各自每天算 1 次
  const papers = Object.keys(save).filter(k => k.startsWith('paper:') && save[k]).sort().map(k => Object.assign({ id: k }, save[k]));
  const sessions = []; papers.forEach(x => { let ss = sessions.find(y => y.session === x.session); if (!ss) sessions.push(ss = { session: x.session, kind: x.kind, date: x.at, note: x.note, lanes: [], rows: [] }); ss.lanes.push(x.lane); ss.rows.push(x); });
  const paidDay = {}; let paperCoins = 0;
  sessions.forEach(ss => { const k = ss.kind + ss.date; ss.paid = !paidDay[k]; paidDay[k] = true;
    if (ss.paid) { ss.coins = Math.min(PAPER_MAX, 1 + ss.lanes.length); paperCoins += ss.coins; xp += 20; } });

  const spent = (save.purchases || []).filter(p => !RETIRED_FURN.includes(p.furniture)).reduce((a, p) => a + p.price, 0);   // 退役的家具（會考倒數鐘）退還島幣
  // 經驗值換島幣要她自己按「兌換」（Simon，2026-10-25）；經驗值本身不扣，所以島嶼等級和房子不會因為兌換而降級
  const exXp = save.xpEx ? Math.min(save.xpEx.xp, coinXp) : coinXp;   // 已經換過的經驗值；還沒有紀錄時當作全部換過（舊版是自動換）
  const coins = 20 + Math.floor(exXp / 10) + xqCoins + exCoins + paperCoins - spent;   // 開島禮物 20 枚
  const level = Math.floor(Math.sqrt(xp / 60)) + 1;
  const lvBase = 60 * Math.pow(level - 1, 2), lvNext = 60 * Math.pow(level, 2);

  // 每科最新一次試煉的等級
  const grades = {};
  SUBJECTS.concat(['文']).forEach(s => {
    const rows = S.assessments.filter(a => a[s]).sort((a, b) => assessDate(b.date) - assessDate(a.date));
    grades[s] = rows[0] ? { level: rows[0][s], date: rows[0].date, source: rows[0].source } : null;
  });

  // 島民之間的好感度（跨科連結）
  const bond = {};
  links.forEach(l => { const k = [l.a, l.b].sort().join(''); bond[k] = (bond[k] || 0) + 1; });
  // 跨科連結自動判斷（燈塔，xc:<題目 key>）：AI 判斷做過的任務題用到哪幾科，跨街的才算好感度；不給經驗值和島幣
  const autoLinks = Object.keys(save).filter(k => k.startsWith('xc:') && save[k] && (save[k].lanes || []).length >= 2).sort().map(k => Object.assign({ id: k.slice(3) }, save[k]));
  autoLinks.forEach(x => { const gs = [...new Set(x.lanes.map(l => GROUP[l] || l))].filter(g => SUBJECTS.includes(g)).sort();
    for (let i = 0; i < gs.length; i++) for (let j = i + 1; j < gs.length; j++) { const k = gs[i] + gs[j]; bond[k] = (bond[k] || 0) + 1; } });

  const settledCount = Object.keys(save).filter(k => k.startsWith('settled:')).length;
  const badges = [
    { ic: '🏝️', name: '開島紀念', ok: !!cfg },
    { ic: '📝', name: '第一次確認', ok: settledCount >= 1 },
    { ic: '🔥', name: '連續 4 週', ok: best >= 4 },
    { ic: '🔥', name: '連續 12 週', ok: best >= 12 },
    { ic: '🌋', name: '連續 24 週', ok: best >= 24 },
    { ic: '⚔️', name: 'Boss 獵人 ×5', ok: bossDone >= 5 },
    { ic: '🗡️', name: 'Boss 獵人 ×20', ok: bossDone >= 20 },
    { ic: '🎵', name: 'Full Combo', ok: fullCombo >= 1 },
    { ic: '🎶', name: 'Full Combo ×5', ok: fullCombo >= 5 },
    { ic: '🔗', name: '跨科偵探', ok: links.length >= 3 },
    { ic: '🧭', name: '試煉者 ×10', ok: exams >= 10 },
    { ic: '🎯', name: '任務達人 ×10', ok: questsDone.length >= 10 },
    { ic: '📖', name: '解題高手 ×20', ok: questsRight + xqDone.filter(q => q.correct).length >= 20 },
    { ic: '🪙', name: '加碼挑戰 ×10', ok: xqDone.length >= 10 },
    { ic: '🏰', name: '島嶼 Lv.10', ok: level >= 10 },
    { ic: '🏐', name: '運動集章 ×30', ok: exDays.length >= 30 },
    { ic: '⛵', name: '紙船 ×10', ok: sessions.length >= 10 }
  ];

  return { cfg, xp, coins, coinParts: { gift: 20, coinXp, exXp, fromXp: Math.floor(exXp / 10), canEx: Math.floor((coinXp - exXp) / 10), xqCoins, exCoins, paperCoins, spent }, level, lvBase, lvNext, pts, ptsBy, streak, best, cards, recordedWeeks, grades, bond,
           links, badges, bossDone, fullCombo, log, itemsByRow, questsDone, rates, weekPts,
           exDays, exWeeks, exStreak, exBest, paperSessions: sessions, autoLinks, focusDays, focusGlass, focusGreen: focusGlass * FOCUS_GREEN, moveDays, moveSteps,
           // 綠點（v2.10）：植木屋的開張禮＋讀書計時的砂時計－種樹花掉的；只從計時來，不扣經驗值、不影響等級
           green: (save['keeper:garden'] ? GARDEN_GIFT : 0) + focusGlass * FOCUS_GREEN + moveSteps * MOVE_GREEN - ((save.garden && save.garden.spent) || 0) };
}

function ipic(key, emoji) { const src = imgOf(key); return src ? `<img class="ipic" src="${src}" alt="">` : emoji; }
function resident(s) {

function streets(s) {

function daysAway(s) {

  Object.keys(S.save).filter(k => k.startsWith('log:')).forEach(k => {
    const d = k.slice(4), rows = (S.save[k] && S.save[k].rows) || {};

// 跨科連結自動判斷：答完題後在背景請 AI 判斷，結果存在 xc:<題目 key>，會變成島民之間的好感度
async function crossCheckLater(id, payload) {
  if (isFamily() || !S.save[id] || S.save['xc:' + id] || S.save[id].review) return;
  try {
    const q = S.save[id], p = payload || (q.bank ? { img: await examImage(q.img), ctx: await examImage(q.ctx) } : {});
    if (q.bank && !p.img) return;
    const st = await call('crossCheck', id, p);
    if (st && st.save && st.save['xc:' + id]) {
      S.save['xc:' + id] = st.save['xc:' + id]; D = derive(S);
      const x = S.save['xc:' + id];
      if (x.lanes && x.lanes.length >= 2) toast('🔗 這題是跨科題（' + x.lanes.join(' × ') + '）' + (new Set(x.lanes.map(l => GROUP[l] || l)).size >= 2 ? '，島民的好感度上升了！' : '，記進跨科連結了'));

}

  mid: { name: '中級', ic: '🔥', xp: 15, coins: 2 },
  adv: { name: '進階', ic: '💎', xp: 20, coins: 3 }

function laneLabel(l) { return SUBS[GROUP[l]] ? l + '巷' : SUBJECT_NAME[l] + '街'; }
function extraQuests() { return Object.keys(S.save).filter(k => k.startsWith('xq:') && S.save[k]).sort().map(k => Object.assign({ id: k }, S.save[k])); }
function todayChallenges() { return extraQuests().filter(q => q.tier && q.date === S.today); }
// 會考考古題題庫（網頁 App 版的 exam/ 資料夾）；拿不到時改由 AI 出題
const TIER_KEY = { 基礎: 'basic', 中級: 'mid', 進階: 'adv' };
let examBank = null;
function loadBank() {
  if (!examBank) examBank = BETA3D ? fetch('exam/bank.json').then(r => r.ok ? r.json() : null).catch(() => null) : Promise.resolve(null);
  return examBank;
}
async function pickBank(tier, lane) {
  const b = await loadBank(); if (!b || !b.items) return null;
  const used = new Set(extraQuests().map(q => q.bank).filter(Boolean));
  const list = b.items.filter(x => TIER_KEY[x.tier] === tier && (!lane || x.lane === lane) && !used.has(x.id));
  return list.length ? list[Math.floor(Math.random() * list.length)] : null;
}

async function challengeXq(tier) {
  if (xqBusy || todayChallenges().length >= XQ_DAILY) return;
  const sel = document.getElementById('xqLane'), chosen = sel && sel.value;
  xqBusy = true; softRender();
  try {
    await flush();
    const item = await pickBank(tier, chosen);   // 先從考古題挑，挑不到（題庫用完或沒有題庫）才請 AI 出
    if (item) S = await call('challengeBank', item);
    else {
      const lane = chosen || pickQuest(S.today, 50 + extraQuests().length).lane;
      const who = laneWho(lane), r = resident(GROUP[lane] || lane);
      S = await call('challengeQuest', lane, { name: who.name, personality: r.personality }, tier);
    }
    D = derive(S);
  } catch (e) { toast('出題失敗：' + (e.message || e)); }
  xqBusy = false; softRender();
  const el = document.getElementById('xqCard'); if (el) el.scrollIntoView({ block: 'start' });
}
async function answerXq(id, i) {
  document.querySelectorAll('#xqCard .opt').forEach(b => b.disabled = true);
  try {
    S = await call('answerQuest', id, i); D = derive(S);
    const q = S.save[id]; toast(q.lantern ? '🏮 變成紙燈籠了！🪙 +' + q.coins + '、+' + q.xp + ' 經驗值' : q.correct ? '答對了！' + (q.coins ? '🪙 +' + q.coins + '、' : '') + '+' + q.xp + ' 經驗值 🎉' : '+' + q.xp + ' 經驗值，看看解說吧');
    if (!q.review) crossCheckLater(id);
  } catch (e) { toast('送出失敗：' + (e.message || e)); }
  softRender();
}

function seeded(n) { let x = n >>> 0; return () => (x = (x * 1664525 + 1013904223) >>> 0) / 4294967296; }

// 依日期和換題次數抽一條巷子：比較少讀的巷子、最近沒出過題的巷子比較容易被抽到
function pickQuest(date, rerolls, avoid) {
  const vals = QLANES.map(l => D.ptsBy[l] || 0).sort((a, b) => a - b), median = vals[Math.floor(vals.length / 2)];
  const recent = questHistory().filter(q => q.at >= addD(date, -3)).map(q => q.lane);
  const cands = QLANES.filter(l => l !== avoid).map(l => {
    let w = 1;
    if ((D.ptsBy[l] || 0) < median) w *= 2.5;
    if (recent.includes(l)) w *= 0.3;
    return { l, w };
  });
  const total = cands.reduce((a, c) => a + c.w, 0);
  const r = seeded(date.split('-').reduce((a, x) => a * 37 + Number(x), 11) + rerolls * 7919);
  r(); let t = r() * total, lane = cands[cands.length - 1].l;
  for (const c of cands) { t -= c.w; if (t <= 0) { lane = c.l; break; } }
  // 這條巷子還沒答對的題目先出；全部答對過就從頭再輪
  const right = questHistory().filter(q => q.lane === lane && q.correct).map(q => q.qid);
  const bank = QUESTS[lane];
  let idx = bank.findIndex((_, i) => !right.includes(lane + ':' + i));
  if (idx < 0) idx = right.length % bank.length;
  return { lane, idx, qid: lane + ':' + idx, chapter: right.length + 1 };
}
function todayQuest() {

  if (saved && saved.qid && QUESTS[saved.lane]) {
    const idx = Number(saved.qid.split(':')[1]);
    p = { lane: saved.lane, idx, qid: saved.qid, chapter: questHistory().filter(q => q.lane === saved.lane && q.correct && q.at < S.today).length + 1 };
  } else p = pickQuest(S.today, rerolls);

function weekData(wk) {
  const plan = planOf(wk), planned = {}, done = {}, add = (o, r, v) => o[r] = (o[r] || 0) + v;

/* --- 同步：改動先顯示在畫面上，稍後在背景寫回試算表 --- */
const pending = {};

    const mine = S.save;

    D = derive(S);

/* --- 運動計時（v2.12）：海邊步道按「出發／回來了」；計時中的狀態存在 localStorage（moveActive），回來了、存好才寫回 move:日期 --- */
const MOVE_STEP = 25, MOVE_GREEN = 10, MOVE_CAP = 2, MOVE_MAX = 120, MOVE_STAMP = 20, MOVE_MIN = 5;   // 一個足あと幾分鐘、幾綠點、一天最多幾個、一次最多算幾分鐘、滿幾分鐘自動蓋章、少於幾分鐘先問
function moveActive() { if (isFamily()) return null; try { return JSON.parse(local.get('moveActive') || 'null'); } catch (e) { return null; } }

/* --- 拍照讀手寫計畫 --- */
function shrinkPhoto(file) {
  return new Promise((ok, bad) => {
    const img = new Image();
    img.onload = () => {
      const k = Math.min(1, 2000 / Math.max(img.width, img.height));
      const cv = document.createElement('canvas'); cv.width = Math.round(img.width * k); cv.height = Math.round(img.height * k);
      const g = cv.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, cv.width, cv.height); g.drawImage(img, 0, 0, cv.width, cv.height);
      ok(cv.toDataURL('image/jpeg', 0.85));
    };
    img.onerror = () => bad(new Error('讀不到這張照片'));
    img.src = URL.createObjectURL(file);
  });
}

const DEFAULT_ABBR = {
  map: { '理複': '理化・複講-1回', '歷圖': '歷史・圖表集', '地主': '地理・主題式全攻略', '英藍': '英・藍文法', '英dragon': '英・龍-文法',
         '國3688': '國・3688', '英3688': '英・3688', '社3688': '社會・模卷／３６８８', '自3688': '自然・3688-1回', '數3688': '數・3688-1單元',
         'Wei M': '數・wei', 'Wei S': '理化・wei', 'online': '國・online-2單元', '地科': '地科・講義', 'S英': '英・空英',
         '國三': { mode: 'all', names: ['國・online-2單元', '國・閱策', '國・成語'] },
         'Wei H': { mode: 'pick', names: ['數・wei', '理化・wei'] } },
  ignore: ['violin']
};
// 字典的一筆統一成 { rows, mode }：mode 'all' 是全部都要做，'pick' 是其中一項、之後才知道
function abbrEntry(v) { return typeof v === 'object' && v ? { rows: (v.rows || []).slice(), mode: v.mode || 'all' } : { rows: [Number(v)], mode: 'all' }; }
function abbrName(v) {
  const e = abbrEntry(v), names = e.rows.map(r => D.itemsByRow[r]).map(it => it ? it.subject + '・' + it.name : '（找不到）');
  return names.join(e.mode === 'pick' ? ' 或 ' : ' ＋ ') + (e.mode === 'pick' && names.length > 1 ? '（上課後再選）' : '');
}
function abbrOf() {
  if (S.save.abbr) return JSON.parse(JSON.stringify({ map: S.save.abbr.map || {}, ignore: S.save.abbr.ignore || [] }));
  const find = n => { const [sub, name] = n.split('・'), it = S.items.find(i => i.subject === sub && i.name === name); return it && it.row; };
  const map = {};
  Object.keys(DEFAULT_ABBR.map).forEach(k => {
    const v = DEFAULT_ABBR.map[k];
    if (typeof v === 'string') { const r = find(v); if (r) map[k] = r; }
    else { const rows = v.names.map(find).filter(Boolean); if (rows.length) map[k] = rows.length > 1 ? { rows, mode: v.mode } : rows[0]; }
  });
  return { map, ignore: DEFAULT_ABBR.ignore.slice() };
}
// 第一次用 v2：國文加上「成語」這一項，再存好預設的寫法字典
let seeding = false;
async function seedDefaults() {
  if (isFamily()) return;
  if (S && S.save.abbr) migrateAbbr();
  if (S && D && D.cfg) migrateXpEx();
  if (seeding || !S || S.save.abbr || !D.cfg) return;
  seeding = true;
  try {
    await flush();
    if (S.items.some(i => i.subject === '國') && !S.items.some(i => i.subject === '國' && i.name === '成語')) { S = await call('addItem', '國', '成語'); D = derive(S); }
    S = await call('saveAbbr', abbrOf()); D = derive(S);
    if (tab === 'home') softRender(); else if (tab === 'abbr' || tab === 'items' || tab === 'plan') render();
  } catch (e) { /* 下次打開再試 */ } finally { seeding = false; }
}
function migrateAbbr() {
  const a = S.save.abbr;
  if (a && (a.ignore || []).includes('運動')) setAbbr(Object.assign({}, a, { ignore: a.ignore.filter(x => x !== '運動') }));
}
function setAbbr(a) { S.save.abbr = a; queueSave('abbr', 'saveAbbr', a); }
function itemSelect(id) {
  let html = `<select id="${id}"><option value="">選一個項目…</option>`, last = '';
  S.items.forEach(it => {
    if (it.subject !== last) { html += (last ? '</optgroup>' : '') + `<optgroup label="${esc(it.subject)}">`; last = it.subject; }
    html += `<option value="${it.row}">${esc(it.subject)}・${esc(it.name)}</option>`;
  });
  return html + '</optgroup></select>';
}

    toast('讀不出來：' + (e.message || e));

}

    ${r.unknown.length ? `<div class="card"><h3>🤔 這些看不懂</h3>

function scanDrop(i, x) {
  const r = draft.scan;
  const keep = y => String(y) !== String(x);
  if (i < 0) r.tray = r.tray.filter(keep);
  else { r.days[i] = r.days[i].filter(keep); r.done[i] = r.done[i].filter(keep); }
  render();
}
// 教島民一個新寫法：記進字典，並把這一項排進那天
function scanTeach(k) {
  const r = draft.scan, u = r.unknown[k], row = Number(document.getElementById('unk' + k).value);
  if (!row) return toast('先選它是哪一項');
  const a = abbrOf(); a.map[u.text] = row; setAbbr(a);
  if (u.day >= 0) { if (!r.days[u.day].includes(row)) r.days[u.day].push(row); if (u.done && !r.done[u.day].includes(row)) r.done[u.day].push(row); }
  else if (!r.tray.includes(row)) r.tray.push(row);
  r.unknown.splice(k, 1);
  toast('記住了！下次看到「' + u.text + '」就知道'); render();
}
function scanIgnore(k) {
  const r = draft.scan, u = r.unknown[k], a = abbrOf();
  if (!a.ignore.includes(u.text)) a.ignore.push(u.text);
  setAbbr(a); r.unknown.splice(k, 1);
  toast('好，以後看到「' + u.text + '」就略過'); render();
}
function applyScan(merge) {
  const r = draft.scan, wk = draft.week, cur = planOf(wk);
  const uniq = a => [...new Set(a)];
  const plan = merge ? { days: cur.days.map((d, i) => uniq(d.concat(r.days[i]))), tray: uniq(cur.tray.concat(r.tray)) } : { days: r.days.map(uniq), tray: uniq(r.tray) };
  setPlan(wk, plan);
  // 照片上打勾（或劃掉）的項目，今天以前的日子直接記成完成
  let logged = 0;
  DAYS.forEach((_, i) => {
    const date = addD(wk, i); if (date > S.today) return;
    const rows = (draft.markDone ? r.done[i] : []).filter(x => !isPending(x) && r.days[i].includes(x));
    if (!rows.length) return;
    const lg = Object.assign({}, logOf(date)); rows.forEach(x => { lg[x] = 2; logged++; });
    S.save['log:' + date] = { rows: lg }; queueSave('log:' + date, 'logDay', date, lg);
  });
  // 計畫本上「運動」有打勾的日子，自動蓋運動章
  let stamped = 0;
  (r.exercise || []).forEach((v, i) => {
    const date = addD(wk, i); if (v !== 'done' || date > S.today || S.save['ex:' + date]) return;
    S.save['ex:' + date] = { at: S.today, src: 'scan' }; queueSave('ex:' + date, 'saveExercise', date, true, 'scan'); stamped++;
  });
  D = derive(S); flush().catch(() => {});
  planWeek = wk; planDay = null; draft = {}; tab = 'plan';
  toast((logged ? '計畫排好了，也記下 ' + logged + ' 個打勾的項目！' : '計畫排好了！') + (stamped ? '運動章蓋了 ' + stamped + ' 個 🏃' : '')); render(); window.scrollTo(0, 0);
}

function abbrKeep() {
  const k = document.getElementById('abK'), m = document.getElementById('abM');
  if (k) draft.abK = k.value; if (m) draft.abM = m.value;
}
function abbrPush() {
  const r = Number(document.getElementById('abR').value); if (!r) return toast('先選一個項目');
  abbrKeep(); draft.abRows = draft.abRows || [];
  if (!draft.abRows.includes(r)) draft.abRows.push(r);
  render();
}
function abbrAdd() {
  abbrKeep();
  const k = (draft.abK || '').trim(), rows = (draft.abRows || []).slice(), cur = Number(document.getElementById('abR').value);
  if (cur && !rows.includes(cur)) rows.push(cur);
  if (!k || !rows.length) return toast('寫法和項目都要填');
  const a = abbrOf();
  a.map[k] = rows.length === 1 ? rows[0] : { rows, mode: draft.abM === 'pick' ? 'pick' : 'all' };
  setAbbr(a); draft = {}; toast('記住「' + k + '」了'); render();
}
function abbrIgnore() {
  const x = document.getElementById('abI').value.trim(); if (!x) return;
  const a = abbrOf(); if (!a.ignore.includes(x)) a.ignore.push(x); abbrKeep(); setAbbr(a); render();
}
function abbrDel(kind, k) {
  const a = abbrOf();
  if (kind === 'map') delete a.map[k]; else a.ignore = a.ignore.filter(x => x !== k);
  abbrKeep(); setAbbr(a); render();
}

function bindConfirm() {
  const $ = id => document.getElementById(id), c = draft.counts;
  document.querySelectorAll('.step').forEach(st => st.onclick = e => {
    const b = e.target.closest('button'); if (!b) return;
    const r = Number(st.dataset.row), v = c[r] || 0;
    let n = b.dataset.d === 'half' ? (v % 1 ? v - 0.5 : v + 0.5) : Math.max(0, v + Number(b.dataset.d));
    n = Math.min(n, 14);
    if (n > 0) c[r] = n; else delete c[r];
    draft.note = $('note').value; render();
  });
  $('doConfirm').onclick = async () => {

async function loadCands(cat, q) {
  draft.cat = cat || draft.cat || 'potd'; draft.q = (q || '').trim(); draft.cands = 'loading'; draft.pick = null; render();
  try { draft.cands = await call('postcardCandidates', draft.cat, draft.q); } catch (e) { draft.cands = []; toast(e.message || String(e)); }
  if (tab === 'postcard') render();
}
async function sendCard() {
  const c = draft.cands[draft.pick]; if (!c) return;
  const btn = document.getElementById('sendCard'); if (btn) { btn.disabled = true; btn.textContent = '📮 郵差出發中…'; }
  try {
    S = await call('sendPostcard', Object.assign({}, c, { note: (draft.cardNote || '').trim() }), draft.cat);
    D = derive(S); draft = {}; toast('寄出了！她打開小島時會收到'); go('cards');
  } catch (e) { toast(e.message || String(e)); if (btn) { btn.disabled = false; btn.textContent = '📮 寄出'; } }
}

/* --- 自訂圖片：裁成正方形並縮小，才能存進試算表的一格 --- */
function shrinkImage(file) {
  return new Promise((ok, bad) => {
    const img = new Image();
    img.onload = () => {
      const tryEncode = (size, type, q) => {
        const cv = document.createElement('canvas'); cv.width = cv.height = size;
        const ctx = cv.getContext('2d');
        if (type === 'image/jpeg') { ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, size, size); }
        const m = Math.min(img.width, img.height);
        ctx.drawImage(img, (img.width - m) / 2, (img.height - m) / 2, m, m, 0, 0, size, size);
        return cv.toDataURL(type, q);
      };
      const tries = [[160, 'image/webp', .85], [160, 'image/png'], [128, 'image/webp', .7], [128, 'image/jpeg', .8], [96, 'image/jpeg', .7]];
      for (const t of tries) {
        const url = tryEncode(...t);
        if (url.startsWith('data:' + t[1]) && url.length < 45000) return ok(url);
      }
      bad(new Error('圖片太複雜了，換一張試試'));
    };
    img.onerror = () => bad(new Error('讀不到這張圖片'));
    img.src = URL.createObjectURL(file);
  });
}

  <div class="card"><h3>1. 島的名字</h3><input data-f="islandName" value="${esc(c.islandName)}" placeholder="例如：呱呱島"></div>

    <label>名字</label><input data-f="guide.name" value="${esc(c.guide.name)}">
    <label>長相</label>${pick('guide.emoji', c.guide.emoji)}${upl('guide')}
    <label>說話風格</label><select data-f="guide.tone">${Object.entries(TONES).map(([k, v]) => `<option value="${k}" ${c.guide.tone === k ? 'selected' : ''}>${v}</option>`).join('')}</select></div>
  <div class="card"><h3>3. 五位島民</h3><div class="muted">每一科住著一位島民。你讀那一科，就是在培養他。</div>
    ${SUBJECTS.map(s => { const r = c.residents[s]; return `<div style="border-top:1px dashed var(--plum-light);margin-top:12px;padding-top:8px">
      <b>${SUBJECT_NAME[s]}街</b>

      <label>長相</label>${pick('residents.' + s + '.emoji', r.emoji)}${upl(s)}
      <label>個性</label><input data-f="residents.${s}.personality" value="${esc(r.personality)}" placeholder="例如：嘴硬心軟">
      <label>和其他島民的關係</label><input data-f="residents.${s}.relation" value="${esc(r.relation)}" placeholder="例如：跟數學是青梅竹馬">
      ${SUBS[s] ? `<label>室友（選填）：島民是${SUBJECT_NAME[s]}街的街長；${SUBS[s].join('、')}各有一條小巷，可以各住一位室友當巷長。不填就顯示科目名稱。</label>

          <input class="grow" data-f="roommates.${sub}.name" value="${esc(c.roommates[sub].name)}" placeholder="名字"></div>${upl('sub:' + sub)}`).join('')}` : ''}</div>`; }).join('')}</div>

function setPath(obj, path, val) {
  const k = path.split('.'); let o = obj;
  for (let i = 0; i < k.length - 1; i++) o = o[k[i]];
  o[k[k.length - 1]] = val;
}
function bindSetup() {
  const c = draft.cfg;
  document.querySelectorAll('[data-f]').forEach(el => el.oninput = el.onchange = () =>
    setPath(c, el.dataset.f, el.type === 'number' ? Number(el.value) : el.value));
  document.querySelectorAll('.emojis').forEach(box => box.onclick = e => {
    const b = e.target.closest('button'); if (!b) return;
    setPath(c, box.dataset.key, b.textContent);
    box.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b));
  });
  document.querySelectorAll('.upl').forEach(box => {
    const key = box.dataset.img;
    box.querySelector('input').onchange = async e => {
      const f = e.target.files[0]; if (!f) return;
      toast('圖片處理中…');
      try { S = await call('saveImage', key, await shrinkImage(f)); D = derive(S); toast('圖片換好了！'); render(); }
      catch (err) { toast('圖片上傳失敗：' + (err.message || err)); }
    };
    const del = box.querySelector('[data-del]');
    if (del) del.onclick = async () => { S = await call('saveImage', key, ''); D = derive(S); render(); };
  });
  document.getElementById('addShop').onclick = () => { c.shop.push({ name: '', price: 10 }); render(); };
  document.getElementById('saveCfg').onclick = async () => {
    if (!c.islandName.trim()) return toast('先幫島取個名字吧');
    c.shop = c.shop.filter(x => x.name.trim());
    document.getElementById('saveCfg').disabled = true;
    const first = !D.cfg;
    S = await call('saveConfig', c); D = derive(S);
    toast(first ? '🏝️ ' + c.islandName + ' 開島成功！' : '設定已儲存');
    if (first) local.set('islandSeenVersion', APP_VERSION);
    go(first ? 'guide' : 'home');
  };
}

/* --- 台北的即時時間與天氣（Open-Meteo，免金鑰）：讓小島跟著天色和天氣變化 --- */
const env = { phase: 'day', hhmm: '', weather: null, temp: null };
const WEATHER_URL = 'https://api.open-meteo.com/v1/forecast?latitude=25.03&longitude=121.56&current=temperature_2m,weather_code,is_day&timezone=Asia%2FTaipei';
const WEATHER_ICON = { clear: '☀️', cloudy: '⛅', fog: '🌫️', rain: '🌧️', storm: '⛈️' };
const WEATHER_NAME = { clear: '晴', cloudy: '多雲', fog: '起霧', rain: '下雨', storm: '雷雨' };
const PHASE_ICON = { dawn: '🌅', day: '🏝️', dusk: '🌇', night: '🌙' };
function taipeiClock() {
  const parts = new Intl.DateTimeFormat('en-GB', { timeZone: 'Asia/Taipei', hour: '2-digit', minute: '2-digit', hour12: false }).formatToParts(new Date());
  const h = Number(parts.find(p => p.type === 'hour').value) % 24, m = parts.find(p => p.type === 'minute').value;
  return { h, hhmm: String(h).padStart(2, '0') + ':' + m };
}
function phaseOf(h) { return h >= 19 || h < 5 ? 'night' : h < 7 ? 'dawn' : h < 17 ? 'day' : 'dusk'; }
function weatherKind(code) {
  if (code >= 95) return 'storm';
  if ((code >= 51 && code <= 67) || (code >= 80 && code <= 82) || (code >= 71 && code <= 77) || code === 85 || code === 86) return 'rain';
  if (code === 45 || code === 48) return 'fog';
  if (code >= 2) return 'cloudy';
  return 'clear';
}
// 二十四節氣（台灣常用的日期，前後差一天沒關係）：整座島的草地、樹葉和飄落物跟著變
const TERMS = [['小寒', 1, 6], ['大寒', 1, 20], ['立春', 2, 4], ['雨水', 2, 19], ['驚蟄', 3, 6], ['春分', 3, 21], ['清明', 4, 5], ['穀雨', 4, 20],
  ['立夏', 5, 6], ['小滿', 5, 21], ['芒種', 6, 6], ['夏至', 6, 21], ['小暑', 7, 7], ['大暑', 7, 23], ['立秋', 8, 8], ['處暑', 8, 23],
  ['白露', 9, 8], ['秋分', 9, 23], ['寒露', 10, 8], ['霜降', 10, 23], ['立冬', 11, 7], ['小雪', 11, 22], ['大雪', 12, 7], ['冬至', 12, 22]];
const TERM_NOTE = {
  立春: '春天開始了，樹梢冒出淡淡的粉紅', 雨水: '春雨來了，第一批櫻花開始飄', 驚蟄: '春雷叫醒了小蟲，櫻花正盛', 春分: '晝夜一樣長，滿島櫻花',
  清明: '櫻花吹雪的最後幾天', 穀雨: '雨水滋潤新綠，櫻花謝了', 立夏: '夏天開始，島上一片新綠', 小滿: '麥子漸漸飽滿，樹葉更深了',
  芒種: '梅雨季，晚上有螢火蟲', 夏至: '一年白天最長的一天，晚上螢火蟲最多', 小暑: '熱起來了，夜裡螢火蟲還在', 大暑: '一年最熱的時候，記得多喝水',
  立秋: '秋天開始，暑氣還沒退', 處暑: '暑氣慢慢退了，有幾片葉子轉黃', 白露: '早晚涼了，葉子開始變色', 秋分: '晝夜又一樣長，島上一半轉黃',
  寒露: '楓葉轉紅，開始飄落', 霜降: '楓紅最美的時候，滿地紅葉', 立冬: '冬天開始，最後一批楓葉', 小雪: '天氣涼了，樹葉安靜下來',
  大雪: '台灣不下雪，島上換上深綠的冬裝', 冬至: '一年夜晚最長，吃湯圓的日子', 小寒: '寒流來了，山茶花開', 大寒: '一年最冷的時候，早開的櫻花在等春天'
};
function solarTerm(date) {
  const d = parseD(date), m = d.getMonth() + 1, day = d.getDate();
  let t = '冬至'; TERMS.forEach(x => { if (m > x[1] || (m === x[1] && day >= x[2])) t = x[0]; });
  return t;
}
function termIcon(t) { const i = TERMS.findIndex(x => x[0] === t); return ['❄️', '❄️', '🌸', '🌸', '🌸', '🌸', '🌸', '🌱', '🌿', '🌿', '🌿', '🌿', '🌿', '🌿', '🌾', '🌾', '🌾', '🌾', '🍁', '🍁', '🍁', '🍂', '❄️', '❄️'][i] || '🌿'; }
function envText() {
  const ph = env.phase === 'night' && env.weather === 'clear' ? '🌙' : (env.weather ? WEATHER_ICON[env.weather] : PHASE_ICON[env.phase]);
  const t = S && S.today ? solarTerm(S.today) : '';
  return `${ph} 台北 ${env.hhmm}${env.temp != null ? '・' + WEATHER_NAME[env.weather] + ' ' + env.temp + '°C' : ''}${t ? '・' + termIcon(t) + t : ''}`;
}
function updateEnv() {
  const t = taipeiClock();
  env.hhmm = t.hhmm; env.phase = phaseOf(t.h);
  const chip = document.getElementById('envChip'); if (chip) chip.textContent = envText();
  if (window.Island3D && Island3D.setEnvironment) Island3D.setEnvironment({ phase: env.phase, weather: env.weather || 'clear' });
}
async function fetchWeather() {
  try {
    const j = await (await fetch(WEATHER_URL)).json();
    env.temp = Math.round(j.current.temperature_2m);
    env.weather = weatherKind(Number(j.current.weather_code));
  } catch (e) { /* 沒網路就只跟著時間變化 */ }
  updateEnv();
}
updateEnv(); fetchWeather();
setInterval(updateEnv, 60 * 1000);
setInterval(fetchWeather, 10 * 60 * 1000);

boot();
</script>
